=\"821\" y=\"159.9\" width=\"12\" height=\"0.5\" style=\"fill:var(--primary)\"/><rect x=\"839\" y=\"160\" width=\"12\" height=\"0.5\" style=\"fill:var(--primary)\"/><rect x=\"857\" y=\"160\" width=\"12\" height=\"0.5\" style=\"fill:var(--primary)\"/><line x1=\"693\" y1=\"160\" x2=\"875\" y2=\"160\" class=\"s-line\" style=\"stroke-width:1.2\"/><text x=\"695\" y=\"175\" class=\"s-s\" style=\"font-size:11px\">terbaru</text><text x=\"875\" y=\"175\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">lebih lama →</text></svg><figcaption>Bobot tiap observasi masa lalu dalam ramalan. SES: bobot α(1 − α)<sup>j</sup> mengecil eksponensial (Hyndman &amp; Athanasopoulos, 2021, §8.1). Ilustrasi dosen.</figcaption></figure><p style=\"margin-top:.3em\">Data baru lebih penting, tetapi data lama tidak dibuang: bobot <b>mengecil eksponensial</b>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">SES</span><span>Indikator 3</span></div><h2>Simple exponential smoothing</h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Forecasts produced using exponential smoothing methods are weighted averages of past observations, with the weights decaying exponentially as the observations get older.\"</p><p class=\"tr\">\"Ramalan-ramalan yang dihasilkan dengan memakai metode-metode exponential smoothing adalah rata-rata tertimbang dari observasi-observasi masa lalu, dengan bobot-bobot yang meluruh secara eksponensial seiring observasi-observasi itu menjadi makin lama.\"</p><div class=\"src\">Hyndman &amp; Athanasopoulos (2021, bab 8); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 7V4H6l6 8-6 8h12v-3\"/></svg>Bentuk komponen <button type=\"button\" class=\"term\" data-term=\"ses\">SES</button></h3><p style=\"font-family:var(--mono);font-size:.78em;line-height:1.7\">ramalan: ŷ<sub>t+h|t</sub> = ℓ<sub>t</sub><br>pemulusan: ℓ<sub>t</sub> = α·y<sub>t</sub> + (1 − α)·ℓ<sub>t−1</sub></p><ul style=\"font-size:.9em\"><li><button type=\"button\" class=\"term\" data-term=\"level\">Level</button> ℓ<sub>t</sub>; <button type=\"button\" class=\"term\" data-term=\"smoothing-parameter\">α</button> antara 0 dan 1.</li><li>Ramalan <b>datar</b> untuk semua horizon.</li><li>α dan ℓ<sub>0</sub> dipilih dengan meminimalkan <button type=\"button\" class=\"term\" data-term=\"sse\">SSE</button>.</li></ul><p class=\"muted\" style=\"font-size:.8em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §8.1)</span></p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 3 · data ilustrasi · geser α</span></div><h2>Coba sendiri: SES langkah demi langkah</h2><div class=\"sim sim-ses\" data-sim=\"ses\" data-cfg=\"{&quot;id&quot;:&quot;p5-ses&quot;,&quot;y&quot;:[46,56,45,54,36,45,47,55,66,75,73,57,66,69,49,68],&quot;lab&quot;:&quot;M&quot;,&quot;a&quot;:0.2,&quot;best&quot;:[0.5,1674.708377122879]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Tiket helpdesk UPT TIK per minggu, 16 minggu; volume naik mulai minggu ke-9 (awal perkuliahan). Kasus dan data ilustrasi. ℓ<sub>1</sub> = y<sub>1</sub> (definisi kerja untuk hitung tangan).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tren</span><span>Indikator 3</span></div><h2>Metode tren Holt dan tren teredam</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg><button type=\"button\" class=\"term\" data-term=\"holt-linear\">Holt linear trend</button></h3><p style=\"font-family:var(--mono);font-size:.74em;line-height:1.75\">ŷ<sub>t+h|t</sub> = ℓ<sub>t</sub> + h·b<sub>t</sub><br>ℓ<sub>t</sub> = α·y<sub>t</sub> + (1 − α)(ℓ<sub>t−1</sub> + b<sub>t−1</sub>)<br>b<sub>t</sub> = β*(ℓ<sub>t</sub> − ℓ<sub>t−1</sub>) + (1 − β*)·b<sub>t−1</sub></p><p style=\"font-size:.9em\">Ramalan berupa <b>garis lurus</b> naik atau turun.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0\"/></svg><button type=\"button\" class=\"term\" data-term=\"damped-trend\">Damped trend</button></h3><p style=\"font-family:var(--mono);font-size:.74em;line-height:1.75\">ŷ<sub>t+h|t</sub> = ℓ<sub>t</sub> + (φ + φ<sup>2</sup> + … + φ<sup>h</sup>)·b<sub>t</sub></p><p style=\"font-size:.9em\">0 &lt; φ &lt; 1: tren makin melandai, ramalan jangka panjang <b>mendatar</b>. Sering lebih aman untuk horizon panjang.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §8.2)</span></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Holt-Winters</span><span>Indikator 3</span></div><h2>Holt-Winters aditif dan multiplikatif</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th></th><th>Aditif</th><th>Multiplikatif</th></tr></thead><tbody><tr><td><b>Ramalan</b></td><td style=\"font-family:var(--mono);font-size:.86em\">ℓ<sub>t</sub> + h·b<sub>t</sub> + s<sub>t+h−m(k+1)</sub></td><td style=\"font-family:var(--mono);font-size:.86em\">(ℓ<sub>t</sub> + h·b<sub>t</sub>)·s<sub>t+h−m(k+1)</sub></td></tr><tr><td><b>Level</b></td><td style=\"font-family:var(--mono);font-size:.86em\">α(y<sub>t</sub> − s<sub>t−m</sub>) + (1−α)(ℓ<sub>t−1</sub> + b<sub>t−1</sub>)</td><td style=\"font-family:var(--mono);font-size:.86em\">α·y<sub>t</sub>/s<sub>t−m</sub> + (1−α)(ℓ<sub>t−1</sub> + b<sub>t−1</sub>)</td></tr><tr><td><b>Tren</b></td><td colspan=\"2\" style=\"font-family:var(--mono);font-size:.86em\">β*(ℓ<sub>t</sub> − ℓ<sub>t−1</sub>) + (1−β*)·b<sub>t−1</sub></td></tr><tr><td><b>Musiman</b></td><td style=\"font-family:var(--mono);font-size:.86em\">γ(y<sub>t</sub> − ℓ<sub>t−1</sub> − b<sub>t−1</sub>) + (1−γ)·s<sub>t−m</sub></td><td style=\"font-family:var(--mono);font-size:.86em\">γ·y<sub>t</sub>/(ℓ<sub>t−1</sub> + b<sub>t−1</sub>) + (1−γ)·s<sub>t−m</sub></td></tr><tr><td><b>Indeks musiman</b></td><td>dalam satuan data; jumlah setahun ≈ 0</td><td>berupa rasio; rata-rata setahun ≈ 1</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">m: periode musiman · k: bagian bulat (h − 1)/m · γ: parameter musiman. Rumus sesuai Hyndman &amp; Athanasopoulos (2021, §8.3).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 3 · angka ilustrasi · tekan Play</span></div><h2>Satu langkah Holt-Winters multiplikatif</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p5-hw&quot;,&quot;ms&quot;:3200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Keadaan awal&quot;,&quot;en&quot;:&quot;t − 1&quot;,&quot;d&quot;:&quot;Level ℓ&lt;sub&gt;t−1&lt;/sub&gt; = 1.000; tren b&lt;sub&gt;t−1&lt;/sub&gt; = 20; indeks musiman bulan ini tahun lalu s&lt;sub&gt;t−m&lt;/sub&gt; = 1,20. Parameter α = 0,3; β* = 0,1; γ = 0,2.&quot;,&quot;ex&quot;:&quot;Data baru bulan ini: y&lt;sub&gt;t&lt;/sub&gt; = 1.260 kotak.&quot;},{&quot;t&quot;:&quot;Perbarui level&quot;,&quot;en&quot;:&quot;level&quot;,&quot;d&quot;:&quot;ℓ&lt;sub&gt;t&lt;/sub&gt; = α·y&lt;sub&gt;t&lt;/sub&gt;/s&lt;sub&gt;t−m&lt;/sub&gt; + (1 − α)(ℓ&lt;sub&gt;t−1&lt;/sub&gt; + b&lt;sub&gt;t−1&lt;/sub&gt;) = 0,3 × 1.260/1,20 + 0,7 × 1.020 = 315 + 714 = &lt;b&gt;1.029&lt;/b&gt;&quot;,&quot;ex&quot;:&quot;1.260/1,20 = 1.050: penjualan bulan ini setelah efek musiman dikeluarkan.&quot;},{&quot;t&quot;:&quot;Perbarui tren&quot;,&quot;en&quot;:&quot;trend&quot;,&quot;d&quot;:&quot;b&lt;sub&gt;t&lt;/sub&gt; = β*(ℓ&lt;sub&gt;t&lt;/sub&gt; − ℓ&lt;sub&gt;t−1&lt;/sub&gt;) + (1 − β*)·b&lt;sub&gt;t−1&lt;/sub&gt; = 0,1 × 29 + 0,9 × 20 = 2,9 + 18 = &lt;b&gt;20,9&lt;/b&gt;&quot;,&quot;ex&quot;:&quot;Level naik 29, lebih cepat dari tren lama 20, jadi tren ikut naik sedikit.&quot;},{&quot;t&quot;:&quot;Perbarui musiman&quot;,&quot;en&quot;:&quot;season&quot;,&quot;d&quot;:&quot;s&lt;sub&gt;t&lt;/sub&gt; = γ·y&lt;sub&gt;t&lt;/sub&gt;/(ℓ&lt;sub&gt;t−1&lt;/sub&gt; + b&lt;sub&gt;t−1&lt;/sub&gt;) + (1 − γ)·s&lt;sub&gt;t−m&lt;/sub&gt; = 0,2 × 1.260/1.020 + 0,8 × 1,20 = 0,2471 + 0,96 = &lt;b&gt;1,2071&lt;/b&gt;&quot;,&quot;ex&quot;:&quot;Versi Winters/artikel memakai ℓ&lt;sub&gt;t&lt;/sub&gt;: 0,2 × 1.260/1.029 + 0,96 = 1,2049.&quot;},{&quot;t&quot;:&quot;Ramal&quot;,&quot;en&quot;:&quot;forecast&quot;,&quot;d&quot;:&quot;h = 1, bulan depan dengan s = 0,90: (1.029 + 20,9) × 0,90 = &lt;b&gt;944,9&lt;/b&gt;. h = 12, bulan yang sama tahun depan: (1.029 + 12 × 20,9) × 1,2071 = &lt;b&gt;1.544,8&lt;/b&gt;&quot;,&quot;ex&quot;:&quot;Ramalan = (level + h × tren) × indeks musiman bulan yang diramal.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Angka ilustrasi dosen; rumus FPP3 §8.3. Hasil dicek dengan perhitungan Python.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Taksonomi</span><span>Indikator 3 · geser atau klik</span></div><h2>Sembilan metode exponential smoothing</h2><div class=\"sim sim-grid2\" data-sim=\"grid2\" data-cfg=\"{&quot;id&quot;:&quot;p5-tax&quot;,&quot;aria&quot;:&quot;Kisi tren kali musiman exponential smoothing&quot;,&quot;max&quot;:2,&quot;init&quot;:[0,0],&quot;x&quot;:{&quot;label&quot;:&quot;Musiman (N · A · M)&quot;,&quot;lo&quot;:&quot;N&quot;,&quot;hi&quot;:&quot;M&quot;},&quot;y&quot;:{&quot;label&quot;:&quot;Tren (N · A · Ad)&quot;,&quot;lo&quot;:&quot;N&quot;,&quot;hi&quot;:&quot;Ad&quot;},&quot;zones&quot;:[{&quot;k&quot;:&quot;nn&quot;,&quot;en&quot;:&quot;SES&quot;,&quot;name&quot;:&quot;Simple exponential smoothing&quot;,&quot;tag&quot;:&quot;(N, N)&quot;,&quot;r&quot;:[0,0.66,0,0.66],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Tanpa tren, tanpa musiman. Ramalan datar setinggi level terakhir.&quot;,&quot;ex&quot;:&quot;tiket helpdesk mingguan yang stabil.&quot;},{&quot;k&quot;:&quot;na&quot;,&quot;en&quot;:&quot;(N,A)&quot;,&quot;name&quot;:&quot;Musiman aditif tanpa tren&quot;,&quot;tag&quot;:&quot;(N, A)&quot;,&quot;r&quot;:[0.67,1.33,0,0.66],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Level tetap dengan gelombang musiman berukuran tetap.&quot;,&quot;ex&quot;:&quot;kunjungan puskesmas harian berpola mingguan, level stabil.&quot;},{&quot;k&quot;:&quot;nm&quot;,&quot;en&quot;:&quot;(N,M)&quot;,&quot;name&quot;:&quot;Musiman multiplikatif tanpa tren&quot;,&quot;tag&quot;:&quot;(N, M)&quot;,&quot;r&quot;:[1.34,2,0,0.66],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Level tetap, gelombang musiman berupa rasio terhadap level.&quot;,&quot;ex&quot;:&quot;jarang dipakai; cek dulu dengan grafik.&quot;},{&quot;k&quot;:&quot;an&quot;,&quot;en&quot;:&quot;Holt&quot;,&quot;name&quot;:&quot;Holt's linear method&quot;,&quot;tag&quot;:&quot;(A, N)&quot;,&quot;r&quot;:[0,0.66,0.67,1.33],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Tren linear, tanpa musiman. Ramalan garis lurus.&quot;,&quot;ex&quot;:&quot;pendaftar program beasiswa yang naik stabil per tahun.&quot;},{&quot;k&quot;:&quot;aa&quot;,&quot;en&quot;:&quot;HW-A&quot;,&quot;name&quot;:&quot;Holt-Winters aditif&quot;,&quot;tag&quot;:&quot;(A, A)&quot;,&quot;r&quot;:[0.67,1.33,0.67,1.33],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Tren linear + musiman berukuran tetap.&quot;,&quot;ex&quot;:&quot;penjualan UMKM yang puncak Lebarannya kurang lebih sama besar.&quot;},{&quot;k&quot;:&quot;am&quot;,&quot;en&quot;:&quot;HW-M&quot;,&quot;name&quot;:&quot;Holt-Winters multiplikatif&quot;,&quot;tag&quot;:&quot;(A, M)&quot;,&quot;r&quot;:[1.34,2,0.67,1.33],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Tren linear + musiman sebanding level.&quot;,&quot;ex&quot;:&quot;produksi jagung nasional (Mu'min dkk., 2026).&quot;},{&quot;k&quot;:&quot;dn&quot;,&quot;en&quot;:&quot;Damped&quot;,&quot;name&quot;:&quot;Additive damped trend&quot;,&quot;tag&quot;:&quot;(Ad, N)&quot;,&quot;r&quot;:[0,0.66,1.34,2],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Tren yang melandai, tanpa musiman.&quot;,&quot;ex&quot;:&quot;pengguna aplikasi desa yang tumbuh lalu melambat.&quot;},{&quot;k&quot;:&quot;da&quot;,&quot;en&quot;:&quot;(Ad,A)&quot;,&quot;name&quot;:&quot;Tren teredam + musiman aditif&quot;,&quot;tag&quot;:&quot;(Ad, A)&quot;,&quot;r&quot;:[0.67,1.33,1.34,2],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Tren melandai dengan gelombang musiman tetap.&quot;,&quot;ex&quot;:&quot;kunjungan wisata yang mulai jenuh, musiman libur sekolah.&quot;},{&quot;k&quot;:&quot;dm&quot;,&quot;en&quot;:&quot;HW-Ad&quot;,&quot;name&quot;:&quot;Holt-Winters' damped method&quot;,&quot;tag&quot;:&quot;(Ad, M)&quot;,&quot;r&quot;:[1.34,2,1.34,2],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Tren melandai dengan musiman multiplikatif.&quot;,&quot;ex&quot;:&quot;penjualan ritel yang tumbuh melambat dengan puncak musiman membesar.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Tren N/A/Ad × musiman N/A/M; nama metode sesuai Hyndman &amp; Athanasopoulos (2021, §8.4). Contoh kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kerangka ETS</span><span>Indikator 3</span></div><h2>Dari metode ke model: ETS(E, T, S)</h2><div class=\"cols w\"><div><ul><li>Setiap metode punya dua <button type=\"button\" class=\"term\" data-term=\"state-space\">model ruang keadaan</button>: galat <b>aditif</b> (A) atau <b>multiplikatif</b> (M).</li><li>Ditulis <button type=\"button\" class=\"term\" data-term=\"ets\">ETS</button>(Error, Trend, Season), mis. ETS(A,A,N) = Holt galat aditif.</li><li>Model memberi <b>interval prediksi</b>, bukan hanya ramalan titik.</li><li>Model dipilih otomatis dengan <button type=\"button\" class=\"term\" data-term=\"aicc\">AICc</button> terkecil pada data latih.</li></ul><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §8.5–8.7)</span></p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/></svg>Membaca nama model</h3><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><tbody><tr><td><b>ETS(A,N,N)</b></td><td>SES</td></tr><tr><td><b>ETS(A,A,N)</b></td><td>Holt</td></tr><tr><td><b>ETS(A,A<sub>d</sub>,N)</b></td><td>tren teredam</td></tr><tr><td><b>ETS(A,A,A)</b></td><td>Holt-Winters aditif</td></tr><tr><td><b>ETS(M,A,M)</b></td><td>Holt-Winters multiplikatif</td></tr></tbody></table></div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Persiapan</span><span>Python · 2 menit</span></div><h2>Siapkan lingkungan: Python lokal atau Google Colab</h2><p class=\"muted\" style=\"margin:.2em 0 .5em\">Pilih salah satu; kode praktikum sama persis di keduanya. Sudah disiapkan di Pertemuan 2; cukup aktifkan lagi (lokal) atau pasang ulang statsforecast dan unggah CSV (Colab).</p><div class=\"sim sim-env\" data-sim=\"env\" data-cfg=\"{&quot;id&quot;:&quot;p5-env&quot;,&quot;tabs&quot;:[{&quot;id&quot;:&quot;lokal&quot;,&quot;label&quot;:&quot;Python lokal&quot;,&quot;steps&quot;:[&quot;Pasang Python 3.10 atau lebih baru dari &lt;b&gt;python.org&lt;/b&gt; (Windows: centang &lt;i&gt;Add python.exe to PATH&lt;/i&gt;).&quot;,&quot;Buat folder &lt;code&gt;praktikum-peramalan&lt;/code&gt;; simpan CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; di folder itu.&quot;,&quot;Buka terminal di folder itu, buat dan aktifkan lingkungan virtual, lalu pasang pustaka (kode di samping). Cukup sekali.&quot;,&quot;Setiap praktikum: aktifkan lagi lingkungannya, jalankan &lt;code&gt;jupyter lab&lt;/code&gt;, buat notebook di folder yang sama.&quot;,&quot;Salin kode dari slide ke sel notebook; nama berkas CSV tidak perlu diubah.&quot;],&quot;code&quot;:&quot;python -m venv .venv\\n\\n# aktifkan (pilih sesuai OS)\\n.venv\\\\Scripts\\\\activate        # Windows\\nsource .venv/bin/activate     # macOS / Linux\\n\\npip install pandas matplotlib statsmodels scipy\\npip install statsforecast jupyterlab\\njupyter lab&quot;},{&quot;id&quot;:&quot;colab&quot;,&quot;label&quot;:&quot;Google Colab&quot;,&quot;steps&quot;:[&quot;Buka &lt;b&gt;colab.research.google.com&lt;/b&gt;, masuk akun Google, pilih &lt;i&gt;New notebook&lt;/i&gt;.&quot;,&quot;Sel pertama: pasang statsforecast (pandas, matplotlib, statsmodels, scipy sudah tersedia).&quot;,&quot;Unggah CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; dengan sel kedua, atau seret berkas ke panel &lt;i&gt;Files&lt;/i&gt; di kiri.&quot;,&quot;Jalankan kode dari slide apa adanya; berkas ada di folder kerja &lt;code&gt;/content&lt;/code&gt;.&quot;,&quot;Berkas unggahan hilang saat runtime direset: unggah ulang di sesi baru. Simpan notebook lewat &lt;i&gt;File › Save a copy in Drive&lt;/i&gt;; kumpulkan lewat &lt;i&gt;File › Download › .ipynb&lt;/i&gt;.&quot;],&quot;code&quot;:&quot;!pip install -q statsforecast\\n\\nfrom google.colab import files\\nfiles.upload()   # pilih berkas CSV dari slide&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 1</span><span>Python · 25 menit · indikator 3</span></div><h2>SES, Holt, Holt-Winters, AutoETS</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import pandas as pd\nfrom statsforecast import StatsForecast\nfrom statsforecast.models import (SimpleExponentialSmoothingOptimized,\n    Holt, HoltWinters, AutoETS)\ndf = pd.read_csv(\"penjualan_umkm.csv\", parse_dates=[\"ds\"])\nlatih = df[df.ds &lt; \"2025-01-01\"]   # Jan 2022–Des 2024\nuji   = df[df.ds &gt;= \"2025-01-01\"]  # 12 bulan 2025\nmodels = [SimpleExponentialSmoothingOptimized(), Holt(),\n          HoltWinters(season_length=12, error_type=\"A\", alias=\"HW_A\"),\n          HoltWinters(season_length=12, error_type=\"M\", alias=\"HW_M\"),\n          AutoETS(season_length=12)]\nfc = StatsForecast(models=models, freq=\"MS\").forecast(df=latih, h=12)\nhasil = uji.merge(fc, on=[\"unique_id\", \"ds\"])\nfor m in [\"SESOpt\", \"Holt\", \"HW_A\", \"HW_M\", \"AutoETS\"]:\n    print(m, (hasil.y - hasil[m]).abs().mean().round(1))</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Unduh <code>penjualan_umkm.csv</code> di bawah; latih/uji sama dengan P4.</li><li>Jalankan lima model; catat MAE uji.</li><li>Bandingkan dengan benchmark terbaik.</li><li>Plot ramalan 2025 tiap model.</li><li>Ulangi pada data kelompok.</li></ol></div></div><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;p5-dl1&quot;,&quot;compact&quot;:true,&quot;files&quot;:[{&quot;name&quot;:&quot;penjualan_umkm.csv&quot;,&quot;csv&quot;:&quot;unique_id,ds,y\\npenjualan_umkm,2022-01-01,675\\npenjualan_umkm,2022-02-01,652\\npenjualan_umkm,2022-03-01,666\\npenj 09-28,57\\ntiket_helpdesk,2026-10-05,66\\ntiket_helpdesk,2026-10-12,69\\ntiket_helpdesk,2026-10-19,49\\ntiket_helpdesk,2026-10-26,68\\n&quot;,&quot;desc&quot;:&quot;16 minggu (freq W-MON), naik mulai minggu ke-9&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hasil</span><span>Indikator 3 · data ilustrasi</span></div><h2>ETS vs benchmark pada data UMKM</h2><div class=\"cols wr\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.82em\"><thead><tr><th>Model</th><th>MAE 2025</th></tr></thead><tbody><tr><td>Mean (P4)</td><td>380,5</td></tr><tr><td>Naïve (P4)</td><td>111,4</td></tr><tr><td>Seasonal naïve (P4)</td><td>209,9</td></tr><tr><td>Drift (P4)</td><td>119,3</td></tr><tr><td>SES, α ≈ 0,26</td><td>183,2</td></tr><tr style=\"font-weight:700\"><td>Holt = AutoETS → ETS(A,A,N)</td><td>83,0</td></tr><tr><td>Holt-Winters aditif, ETS(A,A,A)</td><td>106,0</td></tr><tr><td>Holt-Winters multiplikatif, ETS(M,A,M)</td><td>124,0</td></tr></tbody></table></div><div><figure class=\"fig\"><svg viewBox=\"0 0 900 210\" style=\"max-height:11em\" role=\"img\" aria-label=\"Ramalan 2025 data UMKM. Garis aktual memuncak di Maret sekitar 1.790. ETS A A N berupa garis lurus naik dari 1.217 ke 1.374 tanpa puncak. ETS A A A membawa puncak musiman di Maret dan April, tetapi puncak April terlalu tinggi karena pola tahun-tahun dengan Lebaran April.\"><line x1=\"60\" y1=\"148.4\" x2=\"860\" y2=\"148.4\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"52\" y=\"152.4\" text-anchor=\"end\" class=\"s-s\">1.100</text><line x1=\"60\" y1=\"95.4\" x2=\"860\" y2=\"95.4\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"52\" y=\"99.4\" text-anchor=\"end\" class=\"s-s\">1.400</text><line x1=\"60\" y1=\"42.5\" x2=\"860\" y2=\"42.5\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"52\" y=\"46.5\" text-anchor=\"end\" class=\"s-s\">1.700</text><text x=\"60\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Jan</text><text x=\"132.7\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Feb</text><text x=\"205.5\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Mar</text><text x=\"278.2\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Apr</text><text x=\"350.9\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Mei</text><text x=\"423.6\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Jun</text><text x=\"496.4\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Jul</text><text x=\"569.1\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Agu</text><text x=\"641.8\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Sep</text><text x=\"714.5\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Okt</text><text x=\"787.3\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Nov</text><text x=\"860\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">Des</text><path d=\"M60 139.7 L132.7 131.1 L205.5 26.8 L278.2 127.5 L350.9 119.8 L423.6 114.1 L496.4 120.6 L569.1 104.8 L641.8 104.9 L714.5 116.9 L787.3 102.6 L860 76.7\" class=\"s-line\" style=\"stroke:var(--ink);stroke-width:2.6\"/><path d=\"M60 127.7 L132.7 125.1 L205.5 122.6 L278.2 120.1 L350.9 117.6 L423.6 115.1 L496.4 112.5 L569.1 110 L641.8 107.5 L714.5 105 L787.3 102.5 L860 99.9\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2.4;stroke-dasharray:7 5\"/><path d=\"M60 135 L132.7 135 L205.5 103 L278.2 67.6 L350.9 140.9 L423.6 127.7 L496.4 110.9 L569.1 111.5 L641.8 117 L714.5 112.7 L787.3 104.1 L860 87.5\" class=\"s-line\" style=\"stroke:var(--green);stroke-width:2.4\"/><line x1=\"80\" y1=\"198\" x2=\"108\" y2=\"198\" class=\"s-line\" style=\"stroke:var(--ink);stroke-width:2.6\"/><text x=\"114\" y=\"202\" class=\"s-s\">aktual 2025</text><line x1=\"240\" y1=\"198\" x2=\"268\" y2=\"198\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2.4;stroke-dasharray:7 5\"/><text x=\"274\" y=\"202\" class=\"s-s\">ETS(A,A,N) · MAE 83,0</text><line x1=\"470\" y1=\"198\" x2=\"498\" y2=\"198\" class=\"s-line\" style=\"stroke:var(--green);stroke-width:2.4\"/><text x=\"504\" y=\"202\" class=\"s-s\">ETS(A,A,A) · MAE 106,0</text></svg><figcaption>Ramalan 2025 dari dua model ETS (statsforecast) dibandingkan data aktual. Data ilustrasi.</figcaption></figure></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 2</span><span>Python · 15 menit · indikator 3</span></div><h2>Membaca model yang dipilih</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import pandas as pd\nfrom statsforecast import StatsForecast\nfrom statsforecast.models import AutoETS\n\ndf = pd.read_csv(\"penjualan_umkm.csv\", parse_dates=[\"ds\"])\nlatih = df[df.ds &lt; \"2025-01-01\"]\n\nsf = StatsForecast(models=[AutoETS(season_length=12)], freq=\"MS\")\nsf.fit(df=latih)\nm = sf.fitted_[0][0].model_\nprint(m[\"method\"])          # mis. ETS(A,A,N)\nprint(m[\"aicc\"])            # AICc\nprint(m[\"par\"])             # alpha, beta, gamma, phi, l0, b0, s0...\n\n# paksa model tertentu untuk dibandingkan\nAutoETS(season_length=12, model=\"AAA\")              # HW aditif\nAutoETS(season_length=12, model=\"AAN\", damped=True) # tren teredam</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Yang dicatat di notebook</h3><ul><li>Nama model terpilih dan AICc.</li><li>Nilai α, β, γ (dan φ bila ada).</li><li>Tafsiran: parameter kecil = komponen jarang berubah.</li><li>Bandingkan MAE uji dengan benchmark.</li></ul></div></div><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;p5-dl2&quot;,&quot;compact&quot;:true,&quot;files&quot;:[{&quot;name&quot;:&quot;penjualan_umkm.csv&quot;, 4 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 22 16 8\"/><path d=\"M3.5 12.5 5 11l1.5 1.5a3.5 3.5 0 0 1 0 5L5 19l-1.5-1.5a3.5 3.5 0 0 1 0-5Z\"/><path d=\"M7.5 8.5 9 7l1.5 1.5a3.5 3.5 0 0 1 0 5L9 15l-1.5-1.5a3.5 3.5 0 0 1 0-5Z\"/><path d=\"M11.5 4.5 13 3l1.5 1.5a3.5 3.5 0 0 1 0 5L13 11l-1.5-1.5a3.5 3.5 0 0 1 0-5Z\"/></svg>Rumus di artikel</h3><p style=\"font-family:var(--mono);font-size:.72em;line-height:1.8\">L<sub>t</sub> = α(Y<sub>t</sub>/S<sub>t−m</sub>) + (1 − α)(L<sub>t−1</sub> + T<sub>t−1</sub>)<br>T<sub>t</sub> = β(L<sub>t</sub> − L<sub>t−1</sub>) + (1 − β)T<sub>t−1</sub><br>S<sub>t</sub> = γ(Y<sub>t</sub>/L<sub>t</sub>) + (1 − γ)S<sub>t−m</sub>*<br>Ŷ<sub>t+h</sub> = (L<sub>t</sub> + hT<sub>t</sub>) × S<sub>t−m+h</sub></p><p class=\"muted\" style=\"font-size:.76em\">m = 12. *Lihat catatan dosen.</p></div><div><ol style=\"font-size:.9em\"><li><b>Data</b>: produksi jagung bulanan BPS, Jan 2020–Okt 2025 (70 observasi).</li><li><b>Model</b>: Holt-Winters multiplikatif, m = 12.</li><li><b>Parameter</b>: grid search α, β, γ ∈ (0, 1), galat terendah di periode latih.</li><li><b>Evaluasi</b>: MAPE 18,64% atas seluruh observasi.</li><li><b>Ramalan</b>: Nov 2025–Des 2026.</li></ol><p style=\"font-size:.86em\"><b>Diskusi</b>: apa beda cara memilih parameter di artikel dan di <code>AutoETS</code>?</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\"><span class=\"cite\" style=\"white-space:normal\">(Mu'min dkk., 2026)</span></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 6 menit · kasus ilustrasi</span></div><h2>ETS apa yang Anda coba lebih dulu?</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>A · PMB kampus</h3><p>Pendaftar per tahun, 8 tahun, naik makin lambat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5V8z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>B · Toko oleh-oleh</h3><p>Penjualan bulanan 5 tahun; puncak libur sekolah dan akhir tahun makin besar seiring toko tumbuh.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>C · Apotek puskesmas</h3><p>Pemakaian obat mingguan, stabil, tanpa musiman jelas.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>D · Listrik gedung kampus</h3><p>Pemakaian bulanan 4 tahun; pola semester berulang, besarnya tetap, tren naik pelan.</p></div></div><div class=\"callout\" style=\"margin-top:.7em\">Tulis nama ETS(E,T,S) dan satu alasan. Ingat: keputusan akhir dibuktikan di data uji.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok Tugas 1 · 20 menit · indikator 3</span></div><h2>ETS pada kasus kelompok</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Model</th><th>ETS(E,T,S)</th><th>AICc</th><th>MAE uji</th></tr></thead><tbody><tr><td>Benchmark terbaik (P4)</td><td>–</td><td>–</td><td>…</td></tr><tr><td>SES</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Holt / teredam</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Holt-Winters</td><td>…</td><td>…</td><td>…</td></tr><tr><td>AutoETS</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah</h3><ol><li>Pakai data latih/uji yang sama dengan P4.</li><li>Jalankan SES, Holt, Holt-Winters, AutoETS.</li><li>Isi tabel; catat α, β, γ model terbaik.</li><li>Apakah ETS mengalahkan benchmark? Mengapa?</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>SES</b>: ℓ<sub>t</sub> = αy<sub>t</sub> + (1 − α)ℓ<sub>t−1</sub>; bobot mengecil eksponensial; ramalan datar.</li><li><b>Holt</b> menambah tren b<sub>t</sub> (β*); <b>damped</b> meredam tren dengan φ.</li><li><b>Holt-Winters</b> menambah musiman s<sub>t</sub> (γ): aditif bila gelombang tetap, multiplikatif bila sebanding level.</li><li><b>ETS(E,T,S)</b>: model ruang keadaan; dipilih otomatis dengan AICc.</li><li>Model terbaik dibuktikan di <b>data uji</b> terhadap benchmark.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif, tidak dinilai</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p5-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Pada SES, bila α = 1, ramalannya sama dengan…&quot;,&quot;o&quot;:[&quot;rata-rata seluruh data&quot;,&quot;observasi terakhir&quot;,&quot;nilai tahun lalu&quot;,&quot;nol&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;ℓ&lt;sub&gt;t&lt;/sub&gt; = 1·y&lt;sub&gt;t&lt;/sub&gt; + 0·ℓ&lt;sub&gt;t−1&lt;/sub&gt; = y&lt;sub&gt;t&lt;/sub&gt;: SES menjadi metode naïve.&quot;},{&quot;q&quot;:&quot;Holt: ℓ&lt;sub&gt;T&lt;/sub&gt; = 1.029 dan b&lt;sub&gt;T&lt;/sub&gt; = 20,9. Ramalan h = 3 adalah…&quot;,&quot;o&quot;:[&quot;1.049,9&quot;,&quot;1.091,7&quot;,&quot;1.029,0&quot;,&quot;1.250,8&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;ŷ = ℓ&lt;sub&gt;T&lt;/sub&gt; + h·b&lt;sub&gt;T&lt;/sub&gt; = 1.029 + 3 × 20,9 = 1.091,7.&quot;},{&quot;q&quot;:&quot;Penjualan bertren naik dengan puncak musiman yang makin besar seiring level. Model yang tepat dicoba…&quot;,&quot;o&quot;:[&quot;SES&quot;,&quot;Holt tanpa musiman&quot;,&quot;Holt-Winters aditif&quot;,&quot;Holt-Winters multiplikatif&quot;],&quot;a&quot;:3,&quot;why&quot;:&quot;Musiman yang sebanding level adalah ciri pola multiplikatif.&quot;},{&quot;q&quot;:&quot;ETS(A,A&lt;sub&gt;d&lt;/sub&gt;,N) artinya…&quot;,&quot;o&quot;:[&quot;galat aditif, tren teredam, tanpa musiman&quot;,&quot;galat aditif, tren aditif, musiman aditif&quot;,&quot;tanpa galat, tren aditif, musiman multiplikatif&quot;,&quot;galat multiplikatif, tanpa tren, tanpa musiman&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Urutannya Error, Trend, Season: A, A&lt;sub&gt;d&lt;/sub&gt; (damped), N.&quot;},{&quot;q&quot;:&quot;Pada data UMKM, AutoETS memilih ETS(A,A,N), bukan Holt-Winters. Alasan utama dari kriteria pemilihannya…&quot;,&quot;o&quot;:[&quot;MAE uji Holt-Winters lebih kecil&quot;,&quot;AICc ETS(A,A,N) lebih kecil&quot;,&quot;Holt-Winters tidak bisa untuk data bulanan&quot;,&quot;α Holt-Winters harus 1&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;AutoETS memilih AICc terkecil di data latih; 12 indeks musiman dari 36 bulan menaikkan AICc.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Hyndman &amp; Athanasopoulos (2021) bab 8, atau padanannya di versi Python (Hyndman et al., 2025); bab exponential smoothing di Montgomery et al. (2015). Persiapan Pertemuan 6: bab 5 tentang akurasi dan validasi silang.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P4–5)</h3><ul><li>Notebook benchmark (P4) + SES, Holt, Holt-Winters, AutoETS.</li><li>Tabel ETS(E,T,S), AICc, MAE uji.</li><li>Tafsiran parameter model terbaik.</li><li>Kesimpulan: ETS vs benchmark, beserta alasan.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bobot bagian P4–5: Tugas 1 10% (Penilaian Praktikum). Tenggat: [PERLU DIISI].</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Exponential smoothing</span></dt><dd>Keluarga metode yang meramal dengan rata-rata tertimbang observasi masa lalu; bobot mengecil secara eksponensial untuk data yang makin lama. <i>(pemulusan eksponensial)</i></dd></div><div><dt><span class=\"en\">Simple exponential smoothing (SES)</span></dt><dd>Exponential smoothing untuk data tanpa tren dan musiman; ramalannya datar setinggi level terakhir. <i>(pemulusan eksponensial sederhana)</i></dd></div><div><dt><span class=\"en\">Smoothing parameter</span></dt><dd>Bilangan antara 0 dan 1 (α, β, γ) yang mengatur seberapa cepat level, tren, atau musiman menyesuaikan diri dengan data baru. <i>(parameter pemulusan)</i></dd></div><div><dt><span class=\"en\">Level</span></dt><dd>Nilai \"dasar\" seri pada waktu t setelah dimuluskan, ℓ<sub>t</sub>. <i>(level / tingkat)</i></dd></div><div><dt><span class=\"en\">Holt's linear trend method</span></dt><dd>Perluasan SES dengan persamaan tren (kemiringan) b<sub>t</sub>, sehingga ramalan berupa garis lurus. <i>(metode tren linear Holt)</i></dd></div><div><dt><span class=\"en\">Damped trend</span></dt><dd>Tren yang \"diredam\" dengan parameter φ (0 < φ < 1) sehingga ramalan jangka panjang mendatar. <i>(tren teredam)</i></dd></div><div><dt><span class=\"en\">Holt-Winters method</span></dt><dd>Exponential smoothing dengan komponen level, tren, dan musiman (Pertemuan 5). <i>(metode Holt-Winters)</i></dd></div><div><dt><span class=\"en\">ETS model</span></dt><dd>Model ruang keadaan exponential smoothing; ditulis ETS(Error, Trend, Season), mis. ETS(A,A,N). <i>(model ETS)</i></dd></div><div><dt><span class=\"en\">State space model</span></dt><dd>Model yang menuliskan persamaan pengamatan dan persamaan perubahan keadaan (level, tren, musiman) beserta galatnya. <i>(model ruang keadaan)</i></dd></div><div><dt><span class=\"en\">AICc</span></dt><dd>Akaike Information Criterion terkoreksi untuk sampel kecil; makin kecil makin baik, dipakai memilih model dari data latih. <i>(kriteria informasi Akaike terkoreksi)</i></dd></div><div><dt><span class=\"en\">SSE</span></dt><dd>Sum of squared errors: jumlah kuadrat galat ramalan satu langkah di data latih. <i>(jumlah kuadrat galat)</i></dd></div><div><dt><span class=\"en\">Grid search</span></dt><dd>Mencoba banyak kombinasi nilai parameter pada kisi tertentu lalu memilih yang galatnya terkecil. <i>(pencarian kisi)</i></dd></div><div><dt><span class=\"en\">MAPE</span></dt><dd>Mean absolute percentage error: rata-rata galat absolut dalam persen dari nilai aktual (Pertemuan 6). <i>(rata-rata persentase galat absolut)</i></dd></div><div><dt><span class=\"en\">Seasonal naïve method</span></dt><dd>Ramalan sama dengan nilai terakhir dari musim yang sama, mis. bulan yang sama tahun lalu. <i>(metode naif musiman)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Montgomery, D. C., Jennings, C. L., &amp; Kulahci, M. (2015). <i>Introduction to time series analysis and forecasting</i> (2nd ed.). John Wiley &amp; Sons.</li><li>Mu'min, S., Nugroho, R. A., Mufliq, A., &amp; Andhyka, A. (2026). Forecasting corn production in Indonesia using Holt–Winters exponential smoothing. <i>Journal of Informatics, Game Engineering, and Networking, 1</i>(1), 55–63.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 6.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":6,"title":"Metrik Akurasi & Validasi Silang","subtitle":"Galat peramalan; MAE, RMSE, MAPE, MASE; train-test split; time series cross-validation","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Metode Peramalan (Forecasting) · SII017</span></div><h1>Metrik Akurasi &amp; Validasi Silang</h1><p class=\"lead\">Galat peramalan; MAE, RMSE, MAPE, MASE; train-test split; time series cross-validation</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>galat → metrik → data uji → validasi silang + praktikum</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengevaluasi akurasi model peramalan dengan metrik dan validasi silang runtun waktu (C5).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 dan 4 di Pertemuan 7)</span></h3><ol><li>Ketepatan menghitung MAE, RMSE, MAPE, dan MASE.</li><li>Ketepatan membagi data latih dan uji serta validasi silang rolling origin.</li><li>Ketepatan analisis residual. <span class=\"muted\">(Pertemuan 7)</span></li><li>Kelogisan pemilihan model terbaik dan kualitas presentasi. <span class=\"muted\">(Pertemuan 7)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu mengimplementasikan dan mengevaluasi metode peramalan statistik (dekomposisi, exponential smoothing, ARIMA, dan regresi) pada data runtun waktu.</dd><dt>CPL-8</dt><dd class=\"id\">Mampu mengimplementasikan kebutuhan komputasi dan sistem informasi dengan mempertimbangkan berbagai metode, algoritma, serta pendekatan berbasis data.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 5 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Model apa yang dipilih AutoETS pada data UMKM, dan dengan kriteria apa?</li><li>AICc dihitung di data latih atau data uji?</li><li>Mengapa ETS harus dibandingkan dengan benchmark?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z\"/><path d=\"m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2\"/></svg>Pertanyaan hari ini</h3><p>Kita sudah memakai MAE. <b>Apakah MAE cukup</b>, dan apakah satu kali pembagian latih/uji cukup untuk memilih model?</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>Data ilustrasi UMKM · uji 2025</span></div><h2>Model mana yang terbaik?</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Model</th><th>MAE</th><th>RMSE</th></tr></thead><tbody><tr><td>Naïve</td><td>111,4</td><td>180,7</td></tr><tr><td>Drift</td><td>119,3</td><td style=\"font-weight:800\">164,8</td></tr><tr><td>AutoETS = ETS(A,A,N)</td><td style=\"font-weight:800\">83,0</td><td>165,3</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.8em\">Satuan: unit terjual per bulan. Tebal = terkecil per kolom.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Diskusi 3 menit</h3><ul><li>Menurut MAE, juaranya AutoETS. Menurut RMSE, Drift.</li><li>Mengapa peringkatnya bisa berbeda?</li><li>Hasil ini hanya dari <b>satu</b> tahun uji. Cukupkah?</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2><button type=\"button\" class=\"term\" data-term=\"forecast-error\">Forecast error</button> bukan residual</h2><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A forecast “error” is the difference between an observed value and its forecast. Here “error” does not mean a mistake, it means the unpredictable part of an observation.\"</p><p class=\"tr\">\"Sebuah “galat” ramalan adalah selisih antara suatu nilai teramati dan ramalannya. Di sini “galat” tidak berarti kesalahan, melainkan bagian yang tidak dapat diramalkan dari suatu observasi.\"</p><div class=\"src\">Hyndman &amp; Athanasopoulos (2021, §5.8); terjemahan harfiah penyusun</div></blockquote><div class=\"cols\" style=\"margin-top:.5em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 7V4H6l6 8-6 8h12v-3\"/></svg>Forecast error</h3><p>e<sub>T+h</sub> = y<sub>T+h</sub> − ŷ<sub>T+h|T</sub></p><p class=\"muted\" style=\"font-size:.85em\">di <b>data uji</b>; bisa banyak langkah ke depan</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0\"/></svg><button type=\"button\" class=\"term\" data-term=\"residuals\">Residual</button></h3><p>e<sub>t</sub> = y<sub>t</sub> − ŷ<sub>t|t−1</sub></p><p class=\"muted\" style=\"font-size:.85em\">di <b>data latih</b>; satu langkah ke depan (Pertemuan 7)</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"training-set\">Data latih</button> dan <button type=\"button\" class=\"term\" data-term=\"test-set\">data uji</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 170\" style=\"max-height:9.5em\" role=\"img\" aria-label=\"Garis waktu 48 bulan data ilustrasi UMKM. Tiga puluh enam bulan pertama, Januari 2022 sampai Desember 2024, adalah data latih untuk mengestimasi model. Dua belas bulan terakhir, Januari sampai Desember 2025, adalah data uji yang disembunyikan lalu dibandingkan dengan ramalan h sama dengan 1 sampai 12.\"><defs><marker id=\"sp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"21\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><text x=\"22\" y=\"92\" class=\"s-s\" style=\"font-size:12px\">Jan 2022</text><rect x=\"38.9\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"56.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"74.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"92.7\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"110.6\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"128.5\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"146.4\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"164.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"182.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"200.2\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"218.1\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"236\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><text x=\"237\" y=\"92\" class=\"s-s\" style=\"font-size:12px\">Jan 2023</text><rect x=\"253.9\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"271.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"289.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"307.7\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"325.6\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"343.5\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"361.4\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"379.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"397.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"415.2\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"433.1\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"451\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><text x=\"452\" y=\"92\" class=\"s-s\" style=\"font-size:12px\">Jan 2024</text><rect x=\"468.9\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"486.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"504.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"522.7\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"540.6\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"558.5\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"576.4\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"594.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"612.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"630.2\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"648.1\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-soft\"/><rect x=\"666\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><text x=\"667\" y=\"92\" class=\"s-s\" style=\"font-size:12px\">Jan 2025</text><rect x=\"683.9\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"701.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"719.8\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"737.7\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"755.6\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"773.5\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"791.4\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"809.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"827.3\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"845.2\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><rect x=\"863.1\" y=\"40\" width=\"15.9\" height=\"34\" rx=\"2\" class=\"s-acc\"/><text x=\"342.5\" y=\"28\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">data latih (training) · 36 bulan · 75%</text><text x=\"772.5\" y=\"28\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">data uji (test) · 12 bulan</text><line x1=\"665\" y1=\"34\" x2=\"665\" y2=\"80\" class=\"s-line\" style=\"stroke-width:3\"/><text x=\"342.5\" y=\"124\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:13px\">model dilatih (estimasi parameter) hanya di sini</text><text x=\"772.5\" y=\"124\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:13px\">ramalan h = 1…12 dibandingkan aktual</text><text x=\"772.5\" y=\"144\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:13px\">→ forecast error e = y − ŷ</text></svg><figcaption>Pembagian data latih dan uji pada data ilustrasi UMKM; mengikuti prinsip Hyndman &amp; Athanasopoulos (2021, §5.8).</figcaption></figure><ul style=\"margin-top:.2em\"><li>Data uji <b>disembunyikan</b> saat melatih dan memilih model; tidak boleh ada <button type=\"button\" class=\"term\" data-term=\"data-leakage\">kebocoran data</button>.</li><li>Ukuran uji biasanya sekitar 20% data, idealnya minimal sepanjang horizon ramalan terjauh <span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §5.8)</span>.</li><li>Model yang cocok sempurna di data latih bisa gagal di data baru: <button type=\"button\" class=\"term\" data-term=\"overfitting\">over-fitting</button>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Metrik</span><span>Indikator 1 · skala-dependen dan persentase</span></div><h2>MAE, RMSE, dan MAPE</h2><div class=\"grid3\"><div class=\"card\"><h3><button type=\"button\" class=\"term\" data-term=\"mae\">MAE</button></h3><p>mean(|e<sub>t</sub>|)</p><ul style=\"font-size:.85em\"><li>satuan sama dengan data</li><li>paling mudah dijelaskan</li><li>meminimalkan MAE → ramalan median</li></ul></div><div class=\"card\"><h3><button type=\"button\" class=\"term\" data-term=\"rmse\">RMSE</button></h3><p>√mean(e<sub>t</sub>²)</p><ul style=\"font-size:.85em\"><li>satuan sama dengan data</li><li>menghukum galat besar</li><li>meminimalkan RMSE → ramalan rata-rata</li></ul></div><div class=\"card\"><h3><button type=\"button\" class=\"term\" data-term=\"mape\">MAPE</button></h3><p>mean(|100 e<sub>t</sub> / y<sub>t</sub>|)</p><ul style=\"font-size:.85em\"><li>persen, bebas satuan</li><li>tak terdefinisi bila y = 0</li><li>tidak cocok untuk data tanpa nol bermakna (mis. suhu)</li></ul></div></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">MAE dan RMSE adalah metrik <button type=\"button\" class=\"term\" data-term=\"scale-dependent\">skala-dependen</button>: tidak bisa membandingkan seri bersatuan berbeda <span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §5.8)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Metrik</span><span>Indikator 1 · galat terskala</span></div><h2><button type=\"button\" class=\"term\" data-term=\"mase\">MASE</button>: dibandingkan dengan naïve</h2><div class=\"cols w\"><div><p class=\"lead\">q<sub>j</sub> = e<sub>j</sub> / Q, &nbsp; MASE = mean(|q<sub>j</sub>|)</p><ul><li>Data musiman: Q = rata-rata |y<sub>t</sub> − y<sub>t−m</sub>| di data latih (<button type=\"button\" class=\"term\" data-term=\"seasonal-naive\">seasonal naïve</button>).</li><li>Data tanpa musiman: Q = rata-rata |y<sub>t</sub> − y<sub>t−1</sub>| (naïve).</li><li>MASE &lt; 1: lebih baik dari rata-rata ramalan pembanding satu langkah di data latih.</li><li>Bebas satuan dan tetap berlaku bila ada nilai nol.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/></svg>Data UMKM</h3><p>m = 12, Q = rata-rata |y<sub>t</sub> − y<sub>t−12</sub>| pada 2023–2024 = <b>185,7</b> unit.</p><p>AutoETS: MASE = 83,0 / 185,7 ≈ <b>0,45</b></p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh hitung</span><span>Indikator 1 · klik ▶ Play atau →</span></div><h2>Empat metrik dari empat bulan</h2><p class=\"muted\" style=\"margin:.1em 0 .4em;font-size:.85em\">Ramalan ETS(A,A,N) Jan–Apr 2025 (dibulatkan 1 desimal) vs aktual. Data ilustrasi UMKM.</p><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;p6-met&quot;,&quot;ms&quot;:3600,&quot;steps&quot;:[{&quot;t&quot;:&quot;Galat&quot;,&quot;en&quot;:&quot;e = y − ŷ&quot;,&quot;d&quot;:&quot;Jan: 1.149 − 1.217,2 = −68,2 · Feb: 1.198 − 1.231,5 = −33,5 · Mar: 1.789 − 1.245,8 = &lt;b&gt;543,2&lt;/b&gt; · Apr: 1.218 − 1.260,0 = −42,0&quot;,&quot;ex&quot;:&quot;Galat negatif: ramalan terlalu tinggi. Maret melonjak karena Lebaran.&quot;},{&quot;t&quot;:&quot;MAE&quot;,&quot;en&quot;:&quot;mean |e|&quot;,&quot;d&quot;:&quot;(68,2 + 33,5 + 543,2 + 42,0) / 4 = 686,9 / 4 = &lt;b&gt;171,7&lt;/b&gt; unit&quot;,&quot;ex&quot;:&quot;Rata-rata, ramalan meleset sekitar 172 unit per bulan.&quot;},{&quot;t&quot;:&quot;RMSE&quot;,&quot;en&quot;:&quot;√ mean e²&quot;,&quot;d&quot;:&quot;e² = 4.651,2 · 1.122,3 · 295.066,2 · 1.764,0 → rata-rata 75.650,9 → √ = &lt;b&gt;275,0&lt;/b&gt; unit&quot;,&quot;ex&quot;:&quot;Maret menyumbang 97,5% jumlah kuadrat galat; RMSE jauh di atas MAE.&quot;},{&quot;t&quot;:&quot;MAPE&quot;,&quot;en&quot;:&quot;mean |100e / y|&quot;,&quot;d&quot;:&quot;5,94% · 2,80% · 30,36% · 3,45% → rata-rata = &lt;b&gt;10,6%&lt;/b&gt;&quot;,&quot;ex&quot;:&quot;Bebas satuan; tetap terpengaruh lonjakan Maret.&quot;},{&quot;t&quot;:&quot;MASE&quot;,&quot;en&quot;:&quot;MAE / Q&quot;,&quot;d&quot;:&quot;Q (seasonal naïve satu langkah di data latih) = 4.457 / 24 = 185,7 → 171,7 / 185,7 = &lt;b&gt;0,92&lt;/b&gt;&quot;,&quot;ex&quot;:&quot;&amp;lt; 1: sedikit lebih baik dari pembanding, meski ada lonjakan Lebaran.&quot;},{&quot;t&quot;:&quot;Tafsiran&quot;,&quot;en&quot;:&quot;pilih sesuai keputusan&quot;,&quot;d&quot;:&quot;Satu bulan istimewa (Maret) membuat RMSE 1,6 kali MAE. Bila kehabisan stok saat Lebaran sangat merugikan, RMSE relevan; bila yang dibutuhkan selisih rata-rata, pakai MAE.&quot;,&quot;ex&quot;:&quot;Laporkan lebih dari satu metrik, beserta alasannya.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hasil</span><span>Data ilustrasi UMKM · latih 2022–2024 · uji 2025 (h = 1–12)</span></div><h2>Empat metrik, delapan model</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.8em\"><thead><tr><th>Model</th><th>MAE</th><th>RMSE</th><th>MAPE</th><th>MASE</th></tr></thead><tbody><tr><td>Mean</td><td>380,5</td><td>414,0</td><td>27,6%</td><td>2,05</td></tr><tr><td>Naïve</td><td>111,4</td><td>180,7</td><td>7,5%</td><td>0,60</td></tr><tr><td>Seasonal naïve</td><td>209,9</td><td>224,3</td><td>15,4%</td><td>1,13</td></tr><tr><td>Drift</td> ot;fb&quot;:&quot;Tepat untuk laporan: “rata-rata meleset sekian kasus per minggu”, satuan sama dengan data dan aman dengan nilai 0.&quot;,&quot;to&quot;:&quot;b&quot;},{&quot;t&quot;:&quot;RMSE saja&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;tag&quot;:&quot;RMSE&quot;,&quot;fb&quot;:&quot;Boleh bila lonjakan wabah sangat merugikan, tetapi lebih sulit dijelaskan kepada pimpinan. Sebaiknya dilaporkan bersama MAE.&quot;,&quot;to&quot;:&quot;b&quot;}]},&quot;b&quot;:{&quot;text&quot;:&quot;Kepala Dinas bertanya: “Di kecamatan mana model kita paling bisa diandalkan?” Kecamatan besar punya puluhan kasus per minggu, kecamatan kecil hanya 0–3.&quot;,&quot;ch&quot;:[{&quot;t&quot;:&quot;Bandingkan MAE antar-kecamatan&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;tag&quot;:&quot;MAE antar-seri&quot;,&quot;fb&quot;:&quot;MAE bergantung skala: kecamatan besar selalu tampak lebih buruk hanya karena angkanya besar.&quot;,&quot;to&quot;:&quot;end&quot;},{&quot;t&quot;:&quot;Bandingkan MASE antar-kecamatan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;tag&quot;:&quot;MASE&quot;,&quot;fb&quot;:&quot;MASE bebas skala dan tetap berlaku bila ada nilai 0, sehingga adil untuk membandingkan kecamatan.&quot;,&quot;to&quot;:&quot;end&quot;}]},&quot;end&quot;:{&quot;title&quot;:&quot;Ringkasan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;end&quot;:&quot;Satu seri: MAE (mudah dijelaskan) ditambah RMSE bila galat besar mahal. Antar-seri: MASE. Hindari MAPE bila ada nilai nol.&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"time-series-cv\">Time series cross-validation</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 176\" style=\"max-height:10em\" role=\"img\" aria-label=\"Empat jendela validasi silang rolling origin. Setiap baris memakai semua data sebelum titik asal sebagai data latih, lalu menguji tiga bulan berikutnya. Titik asal pan class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §5.10)</span>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Indikator 2 · pilih jendela</span></div><h2>Satu jendela bisa menipu</h2><div class=\"sim sim-cv\" data-sim=\"cv\" data-cfg=\"{&quot;id&quot;:&quot;p6-cv&quot;,&quot;y&quot;:[675,652,666,1262,537,696,796,739,722,777,843,912,848,807,986,1239,769,895,960,990,958,952,1010,1135,961,1033,1374,1137,1089,1028,1062,1172,1125,1135,1112,1256,1149,1198,1789,1218,1262,1294,1257,1347,1346,1278,1359,1506],&quot;y0&quot;:2022,&quot;cut&quot;:[35,38,41,44],&quot;h&quot;:3,&quot;models&quot;:[[&quot;Naïve&quot;,[232.7,531,47.3,80.3],222.8,314.2],[&quot;Seasonal naïve&quot;,[256,173.3,197,213.3],209.9,224.3],[&quot;Drift&quot;,[232.7,589.6,27.2,71.7],230.3,332.1],[&quot;AutoETS&quot;,[215,63.7,34.2,75.8],97.2,168.6],[&quot;Holt-Winters aditif&quot;,[160.2,166.9,33.4,28.9],97.3,169.9]]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hasil</span><span>Satu kali pembagian vs validasi silang</span></div><h2>Kesimpulan bisa bergeser</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>Model</th><th>MAE uji 2025<br><span class=\"muted\">h = 1–12</span></th><th>MAE CV<br><span class=\"muted\">h = 1–3, 4 jendela</span></th><th>RMSE CV</th></tr></thead><tbody><tr><td>Naïve</td><td>111,4</td><td>222,8</td><td>314,2</td></tr><tr><td>Seasonal naïve</td><td>209,9</td><td>209,9</td><td>224,3</td></tr><tr><td>Drift</td><td>119,3</td><td>230,3</td><td>332,1</td></tr><tr><td>AutoETS</td><td>83,0</td><td>97,2</td><td>168,6</td></tr><tr><td>Holt-Winters aditif</td><td>106,0</td><td>97,3</td><td>169,9</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3h5v5M8 3H3v5M21 3l-7 7M3 3l7 7M12 22v-8\"/></svg>Yang berubah</h3><ul><li>Benchmark terbaik: naïve → <b>seasonal naïve</b>.</li><li>AutoETS vs Holt-Winters aditif: unggul jelas → <b>seri</b>.</li><li>Angka antar-kolom berbeda horizon; jangan dibandingkan langsung.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Persiapan</span><span>Python · 2 menit</span></div><h2>Siapkan lingkungan: Python lokal atau Google Colab</h2><p class=\"muted\" style=\"margin:.2em 0 .5em\">Pilih salah satu; kode praktikum sama persis di keduanya. Sudah disiapkan di Pertemuan 2; cukup aktifkan lagi (lokal) atau pasang ulang statsforecast dan unggah CSV (Colab).</p><div class=\"sim sim-env\" data-sim=\"env\" data-cfg=\"{&quot;id&quot;:&quot;p6-env&quot;,&quot;tabs&quot;:[{&quot;id&quot;:&quot;lokal&quot;,&quot;label&quot;:&quot;Python lokal&quot;,&quot;steps&quot;:[&quot;Pasang Python 3.10 atau lebih baru dari &lt;b&gt;python.org&lt;/b&gt; (Windows: centang &lt;i&gt;Add python.exe to PATH&lt;/i&gt;).&quot;,&quot;Buat folder &lt;code&gt;praktikum-peramalan&lt;/code&gt;; simpan CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; di folder itu.&quot;,&quot;Buka terminal di folder itu, buat dan aktifkan lingkungan virtual, lalu pasang pustaka (kode di samping). Cukup sekali.&quot;,&quot;Setiap praktikum: aktifkan lagi lingkungannya, jalankan &lt;code&gt;jupyter lab&lt;/code&gt;, buat notebook di folder yang sama.&quot;,&quot;Salin kode dari slide ke sel notebook; nama berkas CSV tidak perlu diubah.&quot;],&quot;code&quot;:&quot;python -m venv .venv\\n\\n# aktifkan (pilih sesuai OS)\\n.venv\\\\Scripts\\\\activate        # Windows\\nsource .venv/bin/activate     # macOS / Linux\\n\\npip install pandas matplotlib statsmodels scipy\\npip install statsforecast jupyterlab\\njupyter lab&quot;},{&quot;id&quot;:&quot;colab&quot;,&quot;label&quot;:&quot;Google Colab&quot;,&quot;steps&quot;:[&quot;Buka &lt;b&gt;colab.research.google.com&lt;/b&gt;, masuk akun Google, pilih &lt;i&gt;New notebook&lt;/i&gt;.&quot;,&quot;Sel pertama: pasang statsforecast (pandas, matplotlib, statsmodels, scipy sudah tersedia).&quot;,&quot;Unggah CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; dengan sel kedua, atau seret berkas ke panel &lt;i&gt;Files&lt;/i&gt; di kiri.&quot;,&quot;Jalankan kode dari slide apa adanya; berkas ada di folder kerja &lt;code&gt;/content&lt;/code&gt;.&quot;,&quot;Berkas unggahan hilang saat runtime direset: unggah ulang di sesi baru. Simpan notebook lewat &lt;i&gt;File › Save a copy in Drive&lt;/i&gt;; kumpulkan lewat &lt;i&gt;File › Download › .ipynb&lt;/i&gt;.&quot;],&quot;code&quot;:&quot;!pip install -q statsforecast\\n\\nfrom google.colab import files\\nfiles.upload()   # pilih berkas CSV dari slide&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 1</span><span>Python · 20 menit · indikator 1</span></div><h2>Empat metrik dengan utilsforecast</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import pandas as pd; from functools import partial\nfrom statsforecast import StatsForecast\nfrom statsforecast.models import (Naive, SeasonalNaive,\n    RandomWalkWithDrift, AutoETS, HoltWinters)\nfrom utilsforecast.evaluation import evaluate\nfrom utilsforecast.losses import mae, rmse, mape, mase\ndf = pd.read_csv(\"penjualan_umkm.csv\", parse_dates=[\"ds\"])\nlatih = df[df.ds &lt; \"2025-01-01\"]; uji = df[df.ds &gt;= \"2025-01-01\"]\nmodels = [Naive(), SeasonalNaive(season_length=12),\n          RandomWalkWithDrift(), AutoETS(season_length=12),\n          HoltWinters(season_length=12, error_type=\"A\", alias=\"HW_A\")]\nsf = StatsForecast(models=models, freq=\"MS\")\nfc = sf.forecast(df=latih, h=12)\nhasil = uji.merge(fc, on=[\"unique_id\", \"ds\"])\nev = evaluate(hasil, train_df=latih, metrics=[mae, rmse, mape,\n              partial(mase, seasonality=12)])\nprint(ev.drop(columns=\"unique_id\").set_index(\"metric\").T.round(3))</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Unduh <code>penjualan_umkm.csv</code> di bawah.</li><li>Jalankan; cocokkan dengan tabel di slide (MAPE dalam pecahan).</li><li>Hitung MAE AutoETS dengan tangan untuk 3 bulan pertama.</li><li>Ulangi pada data kelompok; tulis metrik mana yang dipakai dan mengapa.</li></ol></div></div><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;p6-dl1&quot;,&quot;compact&quot;:true,&quot;files&quot;:[{&quot;name&quot;:&quot;penjualan_umkm.csv&quot;,&quot;csv&quot;:&quot;unique_id,ds,y\\npenjualan_umkm,2022-01-01,675\\npenjualan_umkm,2022-02-01,652\\npenjualan_umkm,2022-03-01,666\\npenjualan_umkm,2022-04-01,1262\\npenjualan_umkm,2022-05-01,537\\npenjualan_umkm,2022-06-01,696\\npenjualan_umkm,2022-07-01,796\\npenjualan_umkm,2022-08-01,739\\npenjualan_umkm,2022-09-01,722\\npenjualan_umkm,2022-10-01,777\\npenjualan_umkm,2022-11-01,843\\npenjualan_umkm,2022-12-01,912\\npenjualan_umkm,2023-01-01,848\\npenjualan_umkm,2023-02-01,807\\npenjualan_umkm,2023-03-01,986\\npenjualan_umkm,2023-04-01,1239\\npenjualan_umkm,2023-05-01,769\\npenjualan_umkm,2023-06-01,895\\npenjualan_umkm,2023-07-01,960\\npenjualan_umkm,2023-08-01,990\\npenjualan_umkm,2023-09-01,958\\npenjualan_umkm,2023-10-01,952\\npenjualan_umkm,2023-11-01,1010\\npenjualan_umkm,2023-12-01,1135\\npenjualan_umkm,2024-01-01,961\\npenjualan_umkm,2024-02-01,1033\\npenjualan_umkm,2024-03-01,1374\\npenjualan_umkm,2024-04-01,1137\\npenjualan_umkm,2024-05-01,1089\\npenjualan_umkm,2024-06-01,1028\\npenjualan_umkm,2024-07-01,1062\\npenjualan_
