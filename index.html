=\"165\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"306.1\" cy=\"148.1\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"323.2\" cy=\"124.2\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"340.4\" cy=\"168.6\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"357.5\" cy=\"156.7\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"374.7\" cy=\"150.6\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"391.8\" cy=\"54.2\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"409\" cy=\"150.7\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"426.1\" cy=\"151.3\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"443.3\" cy=\"145.8\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"460.4\" cy=\"134\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"477.6\" cy=\"150.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"494.7\" cy=\"143.7\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"511.9\" cy=\"111.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"529\" cy=\"133.8\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"546.2\" cy=\"138.4\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"563.3\" cy=\"144.1\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"614.8\" cy=\"135\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"631.9\" cy=\"134\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"649.1\" cy=\"136.2\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"666.2\" cy=\"122.6\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"683.4\" cy=\"132.7\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"700.5\" cy=\"128.1\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"717.7\" cy=\"72.3\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"734.8\" cy=\"126.2\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"752\" cy=\"122\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"769.1\" cy=\"119\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"786.3\" cy=\"122.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"803.4\" cy=\"114\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"820.6\" cy=\"114.1\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"837.7\" cy=\"120.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"854.9\" cy=\"112.9\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"872\" cy=\"99\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"391.8\" cy=\"54.2\" r=\"11\" style=\"fill:none;stroke:var(--warn);stroke-width:2.5\"/><text x=\"407.8\" y=\"59.2\" class=\"s-tw\" style=\"font-size:11.5px\">entri ganda?</text><text x=\"70\" y=\"16\" class=\"s-hd\">KOTAK / BULAN · EKSPOR MENTAH</text></svg><figcaption>Ekspor mentah penjualan UMKM kue kering (data ilustrasi): satu entri ganda dan dua bulan kosong ditambahkan ke data Pertemuan 2. Puncak Lebaran tetap pola nyata.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Outlier</span><span>Indikator 3</span></div><h2>Mendeteksi outlier dengan sisa <button type=\"button\" class=\"term\" data-term=\"stl\">STL</button></h2><div class=\"cols w\"><div><ol><li>Dekomposisi seri dengan STL <b>robust</b>: tren + musiman + sisa.</li><li>Hitung kuartil sisa: Q1, Q3, dan <button type=\"button\" class=\"term\" data-term=\"iqr\">IQR</button> = Q3 − Q1.</li><li>Tandai sisa di bawah <b>Q1 − 3·IQR</b> atau di atas <b>Q3 + 3·IQR</b>.</li><li>Untuk setiap tanda: <b>tanyakan penyebabnya</b>, lalu putuskan.</li></ol><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §13.9)</span>; STL dari Cleveland et al. (1990).</p></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Penyebab</th><th>Keputusan</th></tr></thead><tbody><tr><td>salah ketik, entri ganda</td><td>koreksi dari sumber; bila tidak bisa, anggap hilang lalu isi</td></tr><tr><td>kejadian nyata, tidak berulang</td><td>pertahankan + dummy, atau keluarkan dari data latih</td></tr><tr><td>kejadian yang akan berulang</td><td>pertahankan; masukkan ke model (mis. hari libur)</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penyesuaian &amp; transformasi</span><span>Indikator 3–4</span></div><h2>Empat cara agar pola lebih sederhana</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/></svg><button type=\"button\" class=\"term\" data-term=\"calendar-adjustment\">Calendar adjustments</button></h3><p>Hilangkan variasi karena jumlah hari atau hari kerja yang berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg><button type=\"button\" class=\"term\" data-term=\"population-adjustment\">Population adjustments</button></h3><p>Ubah menjadi per orang atau per 100.000 penduduk.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg><button type=\"button\" class=\"term\" data-term=\"inflation-adjustment\">Inflation adjustments</button></h3><p>Ubah nilai rupiah nominal menjadi nilai riil.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 7V4H6l6 8-6 8h12v-3\"/></svg>Mathematical transformations</h3><p>Log, akar, atau Box-Cox untuk menstabilkan variasi.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Tujuannya: pola menjadi <b>lebih sederhana</b>, sehingga model lebih mudah dan ramalan lebih akurat <span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §3.1)</span>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penyesuaian kalender</span><span>Indikator 3 · data ilustrasi</span></div><h2>Per hari, bukan per bulan</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Bulan</th><th>Total</th><th>Hari buka</th><th>Per hari</th></tr></thead><tbody><tr><td>Januari 2025</td><td>1.240</td><td>31</td><td>40,0</td></tr><tr><td>Februari 2025</td><td>1.120</td><td>28</td><td>40,0</td></tr></tbody></table></div><p style=\"margin-top:.5em\">Penjualan Februari \"turun\" hanya karena bulannya lebih pendek. Rata-rata per <button type=\"button\" class=\"term\" data-term=\"trading-day\">hari operasional</button> menghilangkan efek ini <span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §3.1)</span>.</p></div><div><p style=\"margin:0 0 .3em\"><b>Efek Lebaran</b> (<button type=\"button\" class=\"term\" data-term=\"moving-holiday\">moving holiday</button>): hari H−14 s.d. H−1 per bulan</p><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Tahun</th><th>Idulfitri</th><th>Mar</th><th>Apr</th><th>Mei</th></tr></thead><tbody><tr><td>2022</td><td>2 Mei</td><td>0</td><td>13</td><td>1</td></tr><tr><td>2023</td><td>22 Apr</td><td>0</td><td>14</td><td>0</td></tr><tr><td>2024</td><td>10 Apr</td><td>5</td><td>9</td><td>0</td></tr><tr><td>2025</td><td>31 Mar</td><td>14</td><td>0</td><td>0</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Fitur kalender ini adalah definisi kerja mata kuliah ini; dipakai sebagai variabel di Pertemuan 11.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Populasi &amp; inflasi</span><span>Data ilustrasi</span></div><h2>Bandingkan yang sebanding</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Per 100.000 penduduk</h3><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Wilayah</th><th>Kasus</th><th>Penduduk</th><th>Per 100.000</th></tr></thead><tbody><tr><td>Kabupaten A</td><td>420</td><td>2.100.000</td><td>20,0</td></tr><tr><td>Kota B</td><td>300</td><td>600.000</td><td><b>50,0</b></td></tr></tbody></table></div><p style=\"font-size:.9em;margin-top:.4em\">Kasus lebih banyak di A, tetapi risiko lebih tinggi di B.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>Rupiah riil</h3><p style=\"font-size:.9em\">Omzet 2019: Rp40 juta (IHK 90). Omzet 2025: Rp52 juta (IHK 108).</p><p style=\"font-family:var(--mono);font-size:.8em\">riil 2025 = 52 × 90 / 108 = 43,3 juta</p><p style=\"font-size:.9em\">Naik ±8% secara riil, bukan 30%.</p><p class=\"muted\" style=\"font-size:.8em\"><button type=\"button\" class=\"term\" data-term=\"price-index\">IHK</button> bulanan diterbitkan BPS.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Konsep mengikuti Hyndman &amp; Athanasopoulos (2021, §3.1); semua angka adalah data ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Transformasi</span><span>Indikator 4</span></div><h2><button type=\"button\" class=\"term\" data-term=\"log-transformation\">Log</button> dan <button type=\"button\" class=\"term\" data-term=\"box-cox\">Box-Cox</button></h2><div class=\"cols w\"><div><p>Transformasi Box-Cox dengan parameter λ <span class=\"cite\">(Box &amp; Cox, 1964)</span>:</p><div class=\"card\" style=\"font-family:var(--mono);font-size:.78em;line-height:1.7\">w<sub>t</sub> = log(y<sub>t</sub>) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;bila λ = 0<br>w<sub>t</sub> = (sign(y<sub>t</sub>)|y<sub>t</sub>|<sup>λ</sup> − 1) / λ &nbsp;bila λ ≠ 0</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Rumus versi Hyndman &amp; Athanasopoulos (2021, §3.1), yang juga berlaku untuk nilai negatif.</p></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>λ</th><th>Artinya</th></tr></thead><tbody><tr><td>1</td><td>bentuk tidak berubah (hanya bergeser turun 1)</td></tr><tr><td>½</td><td>akar kuadrat (ditambah transformasi linear)</td></tr><tr><td>0</td><td>log natural</td></tr><tr><td>−1</td><td>kebalikan (1/y) ditambah 1</td></tr></tbody></table><div class=\"callout\" style=\"margin-top:.6em\">λ yang baik membuat <b>besar variasi musiman hampir sama</b> di sepanjang seri.</div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Transformasi</span><span>Indikator 4 · data ilustrasi</span></div><h2>Kapan transformasi diperlukan?</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 212\" style=\"max-height:11.5em\" role=\"img\" aria-label=\"Dua panel data ilustrasi bulanan 8 tahun. Kiri skala asli: tren naik dan gelombang musiman yang makin besar seiring naiknya level. Kanan setelah transformasi log: gelombang musiman berukuran hampir sama di sepanjang seri dan tren menjadi lurus.\"><rect x=\"8\" y=\"8\" width=\"430\" height=\"196\" rx=\"8\" class=\"s-box\"/><text x=\"24\" y=\"32\" class=\"s-hd\">SKALA ASLI</text> &quot;steps&quot;:[&quot;Pasang Python 3.10 atau lebih baru dari &lt;b&gt;python.org&lt;/b&gt; (Windows: centang &lt;i&gt;Add python.exe to PATH&lt;/i&gt;).&quot;,&quot;Buat folder &lt;code&gt;praktikum-peramalan&lt;/code&gt;; simpan CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; di folder itu.&quot;,&quot;Buka terminal di folder itu, buat dan aktifkan lingkungan virtual, lalu pasang pustaka (kode di samping). Cukup sekali.&quot;,&quot;Setiap praktikum: aktifkan lagi lingkungannya, jalankan &lt;code&gt;jupyter lab&lt;/code&gt;, buat notebook di folder yang sama.&quot;,&quot;Salin kode dari slide ke sel notebook; nama berkas CSV tidak perlu diubah.&quot;],&quot;code&quot;:&quot;python -m venv .venv\\n\\n# aktifkan (pilih sesuai OS)\\n.venv\\\\Scripts\\\\activate        # Windows\\nsource .venv/bin/activate     # macOS / Linux\\n\\npip install pandas matplotlib statsmodels scipy\\npip install statsforecast jupyterlab\\njupyter lab&quot;},{&quot;id&quot;:&quot;colab&quot;,&quot;label&quot;:&quot;Google Colab&quot;,&quot;steps&quot;:[&quot;Buka &lt;b&gt;colab.research.google.com&lt;/b&gt;, masuk akun Google, pilih &lt;i&gt;New notebook&lt;/i&gt;.&quot;,&quot;Sel pertama: pasang statsforecast (pandas, matplotlib, statsmodels, scipy sudah tersedia).&quot;,&quot;Unggah CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; dengan sel kedua, atau seret berkas ke panel &lt;i&gt;Files&lt;/i&gt; di kiri.&quot;,&quot;Jalankan kode dari slide apa adanya; berkas ada di folder kerja &lt;code&gt;/content&lt;/code&gt;.&quot;,&quot;Berkas unggahan hilang saat runtime direset: unggah ulang di sesi baru. Simpan notebook lewat &lt;i&gt;File › Save a copy in Drive&lt;/i&gt;; kumpulkan lewat &lt;i&gt;File › Download › .ipynb&lt;/i&gt;.&quot;],&quot;code&quot;:&quot;!pip install -q statsforecast\\n\\nfrom google.colab import files\\nfiles.upload()   # pilih berkas CSV dari slide&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum</span><span>Python · 30 menit</span></div><h2>Membersihkan dan menyesuaikan data</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import numpy as np, pandas as pd\nfrom statsmodels.tsa.seasonal import STL\nfrom scipy.stats import boxcox\n\ndf = pd.read_csv(\"penjualan_umkm_mentah.csv\", parse_dates=[\"ds\"])\ns = df.set_index(\"ds\")[\"y\"].asfreq(\"MS\")  # baris hilang -&gt; NaN\nprint(s.isna().sum())\ns_isi = s.interpolate(method=\"time\")      # isi celah pendek\n\nres = STL(s_isi, period=12, seasonal=13, robust=True).fit()\nr = res.resid; q1, q3 = r.quantile([.25, .75]); iqr = q3 - q1\nprint(r[(r &lt; q1 - 3*iqr) | (r &gt; q3 + 3*iqr)])  # calon outlier\n\nper_hari = s_isi / s_isi.index.days_in_month   # kalender\ny_log = np.log(s_isi)                           # log\ny_bc, lam = boxcox(s_isi)                       # Box-Cox</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Unduh <code>penjualan_umkm_mentah.csv</code> di bawah (ada entri ganda dan bulan kosong).</li><li>Temukan bulan kosong dan calon outlier.</li><li>Putuskan perlakuan; tulis di <b>log persiapan data</b>.</li><li>Buat versi per hari dan versi log; bandingkan grafiknya.</li><li>Ulangi pada data kelompok.</li></ol></div></div><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;p3-dl&quot;,&quot;files&quot;:[{&quot;name&quot;:&quot;penjualan_umkm_mentah.csv&quot;,&quot;csv&quot;:&quot;unique_id,ds,y\\npenjualan_umkm,2022-01-01,675\\npenjualan_umkm,2022-02-01,652\\npenjualan_umkm,2022-03-01,666\\npenjualan_umkm,2022-0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>A · Dinas kesehatan</h3><p>Ramalan kasus DBD bulanan untuk 18 kecamatan dengan jumlah penduduk sangat berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>B · Koperasi pesantren</h3><p>Omzet toko koperasi dalam rupiah, 2015–2025, untuk rencana anggaran.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5V8z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>C · Toko oleh-oleh</h3><p>Penjualan harian; toko tutup 5 hari setiap libur Lebaran, tercatat kosong.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>D · Aplikasi layanan desa</h3><p>Jumlah pengguna bulanan tumbuh pesat; lonjakan tiap awal tahun makin besar.</p></div></div><div class=\"callout\" style=\"margin-top:.7em\">Untuk tiap kasus: pilih penyesuaian atau transformasi utama, dan jelaskan alasannya dalam satu kalimat.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok Tugas 1 · 20 menit</span></div><h2>Log persiapan data kasus Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Masalah</th><th>Bukti</th><th>Tindakan</th><th>Alasan</th></tr></thead><tbody><tr><td>2 bulan kosong</td><td><code>isna()</code> = 2</td><td>isi dari buku kas</td><td>sumber asli tersedia</td></tr><tr><td>…</td><td>…</td><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah</h3><ol><li>Tetapkan <b>kasus final</b> hari ini.</li><li>Isi log untuk setiap masalah data.</li><li>Putuskan penyesuaian dan transformasi.</li><li>Tunjukkan satu grafik sebelum dan sesudah.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Data hilang</b>: kenali penyebabnya; kosong ≠ nol; hilang karena kejadian jangan diisi rata-rata.</li><li><b>Outlier</b>: cari pada sisa STL robust (batas 3·IQR); koreksi bila salah catat, pertahankan bila kejadian nyata.</li><li><b>Penyesuaian</b>: kalender (per hari, efek Lebaran), populasi (per 100.000), inflasi (rupiah riil).</li><li><b>Transformasi</b>: log atau Box-Cox bila variasi membesar seiring level; jangan lupa transformasi balik.</li><li>Setiap keputusan dicatat di <b>log persiapan data</b>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Outlier bisa kesalahan atau kejadian nyata; penyebabnya harus dicek sebelum diputuskan.\"><p class=\"q\">Penjualan Agustus melonjak dua kali lipat dan tidak berulang tiap tahun. Langkah pertama…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. langsung hapus</button><button type=\"button\" data-o=\"b\">B. cek penyebab ke pemilik data</button><button type=\"button\" data-o=\"c\">C. ganti dengan rata-rata</button><button type=\"button\" data-o=\"d\">D. biarkan saja</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Kasus per 100.000 penduduk membuat wilayah sebanding.\"><p class=\"q\">Kasus DBD dua kecamatan yang penduduknya sangat berbeda dibandingkan dengan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. penyesuaian kalender</button><button type=\"button\" data-o=\"b\">B. penyesuaian populasi</button><button type=\"button\" data-o=\"c\">C. transformasi log</button><button type=\"button\" data-o=\"d\">D. interpolasi</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"λ = 0 adalah log natural (Hyndman &amp; Athanasopoulos, 2021, §3.1).\"><p class=\"q\">Pada transformasi Box-Cox, nilai λ = 0 berarti…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. tidak ada transformasi</button><button type=\"button\" data-o=\"b\">B. akar kuadrat</button><button type=\"button\" data-o=\"c\">C. log natural</button><button type=\"button\" data-o=\"d\">D. kebalikan 1/y</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Hyndman &amp; Athanasopoulos (2021) §3.1 dan §13.9, atau padanannya di versi Python (Hyndman et al., 2025). Persiapan Pertemuan 4: bab 3 tentang dekomposisi dan §5.2 tentang metode peramalan sederhana.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P2–3)</h3><ul><li>Notebook eksplorasi: lima grafik beserta interpretasi.</li><li>Persiapan data: data hilang, outlier, penyesuaian, transformasi.</li><li>Log persiapan data (masalah, bukti, tindakan, alasan).</li><li>Data bersih siap pakai dalam format <code>unique_id, ds, y</code>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Notebook harus bisa dijalankan ulang dari awal. Bawa data bersih ke Pertemuan 4: kita mulai membangun model benchmark.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Missing value</span></dt><dd>Periode yang seharusnya tercatat tetapi nilainya kosong (NaN), berbeda dengan nilai nol. <i>(data hilang / nilai kosong)</i></dd></div><div><dt><span class=\"en\">Interpolation</span></dt><dd>Mengisi nilai kosong dengan perkiraan dari nilai di sekitarnya, mis. garis lurus antara dua titik. <i>(interpolasi)</i></dd></div><div><dt><span class=\"en\">Outlier</span></dt><dd>Observasi yang sangat berbeda dari sebagian besar data; bisa kesalahan pencatatan atau kejadian nyata. <i>(pencilan)</i></dd></div><div><dt><span class=\"en\">IQR</span></dt><dd>Interquartile range: selisih kuartil ketiga (Q3) dan kuartil pertama (Q1). <i>(jangkauan antarkuartil)</i></dd></div><div><dt><span class=\"en\">STL</span></dt><dd>Seasonal and Trend decomposition using Loess: memecah seri menjadi tren, musiman, dan sisa; versi robust tahan outlier. <i>(dekomposisi STL)</i></dd></div><div><dt><span class=\"en\">Calendar adjustment</span></dt><dd>Menghilangkan variasi yang muncul hanya karena perbedaan kalender, mis. jumlah hari atau hari kerja per bulan. <i>(penyesuaian kalender)</i></dd></div><div><dt><span class=\"en\">Trading day</span></dt><dd>Hari ketika usaha atau layanan benar-benar beroperasi, mis. hari buka toko atau hari kerja kantor. <i>(hari operasional / hari kerja)</i></dd></div><div><dt><span class=\"en\">Moving holiday</span></dt><dd>Hari libur yang tanggal Masehinya bergeser tiap tahun, mis. Idulfitri (maju ± 11 hari per tahun). <i>(hari libur bergerak)</i></dd></div><div><dt><span class=\"en\">Population adjustment</span></dt><dd>Mengubah data menjadi per orang, per seribu, atau per 100.000 penduduk agar wilayah atau tahun dapat dibandingkan. <i>(penyesuaian populasi)</i></dd></div><div><dt><span class=\"en\">Inflation adjustment</span></dt><dd>Mengubah nilai uang nominal menjadi nilai riil pada harga tahun dasar memakai indeks harga. <i>(penyesuaian inflasi)</i></dd></div><div><dt><span class=\"en\">Price index (CPI)</span></dt><dd>Indeks harga konsumen; di Indonesia diterbitkan BPS sebagai IHK. <i>(indeks harga konsumen (IHK))</i></dd></div><div><dt><span class=\"en\">Log transformation</span></dt><dd>Mengganti y dengan log(y); perubahan pada skala log setara perubahan persentase pada skala asli. <i>(transformasi logaritma)</i></dd></div><div><dt><span class=\"en\">Box-Cox transformation</span></dt><dd>Keluarga transformasi pangkat dengan parameter λ; λ = 0 berarti log natural. <i>(transformasi Box-Cox)</i></dd></div><div><dt><span class=\"en\">Back-transformation</span></dt><dd>Mengembalikan ramalan dari skala transformasi ke skala asli data. <i>(transformasi balik)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\" style=\"font-size:.74em;gap:.3em\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Montgomery, D. C., Jennings, C. L., &amp; Kulahci, M. (2015). <i>Introduction to time series analysis and forecasting</i> (2nd ed.). John Wiley &amp; Sons.</li><li>Box, G. E. P., &amp; Cox, D. R. (1964). An analysis of transformations. <i>Journal of the Royal Statistical Society: Series B (Methodological), 26</i>(2), 211–252.</li><li>Guerrero, V. M. (1993). Time-series analysis supported by power transformations. <i>Journal of Forecasting, 12</i>(1), 37–48.</li><li>Cleveland, R. B., Cleveland, W. S., McRae, J. E., &amp; Terpenning, I. (1990). STL: A seasonal-trend decomposition procedure based on loess. <i>Journal of Official Statistics, 6</i>(1), 3–73.</li><li>Seabold, S., &amp; Perktold, J. (2010). Statsmodels: Econometric and statistical modeling with Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i>.</li><li>Virtanen, P., Gommers, R., Oliphant, T. E., Haberland, M., Reddy, T., Cournapeau, D., et al. (2020). SciPy 1.0: Fundamental algorithms for scientific computing in Python. <i>Nature Methods, 17</i>(3), 261–272.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 4.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":4,"title":"Metode Dasar & Dekomposisi","subtitle":"Mean, naive, seasonal naive, drift sebagai benchmark; dekomposisi klasik dan STL","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Metode Peramalan (Forecasting) · SII017</span></div><h1>Metode Dasar &amp; Dekomposisi</h1><p class=\"lead\">Mean, naive, seasonal naive, drift sebagai benchmark; dekomposisi klasik dan STL</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Benchmark + dekomposisi + praktikum Python</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengimplementasikan metode dasar, dekomposisi, dan exponential smoothing (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 di Pertemuan 5)</span></h3><ol><li>Ketepatan menerapkan metode naive, seasonal naive, drift, dan rata-rata.</li><li>Ketepatan melakukan dekomposisi klasik dan STL.</li><li>Ketepatan membangun model SES, Holt, dan Holt-Winters (ETS). <span class=\"muted\">(Pertemuan 5)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu mengimplementasikan dan mengevaluasi metode peramalan statistik (dekomposisi, exponential smoothing, ARIMA, dan regresi) pada data runtun waktu.</dd><dt>CPL-8</dt><dd class=\"id\">Mampu mengimplementasikan kebutuhan komputasi dan sistem informasi dengan mempertimbangkan berbagai metode, algoritma, serta pendekatan berbasis data.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Praktikum (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 3 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Mengapa puncak Lebaran <b>bukan</b> outlier?</li><li>Kapan transformasi log diperlukan?</li><li>Apa isi log persiapan data?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Data bersih tanpa bulan kosong?</li><li>Frekuensi jelas (<code>MS</code>, <code>W</code>, <code>D</code>)?</li><li>Keputusan transformasi sudah dicatat?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>5 menit · berpasangan · data ilustrasi</span></div><h2>Tebakan paling sederhana untuk 2025</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Bulan</th><th>Penjualan (kotak)</th></tr></thead><tbody><tr><td>Jan 2022</td><td>675</td></tr><tr><td>Mar 2022</td><td>666</td></tr><tr><td>Apr 2022</td><td>1.262</td></tr><tr><td>Jan 2024</td><td>961</td></tr><tr><td>Mar 2024</td><td>1.374</td></tr><tr><td>Apr 2024</td><td>1.137</td></tr><tr><td>Okt 2024</td><td>1.135</td></tr><tr><td>Nov 2024</td><td>1.112</td></tr><tr><td>Des 2024</td><td>1.256</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Diskusikan berpasangan</h3><p>Bu Siti hanya punya data Jan 2022–Des 2024. Tanpa model rumit, berapa tebakan Anda untuk:</p><ol><li>Januari 2025?</li><li>Maret 2025?</li><li>Desember 2025?</li></ol><p class=\"muted\" style=\"font-size:.85em\">Tulis juga <b>cara</b> Anda menebak.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Mengapa butuh metode benchmark?</h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Some forecasting methods are extremely simple and surprisingly effective.\"</p><p class=\"tr\">\"Beberapa metode peramalan sangat sederhana dan efektif secara mengejutkan.\"</p><div class=\"src\">Hyndman &amp; Athanasopoulos (2021, §5.2); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z\"/><path d=\"m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2\"/></svg>Peran <button type=\"button\" class=\"term\" data-term=\"benchmark\">benchmark</button></h3><ul><li>Menjadi <b>batas bawah</b>: model baru harus lebih akurat darinya.</li><li>Mudah dijelaskan kepada pengambil keputusan.</li><li>Kadang justru menjadi metode terbaik.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Di buku, empat metode ini dipakai sebagai benchmark sepanjang buku <span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §5.2)</span>.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Empat benchmark</span><span>Indikator 1</span></div><h2>Mean, naïve, seasonal naïve, drift</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Metode</th><th>Rumus ramalan ŷ<sub>T+h|T</sub></th><th>Gagasan</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"mean-method\">Mean</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">ȳ = (y<sub>1</sub> + … + y<sub>T</sub>) / T</td><td>semua ramalan = rata-rata historis</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"naive-method\">Naïve</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">y<sub>T</sub></td><td>semua ramalan = observasi terakhir</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"seasonal-naive\">Seasonal naïve</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">y<sub>T+h−m(k+1)</sub></td><td>= nilai terakhir dari musim yang sama</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"drift-method\">Drift</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">y<sub>T</sub> + h · (y<sub>T</sub> − y<sub>1</sub>) / (T − 1)</td><td>garis dari observasi pertama ke terakhir, diteruskan</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">T: banyak observasi · h: horizon · m: periode musiman (12 untuk bulanan) · k: bagian bulat (h − 1)/m. Rumus sesuai Hyndman &amp; Athanasopoulos (2021, §5.2).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hasil benchmark</span><span>Indikator 1 · data ilustrasi</span></div><h2>Empat benchmark pada data UMKM</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 340\" style=\"max-height:15.5em\" role=\"img\" aria-label=\"Empat panel ramalan benchmark penjualan UMKM tahun 2025 dari data latih Januari 2022 sampai Desember 2024. Mean: garis datar sekitar 953, jauh di bawah data aktual. Naive: garis datar 1.256. Seasonal naive: mengulang pola 2024 termasuk puncak Maret. Drift: garis naik dari 1.256. Garis putus-putus adalah data aktual 2025. Data ilustrasi.\"><rect x=\"10\" y=\"8\" width=\"436\" height=\"152\" rx=\"6\" class=\"s-box\"/><text x=\"24\" y=\"30\" class=\"s-hd\">MEAN</text><text x=\"432\" y=\ .1 L604.9 256.9 L613.5 294.5 L622.1 284.4 L630.7 279.2 L639.3 276.8 L647.9 279.4 L656.5 279.8 L665.1 275.2 L673.7 265.2 L682.3 279.1 L690.9 273.4 L699.5 246.1 L708.1 265 L716.7 268.9 L725.3 273.8 L733.9 271 L742.5 262.2 L751.1 266 L759.7 265.2 L768.3 267 L776.9 255.5\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2\"/><path d=\"M776.9 255.5 L785.4 264.1 L794 260.2 L802.6 212.9 L811.2 258.6 L819.8 255 L828.4 252.5 L837 255.4 L845.6 248.2 L854.2 248.3 L862.8 253.8 L871.4 247.3 L880 235.5\" class=\"s-dash\" style=\"stroke-width:2\"/><path d=\"M776.9 255.5 L785.4 254.2 L794 252.9 L802.6 251.5 L811.2 250.2 L819.8 248.9 L828.4 247.6 L837 246.2 L845.6 244.9 L854.2 243.6 L862.8 242.2 L871.4 240.9 L880 239.6\" class=\"s-warnline\" style=\"stroke-width:2.6\"/><line x1=\"30\" y1=\"333\" x2=\"58\" y2=\"333\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2\"/><text x=\"64\" y=\"337\" class=\"s-s\">data latih 2022–2024</text><line x1=\"230\" y1=\"333\" x2=\"258\" y2=\"333\" class=\"s-dash\" style=\"stroke-width:2\"/><text x=\"264\" y=\"337\" class=\"s-s\">aktual 2025</text><line x1=\"380\" y1=\"333\" x2=\"408\" y2=\"333\" class=\"s-warnline\" style=\"stroke-width:2.6\"/><text x=\"414\" y=\"337\" class=\"s-s\">ramalan</text></svg><figcaption>Empat metode benchmark (Hyndman &amp; Athanasopoulos, 2021, §5.2) pada data ilustrasi UMKM. MAE dihitung dari 12 bulan 2025; metrik ini dibahas di Pertemuan 6.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Memilih benchmark</span><span>Indikator 1</span></div><h2>Kapan memakai yang mana?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Metode</th><th>Cocok untuk</th><th>Kelemahan</th></tr></thead><tbody><tr><td><b>Mean</b></td><td>data tanpa tren dan musiman, berfluktuasi di sekitar rata-rata</td><td>tertinggal bila level berubah</td></tr><tr><td><b>Naïve</b></td><td>data mirip random walk, mis. harga harian</td><td>tidak mengenal musiman</td></tr><tr><td><b>Seasonal naïve</b></td><td>data bermusim kuat dengan level stabil</td><td>tidak mengenal tren; puncak bergeser ikut terbawa</td></tr><tr><td><b>Drift</b></td><td>data bertren tanpa musiman kuat</td><td>bergantung titik pertama dan terakhir</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.6em\">Di Tugas 1, jalankan <b>keempatnya</b>; pilihan akhir dibuktikan dengan akurasi di data uji (Pertemuan 6), bukan dengan tebakan.</div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Disusun dosen dari uraian Hyndman &amp; Athanasopoulos (2021, §5.2).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Persiapan</span><span>Python · 2 menit</span></div><h2>Siapkan lingkungan: Python lokal atau Google Colab</h2><p class=\"muted\" style=\"margin:.2em 0 .5em\">Pilih salah satu; kode praktikum sama persis di keduanya. Sudah disiapkan di Pertemuan 2; cukup aktifkan lagi (lokal) atau pasang ulang statsforecast dan unggah CSV (Colab).</p><div class=\"sim sim-env\" data-sim=\"env\" data-cfg=\"{&quot;id&quot;:&quot;p4-env&quot;,&quot;tabs&quot;:[{&quot;id&quot;:&quot;lokal&quot;,&quot;label&quot;:&quot;Python lokal&quot;,&quot;steps&quot;:[&quot;Pasang Python 3.10 atau lebih baru dari &lt;b&gt;python.org&lt;/b&gt; (Windows: centang &lt;i&gt;Add python.exe to PATH&lt;/i&gt;).&quot;,&quot;Buat folder &lt;code&gt;praktikum-peramalan&lt;/code&gt;; simpan CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; di folder itu.&quot;,&quot;Buka terminal di folder itu, buat dan aktifkan lingkungan virtual, lalu pasang pustaka (kode di samping). Cukup sekali.&quot;,&quot;Setiap praktikum: aktifkan lagi lingkungannya, jalankan &lt;code&gt;jupyter lab&lt;/code&gt;, buat notebook di folder yang sama.&quot;,&quot;Salin kode dari slide ke sel notebook; nama berkas CSV tidak perlu diubah.&quot;],&quot;code&quot;:&quot;python -m venv .venv\\n\\n# aktifkan (pilih sesuai OS)\\n.venv\\\\Scripts\\\\activate        # Windows\\nsource .venv/bin/activate     # macOS / Linux\\n\\npip install pandas matplotlib statsmodels scipy\\npip install statsforecast jupyterlab\\njupyter lab&quot;},{&quot;id&quot;:&quot;colab&quot;,&quot;label&quot;:&quot;Google Colab&quot;,&quot;steps&quot;:[&quot;Buka &lt;b&gt;colab.research.google.com&lt;/b&gt;, masuk akun Google, pilih &lt;i&gt;New notebook&lt;/i&gt;.&quot;,&quot;Sel pertama: pasang statsforecast (pandas, matplotlib, statsmodels, scipy sudah tersedia).&quot;,&quot;Unggah CSV hasil &lt;b&gt;Unduh CSV&lt;/b&gt; dengan sel kedua, atau seret berkas ke panel &lt;i&gt;Files&lt;/i&gt; di kiri.&quot;,&quot;Jalankan kode dari slide apa adanya; berkas ada di folder kerja &lt;code&gt;/content&lt;/code&gt;.&quot;,&quot;Berkas unggahan hilang saat runtime direset: unggah ulang di sesi baru. Simpan notebook lewat &lt;i&gt;File › Save a copy in Drive&lt;/i&gt;; kumpulkan lewat &lt;i&gt;File › Download › .ipynb&lt;/i&gt;.&quot;],&quot;code&quot;:&quot;!pip install -q statsforecast\\n\\nfrom google.colab import files\\nfiles.upload()   # pilih berkas CSV dari slide&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 1</span><span>Python · 25 menit · indikator 1</span></div><h2>Benchmark dengan statsforecast</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import pandas as pd\nfrom statsforecast import StatsForecast\nfrom statsforecast.models import (HistoricAverage, Naive,\n    SeasonalNaive, RandomWalkWithDrift)\n\ndf = pd.read_csv(\"penjualan_umkm.csv\", parse_dates=[\"ds\"])\nlatih = df[df.ds &lt; \"2025-01-01\"]          # Jan 2022–Des 2024\nuji   = df[df.ds &gt;= \"2025-01-01\"]         # 12 bulan 2025\n\nsf = StatsForecast(models=[HistoricAverage(), Naive(),\n        SeasonalNaive(season_length=12), RandomWalkWithDrift()],\n        fr troke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0\"/></svg>Terlalu halus</h3><p>Tren cenderung terlalu menghaluskan kenaikan dan penurunan tajam.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Musiman dianggap tetap</h3><p>Pola musiman diasumsikan berulang sama setiap tahun.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Tidak robust</h3><p>Nilai tidak biasa (mis. entri ganda) ikut memengaruhi tren dan musiman.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Empat kelemahan menurut Hyndman &amp; Athanasopoulos (2021, §3.4).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">STL</span><span>Indikator 2 · data ilustrasi</span></div><h2>STL: musiman boleh berubah</h2><div class=\"cols w\"><div><ul><li><b><button type=\"button\" class=\"term\" data-term=\"stl\">STL</button></b>: Seasonal and Trend decomposition using Loess.</li><li>Komponen musiman <b>boleh berubah</b> dari tahun ke tahun; kecepatannya diatur parameter <code>seasonal</code>.</li><li>Kehalusan tren diatur parameter <code>trend</code>; keduanya bilangan ganjil.</li><li>Bisa <b>robust</b> terhadap outlier.</li><li>Hanya aditif; untuk multiplikatif, ambil log dulu.</li></ul><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Cleveland et al., 1990; Hyndman &amp; Athanasopoulos, 2021, §3.6)</span></p></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Komponen musiman</th><th>Mar</th><th>Apr</th></tr></thead><tbody><tr><td>Klasik (semua tahun)</td><td>+295</td><td>+95</td></tr><tr><td>STL 2022</td><td>−57</td><td>+524</td></tr><tr><td>STL 2023</td><td>+130</td><td>+322</td></tr><tr><td>STL 2024</td><td>+317</td><td>+120</td></tr><tr><td>STL 2025</td><td>+503</td><td>−82</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.78em;margin-top:.3em\">STL(period=12, seasonal=13, robust=True), statsmodels.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dekomposisi untuk peramalan</span><span>Indikator 1–2</span></div><h2>Pisahkan, ramal, gabungkan</h2><div class=\"cols w\"><div><p>Data aditif ditulis ulang sebagai:</p><p style=\"font-family:var(--mono);font-size:.85em;text-align:center\">y<sub>t</sub> = Ŝ<sub>t</sub> + Â<sub>t</sub>, &nbsp; Â<sub>t</sub> = T̂<sub>t</sub> + R̂<sub>t</sub></p><ol><li>Ramal <button type=\"button\" class=\"term\" data-term=\"seasonally-adjusted\">data terkoreksi musiman</button> Â<sub>t</sub> dengan metode non-musiman (mis. <b>drift</b> atau naïve).</li><li>Ramal komponen musiman Ŝ<sub>t</sub> dengan <b>seasonal naïve</b>.</li><li>Jumlahkan keduanya.</li></ol><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §5.7)</span></p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3h5v5M8 3H3v5M21 3l-7 7M3 3l7 7M12 22v-8\"/></svg>Mengapa berguna?</h3><ul><li>Menggabungkan kekuatan <b>drift</b> (tren) dan <b>seasonal naïve</b> (musiman).</li><li>Data terkoreksi musiman juga dipakai di laporan resmi, mis. data ketenagakerjaan.</li><li>Holt-Winters (Pertemuan 5) mengerjakan hal serupa sekaligus.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 2</span><span>Python · 20 menit · indikator 2</span></div><h2>Dekomposisi klasik dan STL</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import pandas as pd\nfrom statsmodels.tsa.seasonal import seasonal_decompose, STL\n\ndf = pd.read_csv(\"penjualan_umkm.csv\", parse_dates=[\"ds\"])\ns = df.set_index(\"ds\")[\"y\"].asfreq(\"MS\")\n\nklasik = seasonal_decompose(s, model=\"additive\", period=12)\nklasik.plot()\nprint(klasik.seasonal[:12].round(1))   # 12 indeks musiman\n\nstl = STL(s, period=12, seasonal=13, robust=True).fit()\nstl.plot()\nsa = s - stl.seasonal                   # terkoreksi musiman\n\n# multiplikatif: klasik  -&gt; model=\"multiplicative\"\n#               STL     -&gt; STL(np.log(s), ...) lalu exp</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Jalankan dekomposisi klasik; catat 12 indeks musiman.</li><li>Jalankan STL; bandingkan komponen musiman antartahun.</li><li>Lihat sisa: masih ada pola?</li><li>Putuskan aditif atau multiplikatif untuk data kelompok, dengan alasan.</li></ol></div></div><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;p4-dl2&quot;,&quot;compact&quot;:true,&quot;files&quot;:[{&quot;name&quot;:&quot;penjualan_umkm.csv&quot;,&quot;csv&quot;:&quot;unique_id,ds,y\\npenjualan_umkm,2022-01-01,675\\npenjualan_umkm,2022-02-01,652\\npenjualan_umkm,2022-03-01,666\\npenjualan_umkm,2022-04-01,1262\\npenjualan_umkm,2022-05-01,537\\npenjualan_umkm,2022-06-01,696\\npenjual atihan</span><span>Berpasangan · 6 menit · kasus ilustrasi</span></div><h2>Benchmark dan dekomposisi apa?</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>A · Puskesmas</h3><p>Kunjungan pasien harian, ramai tiap Senin, level stabil 3 tahun.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>B · Perpustakaan kampus</h3><p>Peminjaman bulanan; ramai saat UTS–UAS, sepi saat libur; tren turun pelan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>C · Toko daring UMKM</h3><p>Pesanan bulanan tumbuh cepat; lonjakan Harbolnas Desember makin besar tiap tahun.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>D · Kurs harian</h3><p>Kurs rupiah per hari kerja, tanpa pola musiman jelas.</p></div></div><div class=\"callout\" style=\"margin-top:.7em\">Untuk tiap kasus: (1) benchmark utama; (2) aditif atau multiplikatif; (3) alasan satu kalimat.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok Tugas 1 · 20 menit · indikator 1–2</span></div><h2>Benchmark dan dekomposisi kasus Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Metode</th><th>Ramalan h = 1</th><th>MAE uji</th><th>Catatan</th></tr></thead><tbody><tr><td>Mean</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Naïve</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Seasonal naïve</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Drift</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah</h3><ol><li>Tentukan data uji (mis. 12 bulan terakhir).</li><li>Isi tabel empat benchmark.</li><li>Jalankan dekomposisi klasik dan STL.</li><li>Putuskan aditif/multiplikatif; tulis buktinya.</li><li>Tunjukkan satu grafik ke kelas.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Benchmark</b> (mean, naïve, seasonal naïve, drift) adalah batas bawah: model lain harus lebih akurat.</li><li>Pemenang benchmark bergantung pola data; tidak satu pun menangkap tren <b>dan</b> musiman sekaligus.</li><li><b>Dekomposisi</b>: y = S + T + R (aditif) atau S × T × R (multiplikatif).</li><li><b>Klasik</b>: 2×12-MA + musiman tetap; ujung kosong dan tidak robust.</li><li><b>STL</b>: musiman boleh berubah dan robust; hanya aditif, log untuk multiplikatif.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Seasonal naïve memakai nilai bulan yang sama tahun lalu, cocok untuk musiman kuat dengan level stabil.\"><p class=\"q\">Data bulanan bermusim kuat dengan level stabil. Benchmark paling masuk akal…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. mean</button><button type=\"button\" data-o=\"b\">B. naïve</button><button type=\"button\" data-o=\"c\">C. seasonal naïve</button><button type=\"button\" data-o=\"d\">D. drift</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"1.256 + 3 × (1.256 − 675)/35 ≈ 1.256 + 49,8 = 1.305,8.\"><p class=\"q\">Drift: y<sub>T</sub> = 1.256, y<sub>1</sub> = 675, T = 36. Ramalan h = 3 kira-kira…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. 1.272,6</button><button type=\"button\" data-o=\"b\">B. 1.305,8</button><button type=\"button\" data-o=\"c\">C. 1.256,0</button><button type=\"button\" data-o=\"d\">D. 953,1</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Musiman klasik diulang sama tiap tahun, sehingga puncak yang bergeser bocor ke sisa.\"><p class=\"q\">Kelemahan dekomposisi klasik yang paling terlihat pada data Lebaran bergeser…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. tren tersedia di semua bulan</button><button type=\"button\" data-o=\"b\">B. komponen musiman dianggap sama tiap tahun</button><button type=\"button\" data-o=\"c\">C. hanya untuk data harian</button><button type=\"button\" data-o=\"d\">D. tidak bisa aditif</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Hyndman &amp; Athanasopoulos (2021) bab 3 (dekomposisi) dan §5.2, §5.7, atau padanannya di versi Python (Hyndman et al., 2025). Persiapan Pertemuan 5: bab 8 tentang exponential smoothing.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P4–5)</h3><ul><li>Notebook: empat benchmark, tabel ramalan dan MAE data uji.</li><li>Dekomposisi klasik dan STL beserta interpretasi.</li><li>Keputusan aditif/multiplikatif dengan bukti.</li><li>Model ETS ditambahkan setelah Pertemuan 5.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bobot bagian P4–5: Tugas 1 10% (Penilaian Praktikum). Tenggat: [PERLU DIISI].</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Benchmark method</span></dt><dd>Metode sangat sederhana yang dipakai sebagai pembanding; model lain layak dipakai hanya bila lebih akurat darinya. <i>(metode pembanding / tolok ukur)</i></dd></div><div><dt><span class=\"en\">Mean method</span></dt><dd>Semua ramalan sama dengan rata-rata data historis. <i>(metode rata-rata)</i></dd></div><div><dt><span class=\"en\">Naïve method</span></dt><dd>Semua ramalan sama dengan observasi terakhir; disebut juga random walk forecast. <i>(metode naif)</i></dd></div><div><dt><span class=\"en\">Seasonal naïve method</span></dt><dd>Ramalan sama dengan nilai terakhir dari musim yang sama, mis. bulan yang sama tahun lalu. <i>(metode naif musiman)</i></dd></div><div><dt><span class=\"en\">Drift method</span></dt><dd>Variasi naive yang membiarkan ramalan naik atau turun sebesar rata-rata perubahan historis. <i>(metode drift)</i></dd></div><div><dt><span class=\"en\">Time series decomposition</span></dt><dd>Memecah runtun waktu menjadi komponen tren-siklus, musiman, dan sisa. <i>(dekomposisi runtun waktu)</i></dd></div><div><dt><span class=\"en\">Additive decomposition</span></dt><dd>y = S + T + R; dipakai bila besar fluktuasi musiman tidak berubah seiring level. <i>(dekomposisi aditif)</i></dd></div><div><dt><span class=\"en\">Multiplicative decomposition</span></dt><dd>y = S × T × R; dipakai bila fluktuasi musiman membesar sebanding level. <i>(dekomposisi multiplikatif)</i></dd></div><div><dt><span class=\"en\">Moving average</span></dt><dd>Rata-rata dari beberapa observasi berurutan yang digeser sepanjang seri untuk menaksir tren-siklus. <i>(rata-rata bergerak)</i></dd></div><div><dt><span class=\"en\">Classical decomposition</span></dt><dd>Dekomposisi dengan moving average untuk tren dan rata-rata per musim untuk komponen musiman yang dianggap tetap. <i>(dekomposisi klasik)</i></dd></div><div><dt><span class=\"en\">STL</span></dt><dd>Seasonal and Trend decomposition using Loess: memecah seri menjadi tren, musiman, dan sisa; versi robust tahan outlier. <i>(dekomposisi STL)</i></dd></div><div><dt><span class=\"en\">Seasonally adjusted data</span></dt><dd>Data setelah komponen musiman dikeluarkan: y − S (aditif) atau y / S (multiplikatif). <i>(data terkoreksi musiman)</i></dd></div><div><dt><span class=\"en\">Holt-Winters method</span></dt><dd>Exponential smoothing dengan komponen level, tren, dan musiman (Pertemuan 5). <i>(metode Holt-Winters)</i></dd></div><div><dt><span class=\"en\">MAPE</span></dt><dd>Mean absolute percentage error: rata-rata galat absolut dalam persen dari nilai aktual (Pertemuan 6). <i>(rata-rata persentase galat absolut)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Cleveland, R. B., Cleveland, W. S., McRae, J. E., &amp; Terpenning, I. (1990). STL: A seasonal-trend decomposition procedure based on loess. <i>Journal of Official Statistics, 6</i>(1), 3–73.</li><li>Seabold, S., &amp; Perktold, J. (2010). Statsmodels: Econometric and statistical modeling with Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i>.</li><li>Garza, A., Canseco, M. M., Challú, C., &amp; Olivares, K. G. (2022). <i>StatsForecast: Lightning fast forecasting with statistical and econometric models</i> [Perangkat lunak]. Nixtla. https://github.com/Nixtla/statsforecast</li><li>Mu'min, S., Nugroho, R. A., Mufliq, A., &amp; Andhyka, A. (2026). Forecasting corn production in Indonesia using Holt–Winters exponential smoothing. <i>Journal of Informatics, Game Engineering, and Networking, 1</i>(1), 55–63.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Exponential Smoothing (ETS)","subtitle":"Simple exponential smoothing, Holt, Holt-Winters, dan kerangka ETS","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Metode Peramalan (Forecasting) · SII017</span></div><h1>Exponential Smoothing (ETS)</h1><p class=\"lead\">Simple exponential smoothing, Holt, Holt-Winters, dan kerangka ETS</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>SES → Holt → Holt-Winters → ETS + praktikum</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengimplementasikan metode dasar, dekomposisi, dan exponential smoothing (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 3; indikator 1 dan 2 di Pertemuan 4)</span></h3><ol><li>Ketepatan menerapkan metode naive, seasonal naive, drift, dan rata-rata. <span class=\"muted\">(Pertemuan 4)</span></li><li>Ketepatan melakukan dekomposisi klasik dan STL. <span class=\"muted\">(Pertemuan 4)</span></li><li>Ketepatan membangun model SES, Holt, dan Holt-Winters (ETS).</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu mengimplementasikan dan mengevaluasi metode peramalan statistik (dekomposisi, exponential smoothing, ARIMA, dan regresi) pada data runtun waktu.</dd><dt>CPL-8</dt><dd class=\"id\">Mampu mengimplementasikan kebutuhan komputasi dan sistem informasi dengan mempertimbangkan berbagai metode, algoritma, serta pendekatan berbasis data.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Praktikum (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 4 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Naïve memberi bobot berapa pada observasi terakhir? Mean?</li><li>Kapan dekomposisi multiplikatif lebih tepat?</li><li>Benchmark mana yang terbaik pada data UMKM 2025?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z\"/><path d=\"m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2\"/></svg>Target hari ini</h3><p>Model ETS layak dipakai bila <b>lebih akurat</b> dari benchmark terbaik di data uji.</p><p class=\"muted\" style=\"font-size:.85em\">Data ilustrasi UMKM: naïve, MAE 2025 ≈ 111,4.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>Bobot untuk masa lalu</span></div><h2>Di antara mean dan naïve</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 190\" style=\"max-height:10.5em\" role=\"img\" aria-label=\"Empat panel bobot observasi masa lalu, lag 0 sampai 9. Mean: semua bobot sama kecil. Naive: seluruh bobot pada observasi terakhir. SES alfa 0,2: bobot 0,2 lalu mengecil perlahan. SES alfa 0,6: bobot 0,6 lalu mengecil cepat.\"><rect x=\"10\" y=\"6\" width=\"208\" height=\"176\" rx=\"6\" class=\"s-box\"/><text x=\"22\" y=\"28\" class=\"s-hd\">MEAN (T = 36)</text><rect x=\"26\" y=\"156.7\" width=\"12\" height=\"3.3\" style=\"fill:var(--primary)\"/><rect x=\"44\" y=\"156.7\" width=\"12\" height=\"3.3\" style=\"fill:var(--primary)\"/><rect x=\"62\" y=\"156.7\" width=\"12\" height=\"3.3\" style=\"fill:var(--primary)\"/><rect x=\"80\" y=\"156.7\" width=\"12\" height=\"3.3\" style=\"fill:var(--primary)\"/><rect x=\"98\" y=\"156.7\" width=\"12\" height=\"3.3\" style=\"fill:var(--primary)\
