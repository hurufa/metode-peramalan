-warn-soft);color:var(--warn)\">Keterbatasan</span><span>Indikator 2</span></div><h2>Kelemahan dekomposisi klasik</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>Ujung kosong</h3><p>Tren dan sisa tidak tersedia untuk beberapa observasi pertama dan terakhir (6 bulan untuk data bulanan).</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0\"/></svg>Terlalu halus</h3><p>Tren cenderung terlalu menghaluskan kenaikan dan penurunan tajam.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Musiman dianggap tetap</h3><p>Pola musiman diasumsikan berulang sama setiap tahun.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Tidak robust</h3><p>Nilai tidak biasa (mis. entri ganda) ikut memengaruhi tren dan musiman.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Empat kelemahan menurut Hyndman &amp; Athanasopoulos (2021, §3.4).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">STL</span><span>Indikator 2 · data ilustrasi</span></div><h2>STL: musiman boleh berubah</h2><div class=\"cols w\"><div><ul><li><b><button type=\"button\" class=\"term\" data-term=\"stl\">STL</button></b>: Seasonal and Trend decomposition using Loess.</li><li>Komponen musiman <b>boleh berubah</b> dari tahun ke tahun; kecepatannya diatur parameter <code>seasonal</code>.</li><li>Kehalusan tren diatur parameter <code>trend</code>; keduanya bilangan ganjil.</li><li>Bisa <b>robust</b> terhadap outlier.</li><li>Hanya aditif; untuk multiplikatif, ambil log dulu.</li></ul><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Cleveland et al., 1990; Hyndman &amp; Athanasopoulos, 2021, §3.6)</span></p></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Komponen musiman</th><th>Mar</th><th>Apr</th></tr></thead><tbody><tr><td>Klasik (semua tahun)</td><td>+295</td><td>+95</td></tr><tr><td>STL 2022</td><td>−57</td><td>+524</td></tr><tr><td>STL 2023</td><td>+130</td><td>+322</td></tr><tr><td>STL 2024</td><td>+317</td><td>+120</td></tr><tr><td>STL 2025</td><td>+503</td><td>−82</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.78em;margin-top:.3em\">STL(period=12, seasonal=13, robust=True), statsmodels.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dekomposisi untuk peramalan</span><span>Indikator 1–2</span></div><h2>Pisahkan, ramal, gabungkan</h2><div class=\"cols w\"><div><p>Data aditif ditulis ulang sebagai:</p><p style=\"font-family:var(--mono);font-size:.85em;text-align:center\">y<sub>t</sub> = Ŝ<sub>t</sub> + Â<sub>t</sub>, &nbsp; Â<sub>t</sub> = T̂<sub>t</sub> + R̂<sub>t</sub></p><ol><li>Ramal <button type=\"button\" class=\"term\" data-term=\"seasonally-adjusted\">data terkoreksi musiman</button> Â<sub>t</sub> dengan metode non-musiman (mis. <b>drift</b> atau naïve).</li><li>Ramal komponen musiman Ŝ<sub>t</sub> dengan <b>seasonal naïve</b>.</li><li>Jumlahkan keduanya.</li></ol><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §5.7)</span></p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3h5v5M8 3H3v5M21 3l-7 7M3 3l7 7M12 22v-8\"/></svg>Mengapa berguna?</h3><ul><li>Menggabungkan kekuatan <b>drift</b> (tren) dan <b>seasonal naïve</b> (musiman).</li><li>Data terkoreksi musiman juga dipakai di laporan resmi, mis. data ketenagakerjaan.</li><li>Holt-Winters (Pertemuan 5) mengerjakan hal serupa sekaligus.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 2</span><span>Python · 20 menit · indikator 2</span></div><h2>Dekomposisi klasik dan STL</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>from statsmodels.tsa.seasonal import seasonal_decompose, STL\n\ns = df.set_index(\"ds\")[\"y\"].asfreq(\"MS\")\n\nklasik = seasonal_decompose(s, model=\"additive\", period=12)\nklasik.plot()\nprint(klasik.seasonal[:12].round(1))   # 12 indeks musiman\n\nstl = STL(s, period=12, seasonal=13, robust=True).fit()\nstl.plot()\nsa = s - stl.seasonal                   # terkoreksi musiman\n\n# multiplikatif: klasik  -&gt; model=\"multiplicative\"\n#               STL     -&gt; STL(np.log(s), ...) lalu exp</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Jalankan dekomposisi klasik; catat 12 indeks musiman.</li><li>Jalankan STL; bandingkan komponen musiman antartahun.</li><li>Lihat sisa: masih ada pola?</li><li>Putuskan aditif atau multiplikatif untuk data kelompok, dengan alasan.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penelitian dosen pengampu</span><span>Mu'min dkk., 2026</span></div><h2>Meramal produksi jagung nasional</h2><div class=\"cols w\"><div class=\"card\" style=\"font-size:.9em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 22 16 8\"/><path d=\"M3.5 12.5 5 11l1.5 1.5a3.5 3.5 0 0 1 0 5L5 19l-1.5-1.5a3.5 3.5 0 0 1 0-5Z\"/><path d=\"M7.5 8.5 9 7l1.5 1.5a3.5 3.5 0 0 1 0 5L9 15l-1.5-1.5a3.5 3.5 0 0 1 0-5Z\"/><path d=\"M11.5 4.5 13 3l1.5 1.5a3.5 3.5 0 0 1 0 5L13 11l-1.5-1.5a3.5 3.5 0 0 1 0-5Z\"/></svg>Ringkasan penelitian</h3><ul style=\"margin:.2em 0 0\"><li><b>Data</b>: produksi jagung bulanan BPS, Jan 2020–Okt 2025 (70 observasi, ton).</li><li><b>Metode</b>: <button type=\"button\" class=\"term\" data-term=\"holt-winters\">Holt-Winters</button> <b>multiplikatif</b>, m = 12; α, β, γ dipilih dengan grid search.</li><li><b>Alasan</b>: fluktuasi musiman membesar sebanding level produksi.</li><li><b>Hasil</b>: <button type=\"button\" class=\"term\" data-term=\"mape\">MAPE</button> 18,64% pada data Jan 2020–Okt 2025; ramalan Nov 2025–Des 2026 berpola musiman stabil.</li><li><b>Keterbatasan</b>: tanpa variabel eksternal (iklim, harga input, kebijakan).</li></ul></div><div><figure class=\"fig\" style=\"margin:0\"><svg viewBox=\"0 0 450 170\" style=\"max-height:9.5em\" role=\"img\" aria-label=\"Grafik ramalan produksi jagung nasional November 2025 sampai Desember 2026 dari Holt-Winters multiplikatif: tertinggi Maret 2026 sekitar 1,62 juta ton, tinggi lagi Agustus sampai Oktober 2026 sekitar 1,5 juta ton, terendah Desember 2025 dan Desember 2026 sekitar 0,9 juta ton.\"><text x=\"60\" y=\"14\" class=\"s-hd\" style=\"font-size:11px\">JUTA TON · RAMALAN</text><line x1=\"60\" y1=\"117.3\" x2=\"440\" y2=\"117.3\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"54\" y=\"121.3\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">1,0</text><line x1=\"60\" y1=\"77.3\" x2=\"440\" y2=\"77.3\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"54\" y=\"81.3\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">1,3</text><line x1=\"60\" y1=\"37.3\" x2=\"440\" y2=\"37.3\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"54\" y=\"41.3\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">1,6</text><path d=\"M60 81 L89.2 131.7 L118.5 102 L147.7 62.8 L176.9 35.3 L206.2 101.3 L235.4 94.2 L264.6 81.2 L293.8 52.5 L323.1 46.8 L352.3 46.4 L381.5 50.5 L410.8 79 L440 130.4\" class=\"s-warnline\" style=\"stroke-width:2.6\"/><circle cx=\"60\" cy=\"81\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"89.2\" cy=\"131.7\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"118.5\" cy=\"102\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"147.7\" cy=\"62.8\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"176.9\" cy=\"35.3\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"206.2\" cy=\"101.3\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"235.4\" cy=\"94.2\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"264.6\" cy=\"81.2\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"293.8\" cy=\"52.5\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"323.1\" cy=\"46.8\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"352.3\" cy=\"46.4\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"381.5\" cy=\"50.5\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"410.8\" cy=\"79\" r=\"3\" style=\"fill:var(--warn)\"/><circle cx=\"440\" cy=\"130.4\" r=\"3\" style=\"fill:var(--warn)\"/><text x=\"60\" y=\"162\" text-anchor=\"start\" class=\"s-s\" style=\"font-size:11px\">Nov 25</text><text x=\"176.9\" y=\"162\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">Mar 26</text><text x=\"293.8\" y=\"162\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11px\">Jul 26</text><text x=\"440\" y=\"162\" text-anchor=\"end\" class=\"s-s\" style=\"font-size:11px\">Des 26</text></svg><figcaption>Ramalan Nov 2025–Des 2026, digambar ulang dari Tabel 3 Mu'min dkk. (2026).</figcaption></figure><p style=\"font-size:.86em;margin-top:.3em\"><b>Diskusi</b>: (1) cara memeriksa pilihan multiplikatif; (2) benchmark pembanding yang cocok.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\"><span class=\"cite\" style=\"white-space:normal\">(Mu'min dkk., 2026)</span></p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 6 menit · kasus ilustrasi</span></div><h2>Benchmark dan dekomposisi apa?</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>A · Puskesmas</h3><p>Kunjungan pasien harian, ramai tiap Senin, level stabil 3 tahun.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>B · Perpustakaan kampus</h3><p>Peminjaman bulanan; ramai saat UTS–UAS, sepi saat libur; tren turun pelan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>C · Toko daring UMKM</h3><p>Pesanan bulanan tumbuh cepat; lonjakan Harbolnas Desember makin besar tiap tahun.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>D · Kurs harian</h3><p>Kurs rupiah per hari kerja, tanpa pola musiman jelas.</p></div></div><div class=\"callout\" style=\"margin-top:.7em\">Untuk tiap kasus: (1) benchmark utama; (2) aditif atau multiplikatif; (3) alasan satu kalimat.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok Tugas 1 · 20 menit · indikator 1–2</span></div><h2>Benchmark dan dekomposisi kasus Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Metode</th><th>Ramalan h = 1</th><th>MAE uji</th><th>Catatan</th></tr></thead><tbody><tr><td>Mean</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Naïve</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Seasonal naïve</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Drift</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah</h3><ol><li>Tentukan data uji (mis. 12 bulan terakhir).</li><li>Isi tabel empat benchmark.</li><li>Jalankan dekomposisi klasik dan STL.</li><li>Putuskan aditif/multiplikatif; tulis buktinya.</li><li>Tunjukkan satu grafik ke kelas.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Benchmark</b> (mean, naïve, seasonal naïve, drift) adalah batas bawah: model lain harus lebih akurat.</li><li>Pemenang benchmark bergantung pola data; tidak satu pun menangkap tren <b>dan</b> musiman sekaligus.</li><li><b>Dekomposisi</b>: y = S + T + R (aditif) atau S × T × R (multiplikatif).</li><li><b>Klasik</b>: 2×12-MA + musiman tetap; ujung kosong dan tidak robust.</li><li><b>STL</b>: musiman boleh berubah dan robust; hanya aditif, log untuk multiplikatif.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Seasonal naïve memakai nilai bulan yang sama tahun lalu, cocok untuk musiman kuat dengan level stabil.\"><p class=\"q\">Data bulanan bermusim kuat dengan level stabil. Benchmark paling masuk akal…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. mean</button><button type=\"button\" data-o=\"b\">B. naïve</button><button type=\"button\" data-o=\"c\">C. seasonal naïve</button><button type=\"button\" data-o=\"d\">D. drift</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"1.256 + 3 × (1.256 − 675)/35 ≈ 1.256 + 49,8 = 1.305,8.\"><p class=\"q\">Drift: y<sub>T</sub> = 1.256, y<sub>1</sub> = 675, T = 36. Ramalan h = 3 kira-kira…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. 1.272,6</button><button type=\"button\" data-o=\"b\">B. 1.305,8</button><button type=\"button\" data-o=\"c\">C. 1.256,0</button><button type=\"button\" data-o=\"d\">D. 953,1</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Musiman klasik diulang sama tiap tahun, sehingga puncak yang bergeser bocor ke sisa.\"><p class=\"q\">Kelemahan dekomposisi klasik yang paling terlihat pada data Lebaran bergeser…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. tren tersedia di semua bulan</button><button type=\"button\" data-o=\"b\">B. komponen musiman dianggap sama tiap tahun</button><button type=\"button\" data-o=\"c\">C. hanya untuk data harian</button><button type=\"button\" data-o=\"d\">D. tidak bisa aditif</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Hyndman &amp; Athanasopoulos (2021) bab 3 (dekomposisi) dan §5.2, §5.7, atau padanannya di versi Python (Hyndman et al., 2025). Persiapan Pertemuan 5: bab 8 tentang exponential smoothing.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P4–5)</h3><ul><li>Notebook: empat benchmark, tabel ramalan dan MAE data uji.</li><li>Dekomposisi klasik dan STL beserta interpretasi.</li><li>Keputusan aditif/multiplikatif dengan bukti.</li><li>Model ETS ditambahkan setelah Pertemuan 5.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bobot bagian P4–5: Tugas 1 10% (Penilaian Praktikum). Tenggat: [PERLU DIISI].</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Benchmark method</span></dt><dd>Metode sangat sederhana yang dipakai sebagai pembanding; model lain layak dipakai hanya bila lebih akurat darinya. <i>(metode pembanding / tolok ukur)</i></dd></div><div><dt><span class=\"en\">Mean method</span></dt><dd>Semua ramalan sama dengan rata-rata data historis. <i>(metode rata-rata)</i></dd></div><div><dt><span class=\"en\">Naïve method</span></dt><dd>Semua ramalan sama dengan observasi terakhir; disebut juga random walk forecast. <i>(metode naif)</i></dd></div><div><dt><span class=\"en\">Seasonal naïve method</span></dt><dd>Ramalan sama dengan nilai terakhir dari musim yang sama, mis. bulan yang sama tahun lalu. <i>(metode naif musiman)</i></dd></div><div><dt><span class=\"en\">Drift method</span></dt><dd>Variasi naive yang membiarkan ramalan naik atau turun sebesar rata-rata perubahan historis. <i>(metode drift)</i></dd></div><div><dt><span class=\"en\">Time series decomposition</span></dt><dd>Memecah runtun waktu menjadi komponen tren-siklus, musiman, dan sisa. <i>(dekomposisi runtun waktu)</i></dd></div><div><dt><span class=\"en\">Additive decomposition</span></dt><dd>y = S + T + R; dipakai bila besar fluktuasi musiman tidak berubah seiring level. <i>(dekomposisi aditif)</i></dd></div><div><dt><span class=\"en\">Multiplicative decomposition</span></dt><dd>y = S × T × R; dipakai bila fluktuasi musiman membesar sebanding level. <i>(dekomposisi multiplikatif)</i></dd></div><div><dt><span class=\"en\">Moving average</span></dt><dd>Rata-rata dari beberapa observasi berurutan yang digeser sepanjang seri untuk menaksir tren-siklus. <i>(rata-rata bergerak)</i></dd></div><div><dt><span class=\"en\">Classical decomposition</span></dt><dd>Dekomposisi dengan moving average untuk tren dan rata-rata per musim untuk komponen musiman yang dianggap tetap. <i>(dekomposisi klasik)</i></dd></div><div><dt><span class=\"en\">STL</span></dt><dd>Seasonal and Trend decomposition using Loess: memecah seri menjadi tren, musiman, dan sisa; versi robust tahan outlier. <i>(dekomposisi STL)</i></dd></div><div><dt><span class=\"en\">Seasonally adjusted data</span></dt><dd>Data setelah komponen musiman dikeluarkan: y − S (aditif) atau y / S (multiplikatif). <i>(data terkoreksi musiman)</i></dd></div><div><dt><span class=\"en\">Holt-Winters method</span></dt><dd>Exponential smoothing dengan komponen level, tren, dan musiman (Pertemuan 5). <i>(metode Holt-Winters)</i></dd></div><div><dt><span class=\"en\">MAPE</span></dt><dd>Mean absolute percentage error: rata-rata galat absolut dalam persen dari nilai aktual (Pertemuan 6). <i>(rata-rata persentase galat absolut)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Cleveland, R. B., Cleveland, W. S., McRae, J. E., &amp; Terpenning, I. (1990). STL: A seasonal-trend decomposition procedure based on loess. <i>Journal of Official Statistics, 6</i>(1), 3–73.</li><li>Seabold, S., &amp; Perktold, J. (2010). Statsmodels: Econometric and statistical modeling with Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i>.</li><li>Garza, A., Canseco, M. M., Challú, C., &amp; Olivares, K. G. (2022). <i>StatsForecast: Lightning fast forecasting with statistical and econometric models</i> [Perangkat lunak]. Nixtla. https://github.com/Nixtla/statsforecast</li><li>Mu'min, S., Nugroho, R. A., Mufliq, A., &amp; Andhyka, A. (2026). Forecasting corn production in Indonesia using Holt–Winters exponential smoothing. <i>Journal of Informatics, Game Engineering, and Networking, 1</i>(1), 55–63.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls": /* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();




</script>
