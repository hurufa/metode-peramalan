 y1=\"108\" x2=\"787.6\" y2=\"131.2\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"797.8\" y1=\"108\" x2=\"797.8\" y2=\"146\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"807.9\" y1=\"108\" x2=\"807.9\" y2=\"152.7\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"818.1\" y1=\"108\" x2=\"818.1\" y2=\"146\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"828.3\" y1=\"108\" x2=\"828.3\" y2=\"130.1\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"838.4\" y1=\"108\" x2=\"838.4\" y2=\"110.6\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"848.6\" y1=\"108\" x2=\"848.6\" y2=\"89.6\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"858.8\" y1=\"108\" x2=\"858.8\" y2=\"71.2\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"868.9\" y1=\"108\" x2=\"868.9\" y2=\"65.7\" style=\"stroke:var(--primary);stroke-width:4.575\"/><text x=\"635.1\" y=\"188\" text-anchor=\"middle\" class=\"s-s\">1</text><text x=\"746.9\" y=\"188\" text-anchor=\"middle\" class=\"s-s\">12</text><text x=\"868.9\" y=\"188\" text-anchor=\"middle\" class=\"s-s\">24</text></svg><figcaption>ACF tiga seri ilustrasi (T = 120; batas ±0,18). Data ilustrasi.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card\"><p><b>A</b> · Penjualan toko daring yang tumbuh terus tanpa musiman.</p></div><div class=\"card\"><p><b>B</b> · Kunjungan wisata bulanan yang selalu ramai di bulan yang sama.</p></div><div class=\"card\"><p><b>C</b> · Residual model yang sudah baik (acak).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih kasus</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 3–4 orang. Peran awal:</p><ul><li>Koordinator dan penghubung mitra</li><li>Pengelola data (pengumpulan, pembersihan)</li><li>Analis/pemodel (notebook)</li><li>Penulis laporan dan visualisasi</li></ul><p class=\"muted\">Peran boleh bergilir; semua anggota harus mampu menjelaskan seluruh notebook.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria kasus yang baik</h3><ul><li>Data runtun waktu <b>nyata</b>: UMKM, perguruan tinggi, dinas/layanan publik, rumah sakit, pesantren/lembaga NU, atau data terbuka (mis. BPS).</li><li>Panjang data cukup: minimal <b>36 bulan</b> untuk data bulanan, atau <b>2 tahun</b> untuk data harian/mingguan.</li><li>Ada keputusan nyata yang didukung ramalan.</li><li>Izin pemakaian jelas; data pribadi dianonimkan <span class=\"cite\">(UU No. 27 Tahun 2022)</span>.</li></ul><p class=\"muted\" style=\"font-size:.8em\">Syarat panjang data: definisi kerja mata kuliah ini.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Proyek peramalan kelompok: tahap awal</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>P2–3 · 10%</h3><p>Notebook eksplorasi dan persiapan data: grafik, ACF/PACF, penanganan data hilang dan outlier, penyesuaian, transformasi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>P4–5 · 10%</h3><p>Model benchmark (mean, naive, seasonal naive, drift), dekomposisi, dan ETS.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>P6–7 · 10%</h3><p>Evaluasi akurasi dan validasi silang, pemilihan model, laporan, presentasi di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai data yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Data runtun waktu berurutan dan berinterval teratur; frekuensi menentukan periode musiman.</li><li>Tiga pola: <b>trend</b>, <b>seasonal</b> (periode tetap), <b>cyclic</b> (tidak tetap, ≥ 2 tahun); sisanya <b>remainder/noise</b>.</li><li>Selalu mulai dengan <b>time plot</b>; <b>seasonal plot</b> memperlihatkan musiman dan efek hari libur bergerak seperti Idulfitri.</li><li><b>ACF</b>: tren → turun perlahan; musiman → puncak di lag musiman. <b>PACF</b>: korelasi setelah lag antara dihilangkan.</li><li><b>White noise</b>: ±95% batang ACF di dalam ±1,96/√T.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Fluktuasi tanpa frekuensi tetap, biasanya ≥ 2 tahun, adalah siklus.\"><p class=\"q\">Harga komoditas naik-turun dengan jarak 3 sampai 7 tahun yang tidak tetap. Pola ini disebut…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. trend</button><button type=\"button\" data-o=\"b\">B. seasonal</button><button type=\"button\" data-o=\"c\">C. cyclic</button><button type=\"button\" data-o=\"d\">D. white noise</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Pada data bertren, observasi berdekatan bernilai mirip sehingga ACF lag kecil besar dan turun perlahan.\"><p class=\"q\">ACF data bulanan bernilai positif besar di lag awal dan turun sangat perlahan. Ini menandakan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. data bertren</button><button type=\"button\" data-o=\"b\">B. data white noise</button><button type=\"button\" data-o=\"c\">C. data hanya musiman</button><button type=\"button\" data-o=\"d\">D. data hilang</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"1,96/√100 = 0,196.\"><p class=\"q\">Seri dengan T = 100. Batas ACF untuk white noise kira-kira…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. ±0,01</button><button type=\"button\" data-o=\"b\">B. ±0,05</button><button type=\"button\" data-o=\"c\">C. ±0,196</button><button type=\"button\" data-o=\"d\">D. ±1,96</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab 2 Hyndman &amp; Athanasopoulos (2021) atau versi Python (Hyndman et al., 2025): grafik runtun waktu, autokorelasi, white noise. Persiapan Pertemuan 3: §3.1 <i>Transformations and adjustments</i>.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan kasus, sumber data, dan izin pemakaian.</li><li>Ubah data ke format <code>unique_id, ds, y</code> dengan frekuensi yang jelas.</li><li>Buat time plot, seasonal plot, lag plot, ACF, dan PACF; tulis interpretasi tiap grafik.</li><li>Catat masalah data: tanggal hilang, nilai aneh, perubahan sistem pencatatan, hari libur.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa notebook dan daftar masalah data ke Pertemuan 3 untuk dibersihkan bersama.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Time series</span></dt><dd>Rangkaian observasi yang dicatat berurutan menurut waktu dengan interval teratur (harian, mingguan, bulanan). <i>(runtun waktu / deret waktu)</i></dd></div><div><dt><span class=\"en\">Frequency</span></dt><dd>Interval pencatatan data runtun waktu: harian, mingguan, bulanan, kuartalan, tahunan. <i>(frekuensi)</i></dd></div><div><dt><span class=\"en\">Trend</span></dt><dd>Kenaikan atau penurunan jangka panjang pada data; tidak harus linear. <i>(tren)</i></dd></div><div><dt><span class=\"en\">Seasonality</span></dt><dd>Pola berulang karena faktor musiman (bulan, hari dalam minggu) dengan periode yang tetap dan diketahui. <i>(musiman)</i></dd></div><div><dt><span class=\"en\">Cycle</span></dt><dd>Naik-turun tanpa periode tetap, biasanya terkait siklus ekonomi dan berlangsung ≥ 2 tahun. <i>(siklus)</i></dd></div><div><dt><span class=\"en\">Remainder</span></dt><dd>Sisa data setelah komponen tren-siklus dan musiman dikeluarkan; sering disebut noise. <i>(sisa / galat acak)</i></dd></div><div><dt><span class=\"en\">Time plot</span></dt><dd>Grafik garis nilai observasi terhadap waktu; langkah pertama eksplorasi. <i>(plot waktu)</i></dd></div><div><dt><span class=\"en\">Seasonal plot</span></dt><dd>Grafik tiap musim (mis. tiap tahun) ditumpuk pada sumbu bulan agar pola musiman mudah dibandingkan. <i>(plot musiman)</i></dd></div><div><dt><span class=\"en\">Lag plot</span></dt><dd>Diagram pencar y(t) terhadap y(t−k) untuk melihat hubungan data dengan nilai sebelumnya. <i>(plot lag)</i></dd></div><div><dt><span class=\"en\">Autocorrelation</span></dt><dd>Korelasi antara data runtun waktu dengan nilai-nilai lag-nya sendiri. <i>(autokorelasi)</i></dd></div><div><dt><span class=\"en\">ACF</span></dt><dd>Autocorrelation function: himpunan koefisien autokorelasi r1, r2, … yang digambar sebagai korelogram. <i>(fungsi autokorelasi)</i></dd></div><div><dt><span class=\"en\">PACF</span></dt><dd>Partial autocorrelation function: korelasi y(t) dan y(t−k) setelah pengaruh lag 1 s.d. k−1 dihilangkan. <i>(fungsi autokorelasi parsial)</i></dd></div><div><dt><span class=\"en\">White noise</span></dt><dd>Runtun waktu tanpa autokorelasi; nilainya acak dan tidak dapat diramal dari masa lalu. <i>(derau putih)</i></dd></div><div><dt><span class=\"en\">Moving holiday</span></dt><dd>Hari libur yang tanggal Masehinya bergeser tiap tahun, mis. Idulfitri (maju ± 11 hari per tahun). <i>(hari libur bergerak)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Montgomery, D. C., Jennings, C. L., &amp; Kulahci, M. (2015). <i>Introduction to time series analysis and forecasting</i> (2nd ed.). John Wiley &amp; Sons.</li><li>McKinney, W. (2010). Data structures for statistical computing in Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i> (hlm. 56–61).</li><li>Seabold, S., &amp; Perktold, J. (2010). Statsmodels: Econometric and statistical modeling with Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i>.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Pembersihan, Penyesuaian & Transformasi Data","subtitle":"Data hilang, outlier, penyesuaian kalender, populasi, dan inflasi, transformasi log dan Box-Cox","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Metode Peramalan (Forecasting) · SII017</span></div><h1>Pembersihan, Penyesuaian &amp; Transformasi Data</h1><p class=\"lead\">Data hilang, outlier, penyesuaian kalender, populasi, dan inflasi, transformasi log dan Box-Cox</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + praktikum + finalisasi kasus kelompok</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis pola data runtun waktu dan menyiapkan data untuk pemodelan (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 3 dan 4)</span></h3><ol><li>Ketepatan mengidentifikasi tren, musiman, siklus, dan noise. <span class=\"muted\">(Pertemuan 2)</span></li><li>Ketepatan membaca plot ACF dan PACF. <span class=\"muted\">(Pertemuan 2)</span></li><li>Ketepatan menangani data hilang, outlier, dan penyesuaian kalender.</li><li>Ketepatan memilih transformasi (log, Box-Cox).</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-3</dt><dd>Mahasiswa mampu mengelola data runtun waktu dan memanfaatkan hasil peramalan untuk mendukung pengambilan keputusan berbasis data.</dd><dt>CPL-7</dt><dd class=\"id\">Mampu mendokumentasikan, mengelola, dan mengamankan data serta memanfaatkannya untuk mendukung pengambilan keputusan berbasis data dan mencegah pelanggaran etika (plagiasi).</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Praktikum (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 2 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Apa beda pola musiman dan siklus?</li><li>Bagaimana bentuk ACF data yang bertren?</li><li>Mengapa puncak penjualan Lebaran bergeser dari April ke Maret?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Kasus dan izin data sudah pasti?</li><li>Data sudah berformat <code>unique_id, ds, y</code>?</li><li>Daftar masalah data dibawa?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>Kasus ilustrasi</span></div><h2>Ekspor mentah dari aplikasi kasir</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Bulan</th><th>Penjualan (kotak)</th></tr></thead><tbody><tr><td>Jul 2023</td><td>960</td></tr><tr><td>Agu 2023</td><td>1.980</td></tr><tr><td>Sep 2023</td><td>958</td></tr><tr><td>Jun 2024</td><td>1.028</td></tr><tr><td>Jul 2024</td><td><span class=\"muted\">(kosong)</span></td></tr><tr><td>Agu 2024</td><td><span class=\"muted\">(kosong)</span></td></tr><tr><td>Sep 2024</td><td>1.125</td></tr></tbody></table></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Diskusikan berpasangan</h3><ol><li>Apa yang aneh pada tabel ini?</li><li>Apa yang mungkin terjadi?</li><li>Apa akibatnya bila langsung dipakai untuk meramal?</li></ol></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi: lanjutan data UMKM kue kering Bu Siti dari Pertemuan 2; angka adalah data ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta hari ini</span><span>Indikator 3–4</span></div><h2>Enam langkah persiapan data</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 200\" style=\"max-height:11em\" role=\"img\" aria-label=\"Alur persiapan data runtun waktu dalam enam langkah: 1 cek frekuensi dan tanggal yang hilang, 2 tangani data hilang, 3 periksa outlier, 4 penyesuaian kalender, populasi, dan inflasi, 5 transformasi log atau Box-Cox bila perlu, 6 catat setiap keputusan di log persiapan data.\"><defs><marker id=\"fl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"8\" y=\"40\" width=\"132\" height=\"104\" rx=\"8\" class=\"s-box\"/><text x=\"74\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 1</text><text x=\"74\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Cek frekuensi</text><text x=\"74\" y=\"118\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">& tanggal hilang</text><line x1=\"141\" y1=\"92\" x2=\"156\" y2=\"92\" class=\"s-line\" marker-end=\"url(#fl)\"/><rect x=\"158\" y=\"40\" width=\"132\" height=\"104\" rx=\"8\" class=\"s-box\"/><text x=\"224\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 2</text><text x=\"224\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Data hilang</text><text x=\"224\" y=\"118\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">isi / tandai</text><line x1=\"291\" y1=\"92\" x2=\"306\" y2=\"92\" class=\"s-line\" marker-end=\"url(#fl)\"/><rect x=\"308\" y=\"40\" width=\"132\" height=\"104\" rx=\"8\" class=\"s-box\"/><text x=\"374\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 3</text><text x=\"374\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Outlier</text><text x=\"374\" y=\"118\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">salah catat atau nyata?</text><line x1=\"441\" y1=\"92\" x2=\"456\" y2=\"92\" class=\"s-line\" marker-end=\"url(#fl)\"/><rect x=\"458\" y=\"40\" width=\"132\" height=\"104\" rx=\"8\" class=\"s-soft\"/><text x=\"524\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 4</text><text x=\"524\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Penyesuaian</text><text x=\"524\" y=\"118\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">kalender, populasi, inflasi</text><line x1=\"591\" y1=\"92\" x2=\"606\" y2=\"92\" class=\"s-line\" marker-end=\"url(#fl)\"/><rect x=\"608\" y=\"40\" width=\"132\" height=\"104\" rx=\"8\" class=\"s-soft\"/><text x=\"674\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 5</text><text x=\"674\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Transformasi</text><text x=\"674\" y=\"118\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">log / Box-Cox</text><line x1=\"741\" y1=\"92\" x2=\"756\" y2=\"92\" class=\"s-line\" marker-end=\"url(#fl)\"/><rect x=\"758\" y=\"40\" width=\"132\" height=\"104\" rx=\"8\" class=\"s-acc\"/><text x=\"824\" y=\"66\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 6</text><text x=\"824\" y=\"94\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Log keputusan</text><text x=\"824\" y=\"118\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:11.5px\">apa, mengapa, bukti</text><path d=\"M74 146 v18 h366 v-18\" class=\"s-dash\"/><text x=\"257\" y=\"186\" text-anchor=\"middle\" class=\"s-s\">indikator 3 · hari ini</text><path d=\"M458 146 v18 h282 v-18\" class=\"s-dash\"/><text x=\"599\" y=\"186\" text-anchor=\"middle\" class=\"s-s\">indikator 3 (kalender) dan 4 (transformasi)</text><text x=\"8\" y=\"24\" class=\"s-hd\">LANGKAH 3 PROSES PERAMALAN · PRELIMINARY (EXPLORATORY) ANALYSIS</text></svg><figcaption>Urutan persiapan data: definisi kerja mata kuliah ini, disusun dari Hyndman &amp; Athanasopoulos (2021, §3.1, §13.9). Urutan boleh berulang bila temuan di langkah akhir mengubah langkah awal.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Data hilang</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"missing-value\">Data hilang</button>: kenali penyebabnya dulu</h2><div class=\"cols w\"><div><ul><li><b>Baris tidak ada</b>: bulan Juli tidak muncul sama sekali di ekspor. Cek dengan menyeragamkan frekuensi.</li><li><b>Kosong ≠ nol</b>: toko buka tetapi tidak ada penjualan = 0; aplikasi mati = kosong.</li><li><b>Hilang karena kejadian</b>: toko tutup saat libur Lebaran; hari berikutnya penjualan melonjak.</li><li><b>Hilang acak</b>: gangguan sistem, lupa input, tidak terkait pola penjualan.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Pertanyaan kunci</h3><p>Apakah <b>ketiadaan data itu sendiri membawa informasi</b>? Bila ya, mengisinya dengan rata-rata dapat membuat model bias.</p><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §13.9)</span></p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Data hilang</span><span>Indikator 3</span></div><h2>Pilihan penanganan data hilang</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Situasi</th><th>Contoh</th><th>Perlakuan</th></tr></thead><tbody><tr><td><b>Hilang acak, sedikit</b></td><td>aplikasi kasir error 2 bulan</td><td>isi dengan <button type=\"button\" class=\"term\" data-term=\"interpolation\">interpolasi</button> atau nilai dari model; tandai di log</td></tr><tr><td><b>Hilang karena kejadian</b></td><td>toko tutup libur Lebaran</td><td>jangan diisi rata-rata; tandai dengan variabel dummy (Pertemuan 11)</td></tr><tr><td><b>Sebenarnya nol</b></td><td>tidak ada pendaftar di luar gelombang</td><td>isi 0</td></tr><tr><td><b>Data awal sangat bolong</b></td><td>tahun pertama hanya 4 bulan tercatat</td><td>pertimbangkan memotong periode awal</td></tr><tr><td><b>Ada sumber lain</b></td><td>buku kas manual Jul–Agu 2024</td><td>isi dari sumber itu (paling baik)</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Disusun dari prinsip Hyndman &amp; Athanasopoulos (2021, §13.9); pengelompokan situasi adalah definisi kerja mata kuliah ini.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Outlier</span><span>Indikator 3 · data ilustrasi</span></div><h2><button type=\"button\" class=\"term\" data-term=\"outlier\">Outlier</button>: salah catat atau kejadian nyata?</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 232\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Time plot ekspor mentah penjualan UMKM Januari 2022 sampai Desember 2025. Agustus 2023 melonjak hampir dua kali lipat karena entri ganda dan dilingkari sebagai calon outlier. Juli dan Agustus 2024 kosong karena aplikasi kasir bermasalah, ditandai pita putus-putus. Puncak Lebaran setiap tahun adalah pola nyata, bukan outlier. Data ilustrasi.\"><line x1=\"66\" y1=\"170.4\" x2=\"872\" y2=\"170.4\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"58\" y=\"174.4\" text-anchor=\"end\" class=\"s-s\">750</text><line x1=\"66\" y1=\"123.2\" x2=\"872\" y2=\"123.2\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"58\" y=\"127.2\" text-anchor=\"end\" class=\"s-s\">1.250</text><line x1=\"66\" y1=\"75.9\" x2=\"872\" y2=\"75.9\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"58\" y=\"79.9\" text-anchor=\"end\" class=\"s-s\">1.750</text><line x1=\"66\" y1=\"28.7\" x2=\"872\" y2=\"28.7\" style=\"stroke:var(--rule);stroke-width:1\"/><text x=\"58\" y=\"32.7\" text-anchor=\"end\" class=\"s-s\">2.250</text><text x=\"66\" y=\"214\" class=\"s-s\">Jan 2022</text><text x=\"271.8\" y=\"214\" class=\"s-s\">Jan 2023</text><text x=\"477.6\" y=\"214\" class=\"s-s\">Jan 2024</text><text x=\"683.4\" y=\"214\" class=\"s-s\">Jan 2025</text><rect x=\"571.9\" y=\"24\" width=\"34.3\" height=\"170\" class=\"s-warn\" style=\"stroke-dasharray:5 4\"/><text x=\"589\" y=\"38\" text-anchor=\"middle\" class=\"s-tw\" style=\"font-size:11.5px\">2 bulan kosong</text><path d=\"M66 177.5 L83.1 179.6 L100.3 178.3 L117.4 122 L134.6 190.5 L151.7 175.5 L168.9 166 L186 171.4 L203.2 173 L220.3 167.8 ><circle cx=\"391.8\" cy=\"54.2\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"409\" cy=\"150.7\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"426.1\" cy=\"151.3\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"443.3\" cy=\"145.8\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"460.4\" cy=\"134\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"477.6\" cy=\"150.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"494.7\" cy=\"143.7\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"511.9\" cy=\"111.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"529\" cy=\"133.8\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"546.2\" cy=\"138.4\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"563.3\" cy=\"144.1\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"614.8\" cy=\"135\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"631.9\" cy=\"134\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"649.1\" cy=\"136.2\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"666.2\" cy=\"122.6\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"683.4\" cy=\"132.7\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"700.5\" cy=\"128.1\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"717.7\" cy=\"72.3\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"734.8\" cy=\"126.2\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"752\" cy=\"122\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"769.1\" cy=\"119\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"786.3\" cy=\"122.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"803.4\" cy=\"114\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"820.6\" cy=\"114.1\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"837.7\" cy=\"120.5\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"854.9\" cy=\"112.9\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"872\" cy=\"99\" r=\"2.6\" style=\"fill:var(--primary)\"/><circle cx=\"391.8\" cy=\"54.2\" r=\"11\" style=\"fill:none;stroke:var(--warn);stroke-width:2.5\"/><text x=\"407.8\" y=\"59.2\" class=\"s-tw\" style=\"font-size:11.5px\">entri ganda?</text><text x=\"70\" y=\"16\" class=\"s-hd\">KOTAK / BULAN · EKSPOR MENTAH</text></svg><figcaption>Ekspor mentah penjualan UMKM kue kering (data ilustrasi): satu entri ganda dan dua bulan kosong ditambahkan ke data Pertemuan 2. Puncak Lebaran tetap pola nyata.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Outlier</span><span>Indikator 3</span></div><h2>Mendeteksi outlier dengan sisa <button type=\"button\" class=\"term\" data-term=\"stl\">STL</button></h2><div class=\"cols w\"><div><ol><li>Dekomposisi seri dengan STL <b>robust</b>: tren + musiman + sisa.</li><li>Hitung kuartil sisa: Q1, Q3, dan <button type=\"button\" class=\"term\" data-term=\"iqr\">IQR</button> = Q3 − Q1.</li><li>Tandai sisa di bawah <b>Q1 − 3·IQR</b> atau di atas <b>Q3 + 3·IQR</b>.</li><li>Untuk setiap tanda: <b>tanyakan penyebabnya</b>, lalu putuskan.</li></ol><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §13.9)</span>; STL dari Cleveland et al. (1990).</p></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Penyebab</th><th>Keputusan</th></tr></thead><tbody><tr><td>salah ketik, entri ganda</td><td>koreksi dari sumber; bila tidak bisa, anggap hilang lalu isi</td></tr><tr><td>kejadian nyata, tidak berulang</td><td>pertahankan + dummy, atau keluarkan dari data latih</td></tr><tr><td>kejadian yang akan berulang</td><td>pertahankan; masukkan ke model (mis. hari libur)</td></tr></tbody></table></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penyesuaian &amp; transformasi</span><span>Indikator 3–4</span></div><h2>Empat cara agar pola lebih sederhana</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/></svg><button type=\"button\" class=\"term\" data-term=\"calendar-adjustment\">Calendar adjustments</button></h3><p>Hilangkan variasi karena jumlah hari atau hari kerja yang berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg><button type=\"button\" class=\"term\" data-term=\"population-adjustment\">Population adjustments</button></h3><p>Ubah menjadi per orang atau per 100.000 penduduk.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg><button type=\"button\" class=\"term\" data-term=\"inflation-adjustment\">Inflation adjustments</button></h3><p>Ubah nilai rupiah nominal menjadi nilai riil.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 7V4H6l6 8-6 8h12v-3\"/></svg>Mathematical transformations</h3><p>Log, akar, atau Box-Cox untuk menstabilkan variasi.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Tujuannya: pola menjadi <b>lebih sederhana</b>, sehingga model lebih mudah dan ramalan lebih akurat <span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §3.1)</span>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penyesuaian kalender</span><span>Indikator 3 · data ilustrasi</span></div><h2>Per hari, bukan per bulan</h2><div class=\"cols w\"><div><div class=\"tw\"><table class=\"t\" style=\"font-size:.9em\"><thead><tr><th>Bulan</th><th>Total</th><th>Hari buka</th><th>Per hari</th></tr></thead><tbody><tr><td>Januari 2025</td><td>1.240</td><td>31</td><td>40,0</td></tr><tr><td>Februari 2025</td><td>1.120</td><td>28</td><td>40,0</td></tr></tbody></table></div><p style=\"margin-top:.5em\">Penjualan Februari \"turun\" hanya karena bulannya lebih pendek. Rata-rata per <button type=\"button\" class=\"term\" data-term=\"trading-day\">hari operasional</button> menghilangkan efek ini <span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §3.1)</span>.</p></div><div><p style=\"margin:0 0 .3em\"><b>Efek Lebaran</b> (<button type=\"button\" class=\"term\" data-term=\"moving-holiday\">moving holiday</button>): hari H−14 s.d. H−1 per bulan</p><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Tahun</th><th>Idulfitri</th><th>Mar</th><th>Apr</th><th>Mei</th></tr></thead><tbody><tr><td>2022</td><td>2 Mei</td><td>0</td><td>13</td><td>1</td></tr><tr><td>2023</td><td>22 Apr</td><td>0</td><td>14</td><td>0</td></tr><tr><td>2024</td><td>10 Apr</td><td>5</td><td>9</td><td>0</td></tr><tr><td>2025</td><td>31 Mar</td><td>14</td><td>0</td><td>0</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Fitur kalender ini adalah definisi kerja mata kuliah ini; dipakai sebagai variabel di Pertemuan 11.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Populasi &amp; inflasi</span><span>Data ilustrasi</span></div><h2>Bandingkan yang sebanding</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Per 100.000 penduduk</h3><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Wilayah</th><th>Kasus</th><th>Penduduk</th><th>Per 100.000</th></tr></thead><tbody><tr><td>Kabupaten A</td><td>420</td><td>2.100.000</td><td>20,0</td></tr><tr><td>Kota B</td><td>300</td><td>600.000</td><td><b>50,0</b></td></tr></tbody></table></div><p style=\"font-size:.9em;margin-top:.4em\">Kasus lebih banyak di A, tetapi risiko lebih tinggi di B.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>Rupiah riil</h3><p style=\"font-size:.9em\">Omzet 2019: Rp40 juta (IHK 90). Omzet 2025: Rp52 juta (IHK 108).</p><p style=\"font-family:var(--mono);font-size:.8em\">riil 2025 = 52 × 90 / 108 = 43,3 juta</p><p style=\"font-size:.9em\">Naik ±8% secara riil, bukan 30%.</p><p class=\"muted\" style=\"font-size:.8em\"><button type=\"button\" class=\"term\" data-term=\"price-index\">IHK</button> bulanan diterbitkan BPS.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Konsep mengikuti Hyndman &amp; Athanasopoulos (2021, §3.1); semua angka adalah data ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Transformasi</span><span>Indikator 4</span></div><h2><button type=\"button\" class=\"term\" data-term=\"log-transformation\">Log</button> dan <button type=\"button\" class=\"term\" data-term=\"box-cox\">Box-Cox</button></h2><div class=\"cols w\"><div><p>Transformasi Box-Cox dengan parameter λ <span class=\"cite\">(Box &amp; Cox, 1964)</span>:</p><div class=\"card\" style=\"font-family:var(--mono);font-size:.78em;line-height:1.7\">w<sub>t</sub> = log(y<sub>t</sub>) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;bila λ = 0<br>w<sub>t</sub> = (sign(y<sub>t</sub>)|y<sub>t</sub>|<sup>λ</sup> − 1) / λ &nbsp;bila λ ≠ 0</div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Rumus versi Hyndman &amp; Athanasopoulos (2021, §3.1), yang juga berlaku untuk nilai negatif.</p></div><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>λ</th><th>Artinya</th></tr></thead><tbody><tr><td>1</td><td>bentuk tidak berubah (hanya bergeser turun 1)</td></tr><tr><td>½</td><td>akar kuadrat (ditambah transformasi linear)</td></tr><tr><td>0</td><td>log natural</td></tr><tr><td>−1</td><td>kebalikan (1/y) ditambah 1</td></tr></tbody></table><div class=\"callout\" style=\"margin-top:.6em\">λ yang baik membuat <b>besar variasi musiman hampir sama</b> di sepanjang seri.</div></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Transformasi</span><span>Indikator 4 · data ilustrasi</span></div><h2>Kapan transformasi diperlukan?</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 212\" style=\"max-height:11.5em\" role=\"img\" aria-label=\"Dua panel data ilustrasi bulanan 8 tahun. Kiri skala asli: tren naik dan gelombang musiman yang makin besar seiring naiknya level. Kanan setelah transformasi log: gelombang musiman berukuran hampir sama di sepanjang seri dan tren menjadi lurus.\"><rect x=\"8\" y=\"8\" width=\"430\" height=\"196\" rx=\"8\" class=\"s-box\"/><text x=\"24\" y=\"32\" class=\"s-hd\">SKALA ASLI</text><text x=\"24\" y=\"50\" class=\"s-s\">gelombang musiman makin besar</text><path d=\"M24 188.9 L28.2 186.9 L32.4 185 L36.6 183.9 L40.8 185.4 L44.9 185.6 L49.1 187.9 L53.3 188.1 L57.5 190 L61.7 190 L65.9 189.4 L70.1 188.8 L74.3 184.8 L78.5 183.1 L82.7 180 L86.8 178 L91 178 L95.2 180.3 L99.4 183.6 L103.6 184.5 L107.8 186.2 L112 186.1 L116.2 185 L120.4 184 L124.5 180.7 L128.7 174.9 L132.9 172.9 L137.1 171.2 L141.3 168.9 L145 .3 112 L775.5 106.2 L779.6 95.1 L783.8 86.4 L788 77.6 L792.2 79.1 L796.4 80.4 L800.6 79.7 L804.8 88.1 L809 91.7 L813.2 94.2 L817.3 94.8 L821.5 95.3 L825.7 90.3 L829.9 79.5 L834.1 69.6 L838.3 64.9 L842.5 62 L846.7 63.3 L850.9 66.3 L855.1 75.7 L859.2 75.8 L863.4 78.9 L867.6 83.1 L871.8 76.5 L876 73.3\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2\"/></svg><figcaption>Transformasi log menstabilkan variasi yang tumbuh sebanding level; konsep dari Hyndman &amp; Athanasopoulos (2021, §3.1). Data ilustrasi.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card\"><p><b>Perlu</b>: gelombang musiman makin besar seiring level (pola multiplikatif).</p></div><div class=\"card\"><p><b>Tidak perlu</b>: gelombang musiman relatif sama besar (pola aditif).</p></div><div class=\"card hl\"><p><b>Ingat</b>: ramalan harus di-<button type=\"button\" class=\"term\" data-term=\"back-transformation\">back-transform</button> ke skala asli.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum</span><span>Python · 30 menit</span></div><h2>Membersihkan dan menyesuaikan data</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import numpy as np, pandas as pd\nfrom statsmodels.tsa.seasonal import STL\nfrom scipy.stats import boxcox\n\ns = df.set_index(\"ds\")[\"y\"].asfreq(\"MS\")  # baris hilang -&gt; NaN\nprint(s.isna().sum())\ns_isi = s.interpolate(method=\"time\")      # isi celah pendek\n\nres = STL(s_isi, period=12, seasonal=13, robust=True).fit()\nr = res.resid; q1, q3 = r.quantile([.25, .75]); iqr = q3 - q1\nprint(r[(r &lt; q1 - 3*iqr) | (r &gt; q3 + 3*iqr)])  # calon outlier\n\nper_hari = s_isi / s_isi.index.days_in_month   # kalender\ny_log = np.log(s_isi)                           # log\ny_bc, lam = boxcox(s_isi)                       # Box-Cox</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Pakai data ilustrasi mentah (ada entri ganda dan bulan kosong).</li><li>Temukan bulan kosong dan calon outlier.</li><li>Putuskan perlakuan; tulis di <b>log persiapan data</b>.</li><li>Buat versi per hari dan versi log; bandingkan grafiknya.</li><li>Ulangi pada data kelompok.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 8 menit · kasus ilustrasi</span></div><h2>Perlakuan apa yang tepat?</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>A · Dinas kesehatan</h3><p>Ramalan kasus DBD bulanan untuk 18 kecamatan dengan jumlah penduduk sangat berbeda.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>B · Koperasi pesantren</h3><p>Omzet toko koperasi dalam rupiah, 2015–2025, untuk rencana anggaran.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5V8z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>C · Toko oleh-oleh</h3><p>Penjualan harian; toko tutup 5 hari setiap libur Lebaran, tercatat kosong.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>D · Aplikasi layanan desa</h3><p>Jumlah pengguna bulanan tumbuh pesat; lonjakan tiap awal tahun makin besar.</p></div></div><div class=\"callout\" style=\"margin-top:.7em\">Untuk tiap kasus: pilih penyesuaian atau transformasi utama, dan jelaskan alasannya dalam satu kalimat.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok Tugas 1 · 20 menit</span></div><h2>Log persiapan data kasus Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Masalah</th><th>Bukti</th><th>Tindakan</th><th>Alasan</th></tr></thead><tbody><tr><td>2 bulan kosong</td><td><code>isna()</code> = 2</td><td>isi dari buku kas</td><td>sumber asli tersedia</td></tr><tr><td>…</td><td>…</td><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah</h3><ol><li>Tetapkan <b>kasus final</b> hari ini.</li><li>Isi log untuk setiap masalah data.</li><li>Putuskan penyesuaian dan transformasi.</li><li>Tunjukkan satu grafik sebelum dan sesudah.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Data hilang</b>: kenali penyebabnya; kosong ≠ nol; hilang karena kejadian jangan diisi rata-rata.</li><li><b>Outlier</b>: cari pada sisa STL robust (batas 3·IQR); koreksi bila salah catat, pertahankan bila kejadian nyata.</li><li><b>Penyesuaian</b>: kalender (per hari, efek Lebaran), populasi (per 100.000), inflasi (rupiah riil).</li><li><b>Transformasi</b>: log atau Box-Cox bila variasi membesar seiring level; jangan lupa transformasi balik.</li><li>Setiap keputusan dicatat di <b>log persiapan data</b>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Outlier bisa kesalahan atau kejadian nyata; penyebabnya harus dicek sebelum diputuskan.\"><p class=\"q\">Penjualan Agustus melonjak dua kali lipat dan tidak berulang tiap tahun. Langkah pertama…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. langsung hapus</button><button type=\"button\" data-o=\"b\">B. cek penyebab ke pemilik data</button><button type=\"button\" data-o=\"c\">C. ganti dengan rata-rata</button><button type=\"button\" data-o=\"d\">D. biarkan saja</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Kasus per 100.000 penduduk membuat wilayah sebanding.\"><p class=\"q\">Kasus DBD dua kecamatan yang penduduknya sangat berbeda dibandingkan dengan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. penyesuaian kalender</button><button type=\"button\" data-o=\"b\">B. penyesuaian populasi</button><button type=\"button\" data-o=\"c\">C. transformasi log</button><button type=\"button\" data-o=\"d\">D. interpolasi</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"λ = 0 adalah log natural (Hyndman &amp; Athanasopoulos, 2021, §3.1).\"><p class=\"q\">Pada transformasi Box-Cox, nilai λ = 0 berarti…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. tidak ada transformasi</button><button type=\"button\" data-o=\"b\">B. akar kuadrat</button><button type=\"button\" data-o=\"c\">C. log natural</button><button type=\"button\" data-o=\"d\">D. kebalikan 1/y</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Hyndman &amp; Athanasopoulos (2021) §3.1 dan §13.9, atau padanannya di versi Python (Hyndman et al., 2025). Persiapan Pertemuan 4: bab 3 tentang dekomposisi dan §5.2 tentang metode peramalan sederhana.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1 · bagian P2–3)</h3><ul><li>Notebook eksplorasi: lima grafik beserta interpretasi.</li><li>Persiapan data: data hilang, outlier, penyesuaian, transformasi.</li><li>Log persiapan data (masalah, bukti, tindakan, alasan).</li><li>Data bersih siap pakai dalam format <code>unique_id, ds, y</code>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Notebook harus bisa dijalankan ulang dari awal. Bawa data bersih ke Pertemuan 4: kita mulai membangun model benchmark.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Missing value</span></dt><dd>Periode yang seharusnya tercatat tetapi nilainya kosong (NaN), berbeda dengan nilai nol. <i>(data hilang / nilai kosong)</i></dd></div><div><dt><span class=\"en\">Interpolation</span></dt><dd>Mengisi nilai kosong dengan perkiraan dari nilai di sekitarnya, mis. garis lurus antara dua titik. <i>(interpolasi)</i></dd></div><div><dt><span class=\"en\">Outlier</span></dt><dd>Observasi yang sangat berbeda dari sebagian besar data; bisa kesalahan pencatatan atau kejadian nyata. <i>(pencilan)</i></dd></div><div><dt><span class=\"en\">IQR</span></dt><dd>Interquartile range: selisih kuartil ketiga (Q3) dan kuartil pertama (Q1). <i>(jangkauan antarkuartil)</i></dd></div><div><dt><span class=\"en\">STL</span></dt><dd>Seasonal and Trend decomposition using Loess: memecah seri menjadi tren, musiman, dan sisa; versi robust tahan outlier. <i>(dekomposisi STL)</i></dd></div><div><dt><span class=\"en\">Calendar adjustment</span></dt><dd>Menghilangkan variasi yang muncul hanya karena perbedaan kalender, mis. jumlah hari atau hari kerja per bulan. <i>(penyesuaian kalender)</i></dd></div><div><dt><span class=\"en\">Trading day</span></dt><dd>Hari ketika usaha atau layanan benar-benar beroperasi, mis. hari buka toko atau hari kerja kantor. <i>(hari operasional / hari kerja)</i></dd></div><div><dt><span class=\"en\">Moving holiday</span></dt><dd>Hari libur yang tanggal Masehinya bergeser tiap tahun, mis. Idulfitri (maju ± 11 hari per tahun). <i>(hari libur bergerak)</i></dd></div><div><dt><span class=\"en\">Population adjustment</span></dt><dd>Mengubah data menjadi per orang, per seribu, atau per 100.000 penduduk agar wilayah atau tahun dapat dibandingkan. <i>(penyesuaian populasi)</i></dd></div><div><dt><span class=\"en\">Inflation adjustment</span></dt><dd>Mengubah nilai uang nominal menjadi nilai riil pada harga tahun dasar memakai indeks harga. <i>(penyesuaian inflasi)</i></dd></div><div><dt><span class=\"en\">Price index (CPI)</span></dt><dd>Indeks harga konsumen; di Indonesia diterbitkan BPS sebagai IHK. <i>(indeks harga konsumen (IHK))</i></dd></div><div><dt><span class=\"en\">Log transformation</span></dt><dd>Mengganti y dengan log(y); perubahan pada skala log setara perubahan persentase pada skala asli. <i>(transformasi logaritma)</i></dd></div><div><dt><span class=\"en\">Box-Cox transformation</span></dt><dd>Keluarga transformasi pangkat dengan parameter λ; λ = 0 berarti log natural. <i>(transformasi Box-Cox)</i></dd></div><div><dt><span class=\"en\">Back-transformation</span></dt><dd>Mengembalikan ramalan dari skala transformasi ke skala asli data. <i>(transformasi balik)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\" style=\"font-size:.74em;gap:.3em\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Montgomery, D. C., Jennings, C. L., &amp; Kulahci, M. (2015). <i>Introduction to time series analysis and forecasting</i> (2nd ed.). John Wiley &amp; Sons.</li><li>Box, G. E. P., &amp; Cox, D. R. (1964). An analysis of transformations. <i>Journal of the Royal Statistical Society: Series B (Methodological), 26</i>(2), 211–252.</li><li>Guerrero, V. M. (1993). Time-series analysis supported by power transformations. <i>Journal of Forecasting, 12</i>(1), 37–48.</li><li>Cleveland, R. B., Cleveland, W. S., McRae, J. E., &amp; Terpenning, I. (1990). STL: A seasonal-trend decomposition procedure based on loess. <i>Journal of Official Statistics, 6</i>(1), 3–73.</li><li>Seabold, S., &amp; Perktold, J. (2010). Statsmodels: Econometric and statistical modeling with Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i>.</li><li>Virtanen, P., Gommers, R., Oliphant, T. E., Haberland, M., Reddy, T., Cournapeau, D., et al. (2020). SciPy 1.0: Fundamental algorithms for scientific computing in Python. <i>Nature Methods, 17</i>(3), 261–272.</li><li>Undang-Undang Republik Indonesia Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 4.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":4,"title":"Metode Dasar & Dekomposisi","subtitle":"Mean, naive, seasonal naive, drift sebagai benchmark; dekomposisi klasik dan STL","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Metode Peramalan (Forecasting) · SII017</span></div><h1>Metode Dasar &amp; Dekomposisi</h1><p class=\"lead\">Mean, naive, seasonal naive, drift sebagai benchmark; dekomposisi klasik dan STL</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Benchmark + dekomposisi + praktikum Python</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu mengimplementasikan metode dasar, dekomposisi, dan exponential smoothing (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 di Pertemuan 5)</span></h3><ol><li>Ketepatan menerapkan metode naive, seasonal naive, drift, dan rata-rata.</li><li>Ketepatan melakukan dekomposisi klasik dan STL.</li><li>Ketepatan membangun model SES, Holt, dan Holt-Winters (ETS). <span class=\"muted\">(Pertemuan 5)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu mengimplementasikan dan mengevaluasi metode peramalan statistik (dekomposisi, exponential smoothing, ARIMA, dan regresi) pada data runtun waktu.</dd><dt>CPL-8</dt><dd class=\"id\">Mampu mengimplementasikan kebutuhan komputasi dan sistem informasi dengan mempertimbangkan berbagai metode, algoritma, serta pendekatan berbasis data.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Praktikum (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 3 · cek kelompok</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Mengapa puncak Lebaran <b>bukan</b> outlier?</li><li>Kapan transformasi log diperlukan?</li><li>Apa isi log persiapan data?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><ul><li>Data bersih tanpa bulan kosong?</li><li>Frekuensi jelas (<code>MS</code>, <code>W</code>, <code>D</code>)?</li><li>Keputusan transformasi sudah dicatat?</li></ul><p class=\"muted\" style=\"font-size:.88em\">Angkat tangan untuk tiap butir.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemantik</span><span>5 menit · berpasangan · data ilustrasi</span></div><h2>Tebakan paling sederhana untuk 2025</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Bulan</th><th>Penjualan (kotak)</th></tr></thead><tbody><tr><td>Jan 2022</td><td>675</td></tr><tr><td>Mar 2022</td><td>666</td></tr><tr><td>Apr 2022</td><td>1.262</td></tr><tr><td>Jan 2024</td><td>961</td></tr><tr><td>Mar 2024</td><td>1.374</td></tr><tr><td>Apr 2024</td><td>1.137</td></tr><tr><td>Okt 2024</td><td>1.135</td></tr><tr><td>Nov 2024</td><td>1.112</td></tr><tr><td>Des 2024</td><td>1.256</td></tr></tbody></table></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Diskusikan berpasangan</h3><p>Bu Siti hanya punya data Jan 2022–Des 2024. Tanpa model rumit, berapa tebakan Anda untuk:</p><ol><li>Januari 2025?</li><li>Maret 2025?</li><li>Desember 2025?</li></ol><p class=\"muted\" style=\"font-size:.85em\">Tulis juga <b>cara</b> Anda menebak.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Mengapa butuh metode benchmark?</h2><div class=\"cols wr\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Some forecasting methods are extremely simple and surprisingly effective.\"</p><p class=\"tr\">\"Beberapa metode peramalan sangat sederhana dan efektif secara mengejutkan.\"</p><div class=\"src\">Hyndman &amp; Athanasopoulos (2021, §5.2); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0Z\"/><path d=\"m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2\"/></svg>Peran <button type=\"button\" class=\"term\" data-term=\"benchmark\">benchmark</button></h3><ul><li>Menjadi <b>batas bawah</b>: model baru harus lebih akurat darinya.</li><li>Mudah dijelaskan kepada pengambil keputusan.</li><li>Kadang justru menjadi metode terbaik.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Di buku, empat metode ini dipakai sebagai benchmark sepanjang buku <span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §5.2)</span>.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Empat benchmark</span><span>Indikator 1</span></div><h2>Mean, naïve, seasonal naïve, drift</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Metode</th><th>Rumus ramalan ŷ<sub>T+h|T</sub></th><th>Gagasan</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"mean-method\">Mean</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">ȳ = (y<sub>1</sub> + … + y<sub>T</sub>) / T</td><td>semua ramalan = rata-rata historis</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"naive-method\">Naïve</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">y<sub>T</sub></td><td>semua ramalan = observasi terakhir</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"seasonal-naive\">Seasonal naïve</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">y<sub>T+h−m(k+1)</sub></td><td>= nilai terakhir dari musim yang sama</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"drift-method\">Drift</button></b></td><td style=\"font-family:var(--mono);font-size:.82em\">y<sub>T</sub> + h · (y<sub>T</sub> − y<sub>1</sub>) / (T − 1)</td><td>garis dari observasi pertama ke terakhir, diteruskan</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">T: banyak observasi · h: horizon · m: periode musiman (12 untuk bulanan) · k: bagian bulat (h − 1)/m. Rumus sesuai Hyndman &amp; Athanasopoulos (2021, §5.2).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hasil benchmark</span><span>Indikator 1 · data ilustrasi</span></div><h2>Empat benchmark pada data UMKM</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 340\" style=\"max-height:15.5em\" role=\"img\" aria-label=\"Empat panel ramalan benchmark penjualan UMKM tahun 2025 dari data latih Januari 2022 sampai Desember 2024. Mean: garis datar sekitar 953, jauh di bawah data aktual. Naive: garis datar 1.256. Seasonal naive: mengulang pola 2024 termasuk puncak Maret. Drift: garis naik dari 1.256. Garis putus-putus adalah data aktual 2025. Data ilustrasi.\"><rect x=\"10\" y=\"8\" width=\"436\" height=\"152\" rx=\"6\" class=\"s-box\"/><text x=\"24\" y=\"30\" class=\"s-hd\">MEAN</text><text x=\"432\" y=\"30\" text-anchor=\"end\" class=\"s-s\">MAE 2025 ≈ 381</text><line x1=\"331.1\" y1=\"42\" x2=\"331.1\" y2=\"154\" class=\"s-dash\"/><path d=\"M26 140 L34.6 141.8 L43.2 140.7 L51.8 93 L60.4 151 L69 138.3 L77.6 130.3 L86.2 134.9 L94.8 136.2 L103.4 131.8 L112 126.6 L120.6 121 L129.1 126.2 L137.7 129.4 L146.3 115.1 L154.9 94.9 L163.5 132.5 L172.1 122.4 L180.7 117.2 L189.3 114.8 L197.9 117.4 L206.5 117.8 L215.1 113.2 L223.7 103.2 L232.3 117.1 L240.9 111.4 L249.5 84.1 L258.1 103 L266.7 106.9 L275.3 111.8 L283.9 109 L292.5 100.2 L301.1 104 L309.7 103.2 L318.3 105 L326.9 93.5\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2\"/><path d=\"M326.9 93.5 L335.4 102.1 L344 98.2 L352.6 50.9 L361.2 96.6 L369.8 93 L378.4 90.5 L387 93.4 L395.6 86.2 L404.2 86.3 L412.8 91.8 L421.4 85.3 L430 73.5\" class=\"s-dash\" style=\"stroke-width:2\"/><path d=\"M326. primary);stroke-width:2\"/><text x=\"64\" y=\"337\" class=\"s-s\">data latih 2022–2024</text><line x1=\"230\" y1=\"333\" x2=\"258\" y2=\"333\" class=\"s-dash\" style=\"stroke-width:2\"/><text x=\"264\" y=\"337\" class=\"s-s\">aktual 2025</text><line x1=\"380\" y1=\"333\" x2=\"408\" y2=\"333\" class=\"s-warnline\" style=\"stroke-width:2.6\"/><text x=\"414\" y=\"337\" class=\"s-s\">ramalan</text></svg><figcaption>Empat metode benchmark (Hyndman &amp; Athanasopoulos, 2021, §5.2) pada data ilustrasi UMKM. MAE dihitung dari 12 bulan 2025; metrik ini dibahas di Pertemuan 6.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Memilih benchmark</span><span>Indikator 1</span></div><h2>Kapan memakai yang mana?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Metode</th><th>Cocok untuk</th><th>Kelemahan</th></tr></thead><tbody><tr><td><b>Mean</b></td><td>data tanpa tren dan musiman, berfluktuasi di sekitar rata-rata</td><td>tertinggal bila level berubah</td></tr><tr><td><b>Naïve</b></td><td>data mirip random walk, mis. harga harian</td><td>tidak mengenal musiman</td></tr><tr><td><b>Seasonal naïve</b></td><td>data bermusim kuat dengan level stabil</td><td>tidak mengenal tren; puncak bergeser ikut terbawa</td></tr><tr><td><b>Drift</b></td><td>data bertren tanpa musiman kuat</td><td>bergantung titik pertama dan terakhir</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.6em\">Di Tugas 1, jalankan <b>keempatnya</b>; pilihan akhir dibuktikan dengan akurasi di data uji (Pertemuan 6), bukan dengan tebakan.</div><p class=\"muted\" style=\"font-size:.82em;margin-top:.4em\">Disusun dosen dari uraian Hyndman &amp; Athanasopoulos (2021, §5.2).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum 1</span><span>Python · 25 menit · indikator 1</span></div><h2>Benchmark dengan statsforecast</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>from statsforecast import StatsForecast\nfrom statsforecast.models import (HistoricAverage, Naive,\n    SeasonalNaive, RandomWalkWithDrift)\n\nlatih = df[df.ds &lt; \"2025-01-01\"]          # Jan 2022–Des 2024\nuji   = df[df.ds &gt;= \"2025-01-01\"]         # 12 bulan 2025\n\nsf = StatsForecast(models=[HistoricAverage(), Naive(),\n        SeasonalNaive(season_length=12), RandomWalkWithDrift()],\n        freq=\"MS\")\nfc = sf.forecast(df=latih, h=12, level=[80])\n\nhasil = uji.merge(fc, on=[\"unique_id\", \"ds\"])\nfor m in [\"HistoricAverage\", \"Naive\", \"SeasonalNaive\", \"RWD\"]:\n    print(m, (hasil.y - hasil[m]).abs().mean().round(1))</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Pakai data ilustrasi UMKM bersih (CSV <code>unique_id, ds, y</code>).</li><li>Pisahkan 12 bulan terakhir sebagai data uji.</li><li>Jalankan empat benchmark; plot ramalan dan data uji.</li><li>Catat MAE tiap metode di tabel.</li><li>Ulangi pada data kelompok.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dekomposisi</span><span>Indikator 2 · data ilustrasi</span></div><h2>Tiga komponen, dua cara menggabung</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 192\" style=\"max-height:10.5em\" role=\"img\" aria-label=\"Dua panel data ilustrasi bulanan 6 tahun. Kiri aditif: tren naik dengan gelombang musiman berukuran tetap. Kanan multiplikatif: tren naik dengan gelombang musiman yang makin besar seiring naiknya level.\"><rect x=\"8\" y=\"8\" width=\"430\" height=\"176\" rx=\"6\" class=\"s-box\"/><text x=\"24\" y=\"32\" class=\"s-hd\">ADITIF</t  L702.2 100.4 L707.8 105.2 L713.4 122.2 L719 133.3 L724.6 139.7 L730.3 147.4 L735.9 138.9 L741.5 126.5 L747.1 115.2 L752.7 96.5 L758.3 86.2 L763.9 84.1 L769.5 80.7 L775.1 88.4 L780.7 109.7 L786.3 119.3 L791.9 129.4 L797.5 138.1 L803.1 131.5 L808.7 118.6 L814.3 98.7 L819.9 81 L825.5 75.8 L831.2 62 L836.8 69.1 L842.4 79 L848 94.9 L853.6 111 L859.2 124.7 L864.8 121.4 L870.4 118.6 L876 106.5\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2\"/></svg><figcaption>Dekomposisi aditif dan multiplikatif (Hyndman &amp; Athanasopoulos, 2021, §3.2). Data ilustrasi.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.3em\"><div class=\"card\"><p><b>S<sub>t</sub></b> musiman · <b>T<sub>t</sub></b> tren-siklus · <b>R<sub>t</sub></b> sisa.</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"additive-decomposition\">Aditif</button></b>: besar fluktuasi musiman tidak berubah seiring level.</p></div><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"multiplicative-decomposition\">Multiplikatif</button></b>: fluktuasi membesar sebanding level; setara aditif pada log y.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dekomposisi klasik</span><span>Indikator 2</span></div><h2>Empat langkah dekomposisi klasik</h2><div class=\"cols w\"><div><ol><li><b>Tren</b>: hitung <button type=\"button\" class=\"term\" data-term=\"moving-average\">moving average</button> 2×m-MA (m genap) atau m-MA (m ganjil).</li><li><b>Detrend</b>: y<sub>t</sub> − T̂<sub>t</sub> (aditif) atau y<sub>t</sub> / T̂<sub>t</sub> (multiplikatif).</li><li><b>Musiman</b>: rata-rata nilai detrend tiap bulan; sesuaikan agar berjumlah 0 (aditif) atau m (multiplikatif); ulangi tiap tahun.</li><li><b>Sisa</b>: R̂<sub>t</sub> = y<sub>t</sub> − T̂<sub>t</sub> − Ŝ<sub>t</sub> (aditif) atau y<sub>t</sub> / (T̂<sub>t</sub>Ŝ<sub>t</sub>).</li></ol><p class=\"muted\" style=\"font-size:.82em\"><span class=\"cite\" style=\"white-space:normal\">(Hyndman &amp; Athanasopoulos, 2021, §3.3–3.4)</span></p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 7V4H6l6 8-6 8h12v-3\"/></svg>2×12-MA untuk data bulanan</h3><p style=\"font-family:var(--mono);font-size:.74em;line-height:1.6\">T̂<sub>t</sub> = ½·y<sub>t−6</sub>/12 + (y<sub>t−5</sub> + … + y<sub>t+5</sub>)/12 + ½·y<sub>t+6</sub>/12</p><p style=\"font-size:.9em\">Rata-rata 12 bulan yang \"terpusat\": 13 bulan, bulan ujung berbobot setengah. Musiman bulanan hilang, tersisa tren.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Hasil dekomposisi</span><span>Indikator 2 · data ilustrasi</span></div><h2>Dekomposisi klasik data UMKM</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 298\" style=\"max-height:14.5em\" role=\"img\" aria-label=\"Dekomposisi klasik aditif penjualan UMKM. Panel atas: data dan tren dari moving average 2 kali 12 yang naik halus, tanpa nilai di 6 bulan pertama dan terakhir. Panel tengah: komponen musiman yang sama persis setiap tahun dengan puncak Maret. Panel bawah: sisa; batang besar di Maret dan April 2023 serta Maret dan April 2025 karena puncak Lebaran bergeser. Data ilustrasi.\"><text x=\"62\" y=\"22\" text-anchor=\"end\" class=\"s-hd\">DATA</text><text x=\"62\" y=\"38\" text-anchor=\"end\" class=\"s-s\">+ tren</text><path d=\"M70 91.3 L87.2 92.9 L104.5 92 L121.7 50.7 L138.9 100.9 L156.2 89.9 L173.4 83 L190.6 86.9 L207.9 88.1 L225.1 84.3 L242.3 79.7 L259.6 74.9 L276.8 79.4 L294 82.2 L311.3 69.8 L328.5 52.3 L345.7 84.8 L363 76.1 L380.2 71.6 L397.4 69.5 L414.7 71.8 L431.9 72.2 L449.1 68.2 L466.4 59.5 L483.6 71.5 L500.9 66.6 L518.1 43 L535.3 59.4 L552.6 62.7 L569.8 66.9 L587 64.6 L604.3 56.9 L621.5 60.2 L638.7 59.5 L656 61.1 L673.2 51.1 L690.4 58.5 L707.7 55.1 L724.9 14.2 L742.1 53.8 L759.4 50.7 L776.6 48.5 L793.8 51.1 L811.1 44
