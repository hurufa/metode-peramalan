<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#ECF0EF; --ink:#2C2E31; --ink-2:#45474B; --muted:#646A6F;
  --line:#D9DFDD; --primary:#495E57; --primary-ink:#FFFFFF; --primary-soft:#E3EBE8;
  --accent:#F4CE14; --accent-soft:#FCF3C4; --accent-ink:#2C2E31;
  --green:#0F7A45; --warn:#C2410C; --warn-soft:#FDE9DD; --ok:#2E7D4F; --ok-soft:#E1F2E7; --bad:#B42318; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(35,45,40,.06),0 8px 24px rgba(35,45,40,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
    --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
    --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
    --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
  --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
  --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
  --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.app.collapsed{grid-template-columns:0 1fr}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s ease}
.app.collapsed .side{transform:translateX(-100%);visibility:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.brand span{font-size:12px;color:var(--muted)}
.side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 18px 6px;font-weight:700}
.mlist{list-style:none;margin:0;padding:0 10px 18px;display:grid;gap:2px}
.mbtn{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-current="true"]{background:var(--primary-soft)}
.mbtn .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary);background:var(--surface-2);border-radius:7px;text-align:center;padding:3px 0}
.mbtn[aria-current="true"] .no{background:var(--primary);color:var(--primary-ink)}
.mbtn .t{font-size:13.5px;line-height:1.3;color:var(--ink)}
.mbtn.soon .t{color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.tag.soon{background:var(--surface-2);color:var(--muted)}
.tag.exam{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:160px;font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ibtn:hover{border-color:var(--primary)}
.ibtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ibtn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.seg svg{width:16px;height:16px}

/* Slide mode */
.view{padding:20px 16px 40px;width:100%;max-width:1320px;margin:0 auto}
.stage{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stage .slide{position:absolute;inset:0;overflow:auto;font-size:clamp(9px,1.55cqw,30px)}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctrl .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.hint{font-size:12px;color:var(--muted)}
.notes{margin-top:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:12px 16px;color:var(--ink)}
.notes h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.notes p,.notes li{margin:.25em 0;font-size:14.5px}
.notes ul{margin:.2em 0;padding-left:1.2em}
:fullscreen .stage, .stage:fullscreen{border-radius:0;border:0}
.stage:fullscreen{background:var(--surface)}

/* Read mode */
.read{max-width:880px;margin:0 auto;display:grid;gap:18px}
.read .slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:16.5px}
.read .notes{margin-top:-8px}

/* Slide content */
.slide{padding:2.6em 3.4em;color:var(--ink-2)}
.slide h1,.slide h2{color:var(--ink);line-height:1.15;text-wrap:balance;margin:0 0 .55em;letter-spacing:-.01em}
.slide h2{font-size:2em;font-weight:800}
.slide h1{font-size:2.9em;font-weight:800}
.slide h3{color:var(--ink);font-size:1.15em;margin:0 0 .35em}
.slide p{margin:.35em 0}
.slide ul,.slide ol{margin:.3em 0;padding-left:1.25em}
.slide li{margin:.32em 0}
.slide li::marker{color:var(--primary);font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.78em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:.6em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.eyebrow .chip{background:var(--primary-soft);padding:.15em .6em;border-radius:99px}
.lead{font-size:1.2em;color:var(--ink)}
.muted{color:var(--muted)}
.id{color:var(--muted);font-style:italic}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;align-items:start}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.w{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface-2);border-radius:.8em;padding:.9em 1.1em}
.card h3{display:flex;gap:.45em;align-items:center}
.card p{font-size:.95em}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.warn h3{color:var(--warn)}
.card.ok{background:var(--ok-soft)}
.ic{width:1.3em;height:1.3em;flex:none;color:var(--primary)}
.warn .ic{color:var(--warn)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.big{font-size:1.5em;font-weight:800;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;align-items:baseline}
.kv dt{font-family:var(--mono);font-size:.8em;font-weight:600;color:var(--primary);white-space:nowrap}
.kv dd{margin:0}
.callout{border-left:.3em solid var(--accent);background:var(--accent-soft);padding:.7em 1em;border-radius:0 .6em .6em 0;color:var(--ink)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.quote{font-size:1.25em;font-weight:600;color:var(--ink);line-height:1.4}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.45em .6em;text-align:left;vertical-align:top}
table.t th{color:var(--ink);font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.phrase{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.1em .45em;border-radius:.35em;color:var(--ink)}

/* Title slide */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.3em;background:
  radial-gradient(60em 30em at 110% -10%,var(--primary-soft),transparent 60%),
  linear-gradient(transparent 0 0)}
.cover .logo{width:5.2em;margin-bottom:1em}
.cover .meta{margin-top:1.6em;display:flex;gap:2.2em;flex-wrap:wrap;font-size:.9em}
.cover .meta b{display:block;color:var(--ink)}
.cover .strip{position:absolute;left:0;right:0;bottom:0;height:.55em;background:linear-gradient(90deg,var(--primary) 0 60%,var(--accent) 60% 100%)}
.read .cover{min-height:26em;position:relative}

/* Figures */
figure.fig{margin:.6em 0 0}
figure.fig svg{width:100%;height:auto;max-height:17em;display:block;color:var(--ink)}
figure.fig figcaption{font-size:.82em;color:var(--muted);margin-top:.4em}
.s-box{fill:var(--surface);stroke:var(--primary);stroke-width:2}
.s-soft{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-hl{fill:var(--accent);stroke:none}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.s-line{stroke:currentColor;stroke-width:2;fill:none}
.s-dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;fill:none}
.s-warnline{stroke:var(--warn);stroke-width:2.2;fill:none}
.s-t{fill:currentColor;font-family:var(--font);font-size:15px;font-weight:700}
.s-s{fill:var(--muted);font-family:var(--font);font-size:12.5px;font-weight:500}
.s-tw{fill:var(--warn);font-family:var(--font);font-size:13px;font-weight:700}
.s-ta{fill:var(--accent-ink);font-family:var(--font);font-size:15px;font-weight:800}
.s-hd{fill:var(--primary);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em}

/* Assessment bar */
.assess{display:flex;height:3.4em;border-radius:.6em;overflow:hidden;margin:.6em 0 .4em;font-size:.9em}
.assess div{display:flex;flex-direction:column;justify-content:center;padding:0 .8em;color:var(--primary-ink);min-width:0}
.assess div b{font-size:1.15em}
.assess .a1{background:var(--primary)}
.assess .a2{background:var(--accent);color:var(--accent-ink)}
.assess .a3{background:color-mix(in srgb,var(--primary) 70%,var(--ink))}
.assess .a4{background:var(--warn);color:#fff}
.weeks{display:grid;grid-template-columns:repeat(16,1fr);gap:.25em;margin-top:.8em}
.weeks span{font-family:var(--mono);font-size:.7em;text-align:center;padding:.35em 0;border-radius:.35em;background:var(--surface-2);color:var(--muted)}
.weeks span.ex{background:var(--warn-soft);color:var(--warn);font-weight:700}
.weeks span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* Chat mockup */
.chat{background:var(--surface-2);border-radius:.8em;padding:.8em;display:grid;gap:.45em;font-size:.92em}
.chat .who{font-size:.75em;color:var(--muted);font-weight:700}
.bub{max-width:88%;padding:.45em .7em;border-radius:.8em;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.bub.me{justify-self:end;background:var(--primary-soft)}
.bub small{display:block;color:var(--muted);font-size:.72em;text-align:right}

/* Glossary term + tooltip */
.term{border-bottom:2px dotted var(--primary);cursor:help;color:inherit;font-weight:600;background:none;padding:0;border-top:0;border-left:0;border-right:0;font-size:inherit;line-height:inherit;font-family:inherit}
.tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none}
.tip b{display:block;font-size:14px}
.tip i{display:block;color:var(--accent);font-style:normal;font-weight:700;font-size:12.5px;margin-top:4px}
.gl dt{font-weight:700;color:var(--ink)}
.gl dd{margin:0 0 .5em}
.gl dd i{color:var(--primary);font-style:normal;font-weight:600}
.gl{columns:2;column-gap:2em;font-size:.92em}
.gl div{break-inside:avoid}

/* Quiz */
.quiz{display:grid;gap:.5em;margin-bottom:.9em}
.quiz .q{font-weight:700;color:var(--ink);margin:0}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.quiz button{border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.45em .7em;text-align:left;cursor:pointer;font-size:.92em}
.quiz button:hover{border-color:var(--primary)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.quiz .fb{font-size:.88em;margin:0;min-height:1.3em;color:var(--ink)}

/* Placeholder */
.soonbox{display:flex;flex-direction:column;justify-content:center;height:100%}
.soonbox .pill{align-self:flex-start;margin-bottom:1em}

/* Closing */
.closing{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(50em 26em at 50% 120%,var(--accent-soft),transparent 70%)}
.read .closing{min-height:24em}
.closing h1{font-size:3.6em;margin-bottom:.2em}
.closing .qwrap{max-width:34em;min-height:6.5em;position:relative;z-index:2}
.closing .qt{font-size:1.3em;font-weight:600;color:var(--ink);line-height:1.4;transition:opacity .5s}
.closing .qa{margin-top:.5em;color:var(--muted);font-size:.9em;transition:opacity .5s}
.closing .emo{position:absolute;inset:0;pointer-events:none;z-index:1}
.closing .emo span{position:absolute;bottom:-2em;font-size:1.8em;opacity:.8;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14em) translateX(1em) rotate(12deg)}100%{transform:translateY(-30em) translateX(-1em) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.closing .emo span{animation:none;display:none}.side{transition:none}.bar i{transition:none}}

/* Menu button for phone */
.menu-t{display:none}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-100%);box-shadow:var(--shadow);visibility:hidden}
  .app.open .side{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .top .lbl{display:none}
  .slide{padding:1.8em 2em}
  .read .slide{padding:1.4em 1.2em}
  .cols,.cols.w,.cols.c3{grid-template-columns:1fr}
  .grid5,.grid4{grid-template-columns:1fr 1fr}
  .quiz .opts{grid-template-columns:1fr}
  .gl{columns:1}
}
@media print{.side,.top,.ctrl{display:none}}



/* ===== Revisi v2 ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.cite{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.en{font-style:italic}
.notes dl.nt{margin:.2em 0 0;display:grid;gap:.15em}
.notes dl.nt dt{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-top:.55em}
.notes dl.nt dt:first-child{margin-top:.1em}
.notes dl.nt dd{margin:0;font-size:14.5px;line-height:1.55}
.notes dl.nt dd ul,.notes dl.nt dd ol{margin:.2em 0;padding-left:1.2em}
ol.refs{list-style:none;padding:0;margin:.4em 0 0;display:grid;gap:.55em}
ol.refs li{padding-left:2.2em;text-indent:-2.2em;margin:0;line-height:1.45}
.closing .emo span{opacity:.4}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
.grid3>*,.grid4>*,.grid5>*,.cols>*{min-width:0}
.card{overflow-wrap:break-word}
@media (max-width:600px){.grid3,.grid5,.grid4{grid-template-columns:1fr!important}.read .slide{font-size:15.5px}}
.card.obek{font-size:.84em}
.stage .gl{columns:3;column-gap:1.6em;font-size:.8em}
.stage .gl dd{margin-bottom:.35em}
.stage .quiz{gap:.28em;margin-bottom:.45em}
.stage .quiz button{padding:.32em .6em}
.stage .quiz .fb{min-height:1.1em}
.read{grid-template-columns:minmax(0,1fr)}.view{min-width:0}
.notes .nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.notes .nhead h4{margin:0}
.lockb{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.lockb svg{width:13px;height:13px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal form{width:min(380px,100%);background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.modal h2 svg{width:18px;height:18px;color:var(--primary)}
.modal p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.modal input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.modal input:focus{outline:3px solid var(--accent);outline-offset:1px}
.modal .err{color:var(--bad);font-size:13px;min-height:1.3em;margin:6px 0 10px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .row button.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ===== Revisi v3.1 (MPSI): URL panjang di referensi, slide padat ===== */
ol.refs li{overflow-wrap:anywhere}
.stage ol.refs{font-size:.9em;gap:.4em}
.stage .gl{font-size:.74em}


/* ===== Revisi v3.3 (KMO): judul berkata panjang di HP, kuis lebih rapat ===== */
@media (max-width:600px){.read .soonbox h1,.read .cover h1,.read .closing h1{font-size:2.1em;overflow-wrap:break-word;hyphens:auto}}
.stage .quiz{gap:.2em;margin-bottom:.35em}
.stage .quiz .opts{gap:.25em}

const GLOSSARY={"forecasting":{"t":"Forecasting","d":"Memprediksi nilai di masa depan seakurat mungkin memakai semua informasi yang tersedia, termasuk data historis.","id":"peramalan"},"time-series":{"t":"Time series","d":"Rangkaian observasi yang dicatat berurutan menurut waktu dengan interval teratur (harian, mingguan, bulanan).","id":"runtun waktu / deret waktu"},"forecast-horizon":{"t":"Forecast horizon","d":"Seberapa jauh ke depan ramalan dibuat, mis. 1 minggu, 6 bulan, atau 3 tahun.","id":"horizon peramalan"},"frequency":{"t":"Frequency","d":"Interval pencatatan data runtun waktu: harian, mingguan, bulanan, kuartalan, tahunan.","id":"frekuensi"},"aggregation":{"t":"Aggregation","d":"Tingkat penggabungan data yang diramal, mis. per produk vs total kategori, per cabang vs nasional.","id":"agregasi"},"qualitative-forecasting":{"t":"Qualitative forecasting","d":"Peramalan berbasis penilaian ahli (judgmental), dipakai bila data historis tidak ada atau tidak relevan.","id":"peramalan kualitatif"},"delphi-method":{"t":"Delphi method","d":"Teknik peramalan kualitatif: panel ahli menjawab anonim dalam beberapa putaran dengan umpan balik hingga pendapat mengerucut.","id":"metode Delphi"},"quantitative-forecasting":{"t":"Quantitative forecasting","d":"Peramalan dengan model matematis/statistik dari data numerik masa lalu.","id":"peramalan kuantitatif"},"time-series-model":{"t":"Time series model","d":"Model yang meramal hanya dari nilai masa lalu variabel itu sendiri (dan galatnya).","id":"model runtun waktu"},"explanatory-model":{"t":"Explanatory model","d":"Model yang meramal dari variabel penjelas (prediktor), mis. suhu, harga, hari libur.","id":"model penjelas / kausal"},"point-forecast":{"t":"Point forecast","d":"Satu angka ramalan, biasanya rata-rata dari distribusi ramalan.","id":"ramalan titik"},"prediction-interval":{"t":"Prediction interval","d":"Rentang yang diperkirakan memuat nilai aktual dengan peluang tertentu, mis. 80% atau 95%.","id":"interval prediksi"},"long-format":{"t":"Long format","d":"Tabel satu baris per (seri, waktu). Pustaka Nixtla memakai kolom unique_id, ds, y.","id":"format panjang"},"trend":{"t":"Trend","d":"Kenaikan atau penurunan jangka panjang pada data; tidak harus linear.","id":"tren"},"seasonality":{"t":"Seasonality","d":"Pola berulang karena faktor musiman (bulan, hari dalam minggu) dengan periode yang tetap dan diketahui.","id":"musiman"},"cycle":{"t":"Cycle","d":"Naik-turun tanpa periode tetap, biasanya terkait siklus ekonomi dan berlangsung ≥ 2 tahun.","id":"siklus"},"remainder":{"t":"Remainder","d":"Sisa data setelah komponen tren-siklus dan musiman dikeluarkan; sering disebut noise.","id":"sisa / galat acak"},"time-plot":{"t":"Time plot","d":"Grafik garis nilai observasi terhadap waktu; langkah pertama eksplorasi.","id":"plot waktu"},"seasonal-plot":{"t":"Seasonal plot","d":"Grafik tiap musim (mis. tiap tahun) ditumpuk pada sumbu bulan agar pola musiman mudah dibandingkan.","id":"plot musiman"},"lag-plot":{"t":"Lag plot","d":"Diagram pencar y(t) terhadap y(t−k) untuk melihat hubungan data dengan nilai sebelumnya.","id":"plot lag"},"autocorrelation":{"t":"Autocorrelation","d":"Korelasi antara data runtun waktu dengan nilai-nilai lag-nya sendiri.","id":"autokorelasi"},"acf":{"t":"ACF","d":"Autocorrelation function: himpunan koefisien autokorelasi r1, r2, … yang digambar sebagai korelogram.","id":"fungsi autokorelasi"},"pacf":{"t":"PACF","d":"Partial autocorrelation function: korelasi y(t) dan y(t−k) setelah pengaruh lag 1 s.d. k−1 dihilangkan.","id":"fungsi autokorelasi parsial"},"white-noise":{"t":"White noise","d":"Runtun waktu tanpa autokorelasi; nilainya acak dan tidak dapat diramal dari masa lalu.","id":"derau putih"},"moving-holiday":{"t":"Moving holiday","d":"Hari libur yang tanggal Masehinya bergeser tiap tahun, mis. Idulfitri (maju ± 11 hari per tahun).","id":"hari libur bergerak"}};
const QUOTES=[{"q":"Forecasting is about predicting the future as accurately as possible, given all of the information available, including historical data and knowledge of any future events that might impact the forecasts.","a":"Rob J. Hyndman & George Athanasopoulos","s":"Forecasting: Principles and Practice, 3rd ed., 2021, §1.2"},{"q":"Good forecasts capture the genuine patterns and relationships which exist in the historical data, but do not replicate past events that will not occur again.","a":"Rob J. Hyndman & George Athanasopoulos","s":"Forecasting: Principles and Practice, 3rd ed., 2021, §1.1"},{"q":"All models are wrong but some are useful.","a":"George E. P. Box","s":"\"Robustness in the strategy of scientific model building\", in Robustness in Statistics, Academic Press, 1979"},{"q":"You will plant for seven years consecutively; and what you harvest leave in its spikes, except a little from which you will eat.","a":"Al-Qur'an","s":"QS Yusuf 12:47 (tr. Sahih International)"},{"q":"And no soul perceives what it will earn tomorrow, and no soul perceives in what land it will die.","a":"Al-Qur'an","s":"QS Luqman 31:34 (tr. Sahih International)"}];
const MEETINGS=[{"no":1,"title":"Konsep, Jenis & Proses Peramalan","subtitle":"Peran peramalan dalam organisasi, jenis peramalan, horizon dan agregasi, proses peramalan, ekosistem Python","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Metode Peramalan (Forecasting) · SII017</span></div><h1>Konsep, Jenis &amp; Proses Peramalan</h1><p class=\"lead\">Peran peramalan dalam organisasi, jenis peramalan, horizon dan agregasi, proses peramalan, ekosistem Python</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>7 · 3 SKS · prasyarat Statistika dan Probabilitas; Analitik dan Visualisasi Data</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep, jenis, dan proses peramalan (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan membedakan peramalan kualitatif dan kuantitatif.</li><li>Ketepatan menjelaskan horizon, frekuensi, dan tingkat agregasi peramalan.</li><li>Ketepatan menjelaskan tahapan proses peramalan.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu mengimplementasikan dan mengevaluasi metode peramalan statistik (dekomposisi, exponential smoothing, ARIMA, dan regresi) pada data runtun waktu.</dd><dt>CPL-8</dt><dd class=\"id\">Mampu mengimplementasikan kebutuhan komputasi dan sistem informasi dengan mempertimbangkan berbagai metode, algoritma, serta pendekatan berbasis data.</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 3 SKS · Project Based Learning · Python</span></div><h2>Satu semester, satu kasus peramalan</h2><p>Setiap kelompok meramal <b>satu data nyata</b> di Indonesia: penjualan UMKM, pendaftar perguruan tinggi, kasus penyakit, atau permintaan layanan publik.</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>Tugas 1 · Statistik dasar</h3><p>Eksplorasi dan persiapan data, model benchmark dan ETS, evaluasi akurasi. Dipresentasikan di Pertemuan 7.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>Tugas 2 · Model lanjut &amp; keputusan</h3><p>ARIMA/SARIMA dan machine learning pada data yang sama, perbandingan kinerja, rekomendasi keputusan, presentasi di Pertemuan 15.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Tugas dikumpulkan sesuai tenggat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja tim</h3><p>Setiap anggota punya peran; kontribusi tercatat di notebook atau repositori.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"/></svg>Menjaga data</h3><p>Data mitra dipakai hanya untuk tugas, dianonimkan, dan tidak disebarkan.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur &amp; reprodusibel</h3><p>Kode karya sendiri; bantuan AI dan kode dari luar disebutkan. Notebook harus bisa dijalankan ulang.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Galat saat menjalankan kode? Tanyakan lebih awal, jangan menunggu tenggat.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>5 menit · berpasangan · kasus ilustrasi</span></div><h2>Berapa kotak kue harus dibuat untuk Lebaran?</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\" style=\"font-size:1.05em\">Bu Siti memiliki UMKM kue kering di Sidoarjo. Tahun lalu ia kehabisan stok seminggu sebelum Lebaran, tetapi dua tahun lalu 200 kotak tidak laku. Bahan baku harus dipesan 6 minggu sebelumnya.</span></div><p style=\"margin-top:.8em\">Diskusikan dengan pasangan:</p><ol><li>Angka apa yang perlu diperkirakan, dan kapan harus sudah diketahui?</li><li>Informasi apa yang bisa membantu Bu Siti?</li><li>Apa akibatnya bila perkiraan terlalu tinggi, dan bila terlalu rendah?</li></ol></div><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>Catatan penjualan</h3><p>buku kas 3 tahun terakhir</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M16 2v4M8 2v4M3 10h18\"/></svg>Kalender</h3><p>tanggal Idulfitri bergeser tiap tahun</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Pesanan reseller</h3><p>pesanan awal via WhatsApp</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5V8z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>Kapasitas</h3><p>oven, tenaga kerja, modal</p></div></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Definisi</span></div><h2>Apa itu peramalan?</h2><div class=\"callout\"><span class=\"quote\" style=\"font-size:1em\"><button type=\"button\" class=\"term\" data-term=\"forecasting\">Peramalan</button> adalah memprediksi masa depan seakurat mungkin dengan memakai semua informasi yang tersedia, termasuk data historis dan pengetahuan tentang kejadian di masa depan yang dapat memengaruhi ramalan.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\">(Hyndman &amp; Athanasopoulos, 2021, §1.2, terjemahan bebas)</div></div><div class=\"grid3\" style=\"margin-top:.8em\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>Forecasting</h3><p>Apa yang <b>kemungkinan</b> terjadi? <br><i>\"Permintaan Lebaran diperkirakan 1.500–1.800 kotak.\"</i></p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Goals</h3><p>Apa yang <b>kita inginkan</b> terjadi? <br><i>\"Target penjualan 2.000 kotak.\"</i></p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Planning</h3><p>Apa yang <b>kita lakukan</b> agar ramalan mendekati tujuan? <br><i>\"Tambah reseller, pesan bahan untuk 1.800 kotak.\"</i></p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Pembedaan forecasting, goals, dan planning mengikuti Hyndman &amp; Athanasopoulos (2021, §1.2); contoh kalimat adalah ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Keterprediksian</span></div><h2>Apa yang bisa diramal?</h2><p style=\"margin:.2em 0 .5em\">Empat faktor keterprediksian <span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §1.1)</span>:</p><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>1. Pemahaman faktor</h3><p>Seberapa baik kita memahami faktor-faktor penyebabnya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/><path d=\"M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5\"/><path d=\"M3 12c0 1.66 4 3 9 3s9-1.34 9-3\"/></svg>2. Ketersediaan data</h3><p>Seberapa banyak data yang tersedia.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>3. Kemiripan masa depan</h3><p>Seberapa mirip masa depan dengan masa lalu.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>4. Efek ramalan</h3><p>Apakah ramalan itu sendiri dapat memengaruhi hal yang diramal.</p></div></div><div class=\"tw\" style=\"margin-top:.7em\"><table class=\"t\"><thead><tr><th></th><th>Permintaan listrik → mudah diramal</th><th>Kurs rupiah besok → sulit diramal</th></tr></thead><tbody><tr><td><b>Faktor 1–3</b></td><td>terpenuhi (faktor dipahami, data banyak, pola stabil)</td><td>hanya data yang banyak</td></tr><tr><td><b>Faktor 4</b></td><td>ramalan tidak mengubah permintaan</td><td>ramalan memengaruhi pasar</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Horizon</span><span>Indikator 2</span></div><h2>Peran peramalan dalam organisasi: <button type=\"button\" class=\"term\" data-term=\"forecast-horizon\">horizon</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 210\" style=\"max-height:11.5em\" role=\"img\" aria-label=\"Tiga horizon peramalan. Jangka pendek: penjadwalan staf, produksi, dan transportasi, contoh stok harian UMKM dan jadwal petugas layanan. Jangka menengah: kebutuhan sumber daya, pembelian bahan baku, rekrutmen, contoh kuota dosen dan kelas semester depan. Jangka panjang: perencanaan strategis, contoh membuka prodi baru atau pabrik baru.\"><defs><marker id=\"hz\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"20\" y1=\"30\" x2=\"880\" y2=\"30\" class=\"s-line\" marker-end=\"url(#hz)\"/><text x=\"20\" y=\"20\" class=\"s-hd\">SEKARANG</text><text x=\"880\" y=\"20\" text-anchor=\"end\" class=\"s-hd\">MASA DEPAN</text><rect x=\"20\" y=\"48\" width=\"272\" height=\"150\" rx=\"14\" class=\"s-acc\"/><text x=\"156\" y=\"76\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Jangka pendek</text><text x=\"156\" y=\"97\" text-anchor=\"middle\" class=\"s-hd\">hari – minggu – bulan</text><text x=\"156\" y=\"126\" text-anchor=\"middle\" class=\"s-s\">jadwal staf, produksi,</text><text x=\"156\" y=\"144\" text-anchor=\"middle\" class=\"s-s\">transportasi</text><text x=\"156\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">contoh: stok harian UMKM, petugas loket</text><rect x=\"312\" y=\"48\" width=\"272\" height=\"150\" rx=\"14\" class=\"s-soft\"/><text x=\"448\" y=\"76\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Jangka menengah</text><text x=\"448\" y=\"97\" text-anchor=\"middle\" class=\"s-hd\">bulan – 1–2 tahun</text><text x=\"448\" y=\"126\" text-anchor=\"middle\" class=\"s-s\">bahan baku, rekrutmen,</text><text x=\"448\" y=\"144\" text-anchor=\"middle\" class=\"s-s\">pembelian mesin</text><text x=\"448\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">contoh: kelas & dosen semester depan</text><rect x=\"604\" y=\"48\" width=\"272\" height=\"150\" rx=\"14\" class=\"s-box\"/><text x=\"740\" y=\"76\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Jangka panjang</text><text x=\"740\" y=\"97\" text-anchor=\"middle\" class=\"s-hd\">beberapa tahun</text><text x=\"740\" y=\"126\" text-anchor=\"middle\" class=\"s-s\">perencanaan strategis:</text><text x=\"740\" y=\"144\" text-anchor=\"middle\" class=\"s-s\">pasar, lingkungan, sumber daya</text><text x=\"740\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">contoh: prodi baru, pabrik baru</text></svg><figcaption>Kebutuhan peramalan menurut horizon, diadaptasi dari Hyndman &amp; Athanasopoulos (2021, §1.2). Contoh Indonesia adalah ilustrasi dosen.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Menentukan apa yang diramal</span><span>Indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"aggregation\">Agregasi</button>, <button type=\"button\" class=\"term\" data-term=\"frequency\">frekuensi</button>, dan horizon</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 200\" style=\"max-height:11em\" role=\"img\" aria-label=\"Hierarki agregasi penjualan jaringan toko: total nasional di puncak, lalu wilayah Jawa Timur dan Jawa Tengah, lalu toko Sidoarjo, Surabaya, Semarang, Solo, lalu produk. Semakin ke bawah, data semakin rinci dan semakin berisik; semakin ke atas, semakin halus dan mudah diramal.\"><rect x=\"370\" y=\"10\" width=\"160\" height=\"38\" rx=\"10\" class=\"s-acc\"/><text x=\"450\" y=\"35\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Total nasional</text><line x1=\"450\" y1=\"48\" x2=\"260\" y2=\"72\" class=\"s-line\"/><rect x=\"180\" y=\"72\" width=\"160\" height=\"36\" rx=\"10\" class=\"s-soft\"/><text x=\"260\" y=\"96\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Jawa Timur</text><line x1=\"450\" y1=\"48\" x2=\"640\" y2=\"72\" class=\"s-line\"/><rect x=\"560\" y=\"72\" width=\"160\" height=\"36\" rx=\"10\" class=\"s-soft\"/><text x=\"640\" y=\"96\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Jawa Tengah</text><line x1=\"260\" y1=\"108\" x2=\"160\" y2=\"130\" class=\"s-line\"/><rect x=\"90\" y=\"130\" width=\"140\" height=\"32\" rx=\"9\" class=\"s-box\"/><text x=\"160\" y=\"151\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Sidoarjo</text><line x1=\"260\" y1=\"108\" x2=\"340\" y2=\"130\" class=\"s-line\"/><rect x=\"270\" y=\"130\" width=\"140\" height=\"32\" rx=\"9\" class=\"s-box\"/><text x=\"340\" y=\"151\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Surabaya</text><line x1=\"640\" y1=\"108\" x2=\"540\" y2=\"130\" class=\"s-line\"/><rect x=\"470\" y=\"130\" width=\"140\" height=\"32\" rx=\"9\" class=\"s-box\"/><text x=\"540\" y=\"151\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Semarang</text><line x1=\"640\" y1=\"108\" x2=\"720\" y2=\"130\" class=\"s-line\"/><rect x=\"650\" y=\"130\" width=\"140\" height=\"32\" rx=\"9\" class=\"s-box\"/><text x=\"720\" y=\"151\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Solo</text><text x=\"450\" y=\"188\" text-anchor=\"middle\" class=\"s-s\">di bawah setiap toko: ratusan produk (SKU) — paling rinci, paling berisik</text><text x=\"20\" y=\"30\" class=\"s-hd\">HALUS</text><text x=\"20\" y=\"152\" class=\"s-hd\">RINCI</text><line x1=\"40\" y1=\"40\" x2=\"40\" y2=\"138\" class=\"s-dash\"/></svg><figcaption>Contoh tingkat agregasi (kasus ilustrasi jaringan toko). Ramalan di tiap tingkat dapat dibuat konsisten lewat peramalan hierarkis (Pertemuan 14; Hyndman &amp; Athanasopoulos, 2021, bab 11).</figcaption></figure><div class=\"grid3\" style=\"margin-top:.5em\"><div class=\"card\"><p><b>Agregasi</b>: per produk atau total kategori? per toko atau per wilayah?</p></div><div class=\"card\"><p><b>Frekuensi</b>: seberapa sering data dicatat dan ramalan diperbarui?</p></div><div class=\"card\"><p><b>Horizon</b>: berapa periode ke depan (mis. 6 minggu, 12 bulan)?</p></div></div><p style=\"margin-top:.5em\">Ketiganya ditentukan oleh <b>keputusan</b> yang didukung, bukan oleh data yang kebetulan tersedia <span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §1.3)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Jenis peramalan</span><span>Indikator 1</span></div><h2>Kualitatif vs kuantitatif</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg><button type=\"button\" class=\"term\" data-term=\"qualitative-forecasting\">Kualitatif</button> (judgmental)</h3><p><b>Kapan?</b> Data historis <b>tidak ada</b> atau <b>tidak relevan</b>.</p><ul><li><button type=\"button\" class=\"term\" data-term=\"delphi-method\">Metode Delphi</button>: panel ahli, anonim, beberapa putaran.</li><li>Peramalan dengan analogi: produk atau kejadian serupa.</li><li>Perencanaan skenario: optimistis, moderat, pesimistis.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Contoh: pendaftar prodi yang baru dibuka; produk baru UMKM.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg><button type=\"button\" class=\"term\" data-term=\"quantitative-forecasting\">Kuantitatif</button></h3><p><b>Kapan?</b> Dua syarat terpenuhi:</p><ol><li>Tersedia informasi numerik tentang masa lalu.</li><li>Wajar diasumsikan sebagian pola masa lalu berlanjut ke masa depan.</li></ol><p class=\"muted\" style=\"font-size:.85em\">Contoh: penjualan bulanan 4 tahun; kasus DBD mingguan; antrean layanan harian.</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\"><span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §1.4 dan bab 6)</span>. Dalam praktik keduanya sering digabung: ramalan statistik lalu disesuaikan oleh ahli.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Model kuantitatif</span><span>Indikator 1</span></div><h2>Tiga jenis model kuantitatif</h2><p>Contoh sumber: meramal permintaan listrik per jam (<i>ED</i>) <span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §1.4)</span>.</p><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg><button type=\"button\" class=\"term\" data-term=\"explanatory-model\">Explanatory model</button></h3><p style=\"font-family:var(--mono);font-size:.82em\">ED = f(suhu, ekonomi, populasi, jam, hari, galat)</p><p>Meramal dari variabel penjelas. Pertemuan 11.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg><button type=\"button\" class=\"term\" data-term=\"time-series-model\">Time series model</button></h3><p style=\"font-family:var(--mono);font-size:.82em\">ED<sub>t+1</sub> = f(ED<sub>t</sub>, ED<sub>t−1</sub>, ED<sub>t−2</sub>, …, galat)</p><p>Meramal dari masa lalu seri itu sendiri. Pertemuan 4–10.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Mixed / dynamic regression</h3><p style=\"font-family:var(--mono);font-size:.82em\">ED<sub>t+1</sub> = f(ED<sub>t</sub>, suhu, jam, hari, galat)</p><p>Gabungan keduanya (ARIMAX). Pertemuan 11.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mengapa sering memilih time series model? Sistem tidak selalu dipahami, prediktor juga harus diramal, dan yang dibutuhkan sering hanya <b>apa</b> yang akan terjadi, bukan <b>mengapa</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Perspektif statistik</span><span>Ketidakpastian</span></div><h2>Satu angka tidak cukup: <button type=\"button\" class=\"term\" data-term=\"point-forecast\">ramalan titik</button> dan <button type=\"button\" class=\"term\" data-term=\"prediction-interval\">interval prediksi</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 900 230\" style=\"max-height:12em\" role=\"img\" aria-label=\"Grafik data historis 30 periode dengan tren naik, lalu ramalan 12 periode ke depan berupa garis ramalan titik dan dua pita interval prediksi 80 persen dan 95 persen yang semakin melebar ke kanan. Data ilustrasi.\"><path d=\"M640 124.3 L660 104.8 L680 94.7 L700 86.2 L720 78.6 L740 71.4 L760 64.6 L780 58.1 L800 51.9 L820 45.8 L840 39.8 L860 34 L880 28.3 L880 140.8 L860 141.7 L840 142.5 L820 143.2 L800 143.7 L780 144.1 L760 144.2 L740 144 L720 143.5 L700 142.5 L680 140.6 L660 137.2 Z\" style=\"fill:var(--accent-soft);stroke:none\"/><path d=\"M640 124.3 L660 110.4 L680 102.7 L700 96 L720 89.8 L740 84 L760 78.4 L780 73 L800 67.8 L820 62.7 L840 57.6 L860 52.7 L880 47.8 L880 121.3 L860 123 L840 124.7 L820 126.3 L800 127.8 L780 129.2 L760 130.4 L740 131.4 L720 132.3 L700 132.7 L680 132.7 L660 131.6 Z\" style=\"fill:var(--accent);opacity:.45;stroke:none\"/><path d=\"M60 181.7 L80 170 L100 171 L120 165.9 L140 148.9 L160 135.4 L180 138.1 L200 125.6 L220 130 L240 123 L260 120.7 L280 122.3 L300 127.3 L320 125.5 L340 120.4 L360 113.2 L380 122.6 L400 119.2 L420 116.7 L440 116.3 L460 117 L480 122.9 L500 110.1 L520 95.1 L540 93.1 L560 107 L580 113.7 L600 124.1 L620 125.5 L640 124.3\" class=\"s-line\" style=\"stroke:var(--primary);stroke-width:2.5\"/><path d=\"M640 124.3 L660 121 L680 117.7 L700 114.4 L720 111 L740 107.7 L760 104.4 L780 101.1 L800 97.8 L820 94.5 L840 91.2 L860 87.8 L880 84.5\" class=\"s-warnline\" style=\"stroke-width:2.5\"/><line x1=\"640\" y1=\"14\" x2=\"640\" y2=\"192\" class=\"s-dash\"/><text x=\"632\" y=\"24\" text-anchor=\"end\" class=\"s-hd\">DATA HISTORIS</text><text x=\"648\" y=\"24\" class=\"s-hd\">RAMALAN</text><line x1=\"60\" y1=\"192\" x2=\"880\" y2=\"192\" class=\"s-line\" style=\"stroke:var(--muted);stroke-width:1\"/><rect x=\"80\" y=\"202\" width=\"16\" height=\"10\" style=\"fill:var(--accent);opacity:.45\"/><text x=\"102\" y=\"212\" class=\"s-s\">interval 80%</text><rect x=\"210\" y=\"202\" width=\"16\" height=\"10\" style=\"fill:var(--accent-soft)\"/><text x=\"232\" y=\"212\" class=\"s-s\">interval 95%</text><line x1=\"340\" y1=\"207\" x2=\"370\" y2=\"207\" class=\"s-warnline\"/><text x=\"378\" y=\"212\" class=\"s-s\">ramalan titik (rata-rata distribusi ramalan)</text></svg><figcaption>Ramalan titik dan interval prediksi; pita melebar karena ketidakpastian bertambah seiring horizon (konsep dari Hyndman &amp; Athanasopoulos, 2021, §1.7). Data ilustrasi.</figcaption></figure><p style=\"margin-top:.3em\">Yang diramal adalah <b>variabel acak</b>; ramalan yang lengkap menyebut rentang dan peluangnya <span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §1.7)</span>.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses peramalan</span><span>Indikator 3</span></div><h2>Lima langkah dasar tugas peramalan</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 220\" style=\"max-height:12em\" role=\"img\" aria-label=\"Lima langkah dasar tugas peramalan menurut Hyndman dan Athanasopoulos: 1 problem definition, 2 gathering information, 3 preliminary exploratory analysis, 4 choosing and fitting models, 5 using and evaluating a forecasting model. Panah umpan balik dari langkah 5 kembali ke langkah 1 menunjukkan proses berulang.\"><defs><marker id=\"pr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"160\" height=\"118\" rx=\"12\" class=\"s-box\"/><text x=\"90\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 1</text><text x=\"90\" y=\"84\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Problem</text><text x=\"90\" y=\"103\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">definition</text><text x=\"90\" y=\"132\" text-anchor=\"middle\" class=\"s-s\">definisi masalah</text><line x1=\"171\" y1=\"89\" x2=\"186\" y2=\"89\" class=\"s-line\" marker-end=\"url(#pr)\"/><rect x=\"188\" y=\"30\" width=\"160\" height=\"118\" rx=\"12\" class=\"s-box\"/><text x=\"268\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 2</text><text x=\"268\" y=\"84\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Gathering</text><text x=\"268\" y=\"103\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">information</text><text x=\"268\" y=\"132\" text-anchor=\"middle\" class=\"s-s\">mengumpulkan informasi</text><line x1=\"349\" y1=\"89\" x2=\"364\" y2=\"89\" class=\"s-line\" marker-end=\"url(#pr)\"/><rect x=\"366\" y=\"30\" width=\"160\" height=\"118\" rx=\"12\" class=\"s-soft\"/><text x=\"446\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 3</text><text x=\"446\" y=\"84\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Preliminary (explo-</text><text x=\"446\" y=\"103\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">ratory) analysis</text><text x=\"446\" y=\"132\" text-anchor=\"middle\" class=\"s-s\">analisis eksploratif</text><line x1=\"527\" y1=\"89\" x2=\"542\" y2=\"89\" class=\"s-line\" marker-end=\"url(#pr)\"/><rect x=\"544\" y=\"30\" width=\"160\" height=\"118\" rx=\"12\" class=\"s-soft\"/><text x=\"624\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 4</text><text x=\"624\" y=\"84\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Choosing and</text><text x=\"624\" y=\"103\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">fitting models</text><text x=\"624\" y=\"132\" text-anchor=\"middle\" class=\"s-s\">memilih & melatih model</text><line x1=\"705\" y1=\"89\" x2=\"720\" y2=\"89\" class=\"s-line\" marker-end=\"url(#pr)\"/><rect x=\"722\" y=\"30\" width=\"160\" height=\"118\" rx=\"12\" class=\"s-acc\"/><text x=\"802\" y=\"56\" text-anchor=\"middle\" class=\"s-hd\">LANGKAH 5</text><text x=\"802\" y=\"84\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">Using and evaluating</text><text x=\"802\" y=\"103\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13.5px\">a forecasting model</text><text x=\"802\" y=\"132\" text-anchor=\"middle\" class=\"s-s\">memakai & mengevaluasi</text><path d=\"M802 150 v34 H90 v-32\" class=\"s-dash\" marker-end=\"url(#pr)\"/><text x=\"446\" y=\"206\" text-anchor=\"middle\" class=\"s-s\">evaluasi memicu perbaikan: masalah, data, atau model ditinjau ulang</text></svg><figcaption>Lima langkah dasar tugas peramalan, diadaptasi dari Hyndman &amp; Athanasopoulos (2021, §1.6). Nama langkah ditulis sesuai sumber; panah umpan balik adalah penekanan dosen.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh utuh</span><span>Kasus ilustrasi · indikator 2–3</span></div><h2>Lima langkah pada PMB kampus</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Langkah</th><th>Hasil pada kasus</th></tr></thead><tbody><tr><td><b>1. Problem definition</b></td><td>Wakil rektor perlu jumlah pendaftar per prodi per gelombang untuk menyiapkan kelas, dosen, dan anggaran promosi. Horizon: 1 tahun akademik; agregasi: per prodi; frekuensi: per minggu masa pendaftaran.</td></tr><tr><td><b>2. Gathering information</b></td><td>Ekspor aplikasi PMB 6 tahun; kalender gelombang; pendapat tim promosi tentang perubahan jalur beasiswa.</td></tr><tr><td><b>3. Exploratory analysis</b></td><td>Grafik pendaftar mingguan: tren naik, lonjakan menjelang penutupan gelombang, tahun 2020 anomali.</td></tr><tr><td><b>4. Choosing &amp; fitting</b></td><td>Bandingkan seasonal naive, ETS, ARIMA, dan regresi dengan variabel gelombang.</td></tr><tr><td><b>5. Using &amp; evaluating</b></td><td>Ramalan + interval dikirim ke pimpinan; akurasi dicek tiap minggu saat data baru masuk.</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ekosistem Python</span><span>Alat semester ini</span></div><h2>pandas, statsmodels, dan pustaka Nixtla</h2><div class=\"cols w\"><div><div class=\"grid3\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18M3 15h18M9 3v18\"/></svg>pandas</h3><p>membaca, membersihkan, dan mengolah data waktu <span class=\"cite\">(McKinney, 2010)</span></p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>statsmodels</h3><p>ACF/PACF, dekomposisi, uji statistik, ARIMA <span class=\"cite\">(Seabold &amp; Perktold, 2010)</span></p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>statsforecast</h3><p>benchmark, ETS, ARIMA yang cepat <span class=\"cite\">(Garza et al., 2022)</span></p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m16 18 6-6-6-6\"/><path d=\"m8 6-6 6 6 6\"/></svg>mlforecast · neuralforecast</h3><p>machine learning dan deep learning (Pertemuan 12–13)</p></div></div><p class=\"muted\" style=\"font-size:.82em;margin-top:.5em\">Buku utama versi Python memakai pustaka ini <span class=\"cite\">(Hyndman et al., 2025)</span>.</p></div><div><p style=\"margin:0 0 .3em\"><b>Data dalam <button type=\"button\" class=\"term\" data-term=\"long-format\">long format</button></b>:</p><div class=\"tw\"><table class=\"t\"><thead><tr><th>unique_id</th><th>ds</th><th>y</th></tr></thead><tbody><tr><td>kue_nastar</td><td>2025-01-01</td><td>412</td></tr><tr><td>kue_nastar</td><td>2025-02-01</td><td>455</td></tr><tr><td>kue_kastengel</td><td>2025-01-01</td><td>318</td></tr></tbody></table></div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>from statsforecast import StatsForecast\nfrom statsforecast.models import SeasonalNaive\n\nsf = StatsForecast(models=[SeasonalNaive(season_length=12)],\n                   freq=\"MS\")\nfc = sf.forecast(df=df, h=6, level=[80, 95])</code></pre></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span><span>Kelompok 4–5 orang · 20 menit · kasus ilustrasi</span></div><h2>Peramalan di industri dan layanan publik</h2><div class=\"grid4\" style=\"grid-template-columns:1fr 1fr\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5V8z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>A · Ritel/UMKM</h3><p>Jaringan toko oleh-oleh di Sidoarjo–Surabaya menyiapkan stok menjelang Lebaran dan libur akhir tahun.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>B · Dinas kesehatan</h3><p>Menyiapkan stok reagen, obat, dan tempat tidur untuk kasus DBD pada musim hujan.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>C · Perguruan tinggi</h3><p>Menentukan kuota kelas, dosen, dan anggaran promosi dari jumlah pendaftar per prodi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>D · Layanan publik</h3><p>Mal pelayanan publik kabupaten mengatur jumlah loket per hari agar antrean tidak menumpuk.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Pilih satu kasus. Tentukan: (1) apa yang diramal (agregasi, frekuensi), (2) horizon dan keputusan yang didukung, (3) kualitatif atau kuantitatif dan alasannya, (4) informasi apa yang dibutuhkan.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Peramalan</b> memprediksi seakurat mungkin dengan semua informasi; berbeda dari <b>target</b> dan <b>perencanaan</b>.</li><li>Keterprediksian bergantung pada <b>pemahaman faktor, data, kemiripan masa depan, dan efek ramalan</b>.</li><li><b>Horizon, frekuensi, dan agregasi</b> ditentukan oleh keputusan yang didukung.</li><li><b>Kualitatif</b> bila data tidak ada/relevan; <b>kuantitatif</b> bila ada data dan pola wajar berlanjut (time series, explanatory, campuran).</li><li>Lima langkah: <b>definisi masalah → informasi → eksplorasi → model → pakai &amp; evaluasi</b>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Data historis prodi itu belum ada, sehingga syarat peramalan kuantitatif tidak terpenuhi.\"><p class=\"q\">Kampus membuka prodi baru tahun depan dan ingin memperkirakan pendaftarnya. Pendekatan paling tepat…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. time series model data prodi itu</button><button type=\"button\" data-o=\"b\">B. kualitatif: analogi dan panel ahli</button><button type=\"button\" data-o=\"c\">C. seasonal naive</button><button type=\"button\" data-o=\"d\">D. tidak perlu diramal</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Horizon minimal mengikuti lead time keputusan yang didukung.\"><p class=\"q\">Bahan baku harus dipesan 6 minggu sebelumnya. Horizon ramalan minimal yang dibutuhkan adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. 1 hari</button><button type=\"button\" data-o=\"b\">B. 1 minggu</button><button type=\"button\" data-o=\"c\">C. 6 minggu</button><button type=\"button\" data-o=\"d\">D. 6 tahun</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"d\" data-why=\"Problem definition sering menjadi bagian tersulit dan menentukan langkah berikutnya.\"><p class=\"q\">Menurut Hyndman &amp; Athanasopoulos (2021), langkah pertama tugas peramalan adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. choosing and fitting models</button><button type=\"button\" data-o=\"b\">B. gathering information</button><button type=\"button\" data-o=\"c\">C. preliminary analysis</button><button type=\"button\" data-o=\"d\">D. problem definition</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab 1 <i>Forecasting: Principles and Practice</i> (Hyndman &amp; Athanasopoulos, 2021) atau versi Python-nya (Hyndman et al., 2025), keduanya gratis di otexts.com. Pengayaan: bagian pengantar Petropoulos et al. (2022).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m16 18 6-6-6-6\"/><path d=\"m8 6-6 6 6 6\"/></svg>Menyiapkan lingkungan Python</h3><ul><li>Pasang Python 3 + Jupyter/VS Code, atau pakai Google Colab.</li><li>Pasang: <code>pandas matplotlib statsmodels statsforecast</code>.</li><li>Jalankan contoh kode yang dibagikan di grup kelas; kirim tangkapan layar hasilnya.</li><li>Tulis 1 paragraf (bahasa Indonesia): satu masalah di sekitar Anda yang butuh peramalan, beserta horizon dan agregasinya.</li></ul></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai cari <b>data runtun waktu</b> untuk proyek kelompok. Kelompok dan kasus dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Forecasting</span></dt><dd>Memprediksi nilai di masa depan seakurat mungkin memakai semua informasi yang tersedia, termasuk data historis. <i>(peramalan)</i></dd></div><div><dt><span class=\"en\">Time series</span></dt><dd>Rangkaian observasi yang dicatat berurutan menurut waktu dengan interval teratur (harian, mingguan, bulanan). <i>(runtun waktu / deret waktu)</i></dd></div><div><dt><span class=\"en\">Forecast horizon</span></dt><dd>Seberapa jauh ke depan ramalan dibuat, mis. 1 minggu, 6 bulan, atau 3 tahun. <i>(horizon peramalan)</i></dd></div><div><dt><span class=\"en\">Frequency</span></dt><dd>Interval pencatatan data runtun waktu: harian, mingguan, bulanan, kuartalan, tahunan. <i>(frekuensi)</i></dd></div><div><dt><span class=\"en\">Aggregation</span></dt><dd>Tingkat penggabungan data yang diramal, mis. per produk vs total kategori, per cabang vs nasional. <i>(agregasi)</i></dd></div><div><dt><span class=\"en\">Qualitative forecasting</span></dt><dd>Peramalan berbasis penilaian ahli (judgmental), dipakai bila data historis tidak ada atau tidak relevan. <i>(peramalan kualitatif)</i></dd></div><div><dt><span class=\"en\">Delphi method</span></dt><dd>Teknik peramalan kualitatif: panel ahli menjawab anonim dalam beberapa putaran dengan umpan balik hingga pendapat mengerucut. <i>(metode Delphi)</i></dd></div><div><dt><span class=\"en\">Quantitative forecasting</span></dt><dd>Peramalan dengan model matematis/statistik dari data numerik masa lalu. <i>(peramalan kuantitatif)</i></dd></div><div><dt><span class=\"en\">Time series model</span></dt><dd>Model yang meramal hanya dari nilai masa lalu variabel itu sendiri (dan galatnya). <i>(model runtun waktu)</i></dd></div><div><dt><span class=\"en\">Explanatory model</span></dt><dd>Model yang meramal dari variabel penjelas (prediktor), mis. suhu, harga, hari libur. <i>(model penjelas / kausal)</i></dd></div><div><dt><span class=\"en\">Point forecast</span></dt><dd>Satu angka ramalan, biasanya rata-rata dari distribusi ramalan. <i>(ramalan titik)</i></dd></div><div><dt><span class=\"en\">Prediction interval</span></dt><dd>Rentang yang diperkirakan memuat nilai aktual dengan peluang tertentu, mis. 80% atau 95%. <i>(interval prediksi)</i></dd></div><div><dt><span class=\"en\">Long format</span></dt><dd>Tabel satu baris per (seri, waktu). Pustaka Nixtla memakai kolom unique_id, ds, y. <i>(format panjang)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Montgomery, D. C., Jennings, C. L., &amp; Kulahci, M. (2015). <i>Introduction to time series analysis and forecasting</i> (2nd ed.). John Wiley &amp; Sons.</li><li>Petropoulos, F., Apiletti, D., Assimakopoulos, V., Babai, M. Z., Barrow, D. K., Ben Taieb, S., et al. (2022). Forecasting: Theory and practice. <i>International Journal of Forecasting, 38</i>(3), 705–871.</li><li>McKinney, W. (2010). Data structures for statistical computing in Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i> (hlm. 56–61).</li><li>Seabold, S., &amp; Perktold, J. (2010). Statsmodels: Econometric and statistical modeling with Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i>.</li><li>Garza, A., Canseco, M. M., Challú, C., &amp; Olivares, K. G. (2022). <i>StatsForecast: Lightning fast forecasting with statistical and econometric models</i> [Perangkat lunak]. Nixtla. https://github.com/Nixtla/statsforecast</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Pola Data Runtun Waktu & Autokorelasi","subtitle":"Struktur data runtun waktu, time plot, seasonal plot, lag plot, pola tren–musiman–siklus, ACF dan PACF","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Metode Peramalan (Forecasting) · SII017</span></div><h1>Pola Data Runtun Waktu &amp; Autokorelasi</h1><p class=\"lead\">Struktur data runtun waktu, time plot, seasonal plot, lag plot, pola tren–musiman–siklus, ACF dan PACF</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + praktikum + bentuk kelompok &amp; pilih kasus</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis pola data runtun waktu dan menyiapkan data untuk pemodelan (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2; indikator 3 dan 4 di Pertemuan 3)</span></h3><ol><li>Ketepatan mengidentifikasi tren, musiman, siklus, dan noise.</li><li>Ketepatan membaca plot ACF dan PACF.</li><li>Ketepatan menangani data hilang, outlier, dan penyesuaian kalender. <span class=\"muted\">(Pertemuan 3)</span></li><li>Ketepatan memilih transformasi (log, Box-Cox). <span class=\"muted\">(Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-3</dt><dd>Mahasiswa mampu mengelola data runtun waktu dan memanfaatkan hasil peramalan untuk mendukung pengambilan keputusan berbasis data.</dd><dt>CPL-7</dt><dd class=\"id\">Mampu mendokumentasikan, mengelola, dan mengamankan data serta memanfaatkannya untuk mendukung pengambilan keputusan berbasis data dan mencegah pelanggaran etika (plagiasi).</dd><dt>Waktu</dt><dd>Tatap muka 3×50 menit · Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Praktikum (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa beda ramalan (<i>forecast</i>) dan target (<i>goal</i>)?</li><li>Kapan peramalan kuantitatif dapat dipakai?</li><li>Sebutkan lima langkah dasar tugas peramalan. Hari ini kita di langkah ke berapa?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Struktur data</span><span>Dasar indikator 1</span></div><h2>Apa itu data <button type=\"button\" class=\"term\" data-term=\"time-series\">runtun waktu</button>?</h2><div class=\"cols w\"><div><ul><li>Observasi yang dicatat <b>berurutan</b> menurut waktu dengan <b>interval teratur</b>.</li><li>Urutan penting: baris tidak boleh diacak (berbeda dengan data cross-section).</li><li>Setiap seri punya <b>indeks waktu</b> dan <b>kunci</b> (mis. produk, cabang) bila ada banyak seri.</li><li><button type=\"button\" class=\"term\" data-term=\"frequency\">Frekuensi</button> menentukan <b>periode musiman</b> yang mungkin muncul.</li></ul><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Hyndman &amp; Athanasopoulos, 20 : tolok ukur \"tidak ada pola\"</h2><div class=\"cols w\"><div><ul><li>Seri tanpa autokorelasi: setiap nilai tidak dapat diramal dari nilai sebelumnya.</li><li>Untuk white noise, kira-kira <b>95%</b> batang ACF berada di dalam <b>±1,96/√T</b>.</li><li>Bila ada batang besar di luar batas, atau jauh lebih dari 5% batang di luar batas, seri <b>kemungkinan bukan</b> white noise.</li></ul><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Hyndman &amp; Athanasopoulos, 2021, §2.9)</span></p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Mengapa penting?</h3><p>Setelah model dibuat, <b>residual</b> yang baik harus menyerupai white noise. Jika tidak, masih ada pola yang bisa dimanfaatkan untuk memperbaiki ramalan (Pertemuan 7).</p><p class=\"muted\" style=\"font-size:.85em\">Contoh batas: T = 48 → ±0,28; T = 120 → ±0,18.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Praktikum</span><span>Python · 30 menit</span></div><h2>Eksplorasi data dengan pandas dan statsmodels</h2><div class=\"cols w\"><div><pre style=\"margin:.5em 0 0;padding:.75em .9em;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:.72em;line-height:1.5;overflow-x:auto;white-space:pre;max-width:100%\"><code>import pandas as pd\nimport matplotlib.pyplot as plt\nfrom statsmodels.graphics.tsaplots import plot_acf, plot_pacf\n\ndf = pd.read_csv(\"penjualan_umkm.csv\", parse_dates=[\"ds\"])\ns = df.set_index(\"ds\")[\"y\"].asfreq(\"MS\")   # bulanan\n\ns.plot(marker=\"o\")                           # time plot\n(s.groupby([s.index.month, s.index.year]).sum()\n  .unstack().plot())                         # seasonal plot\npd.plotting.lag_plot(s, lag=12)              # lag plot\n\nfig, ax = plt.subplots(1, 2, figsize=(10, 3))\nplot_acf(s, lags=24, ax=ax[0])\nplot_pacf(s, lags=24, ax=ax[1], method=\"ywm\")</code></pre></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Unduh data ilustrasi dari grup kelas.</li><li>Jalankan sel demi sel; beri judul dan label sumbu tiap grafik.</li><li>Tulis 1–2 kalimat interpretasi di bawah tiap grafik.</li><li>Cek: <code>s.isna().sum()</code>. Ada data hilang? Catat untuk Pertemuan 3.</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 5 menit · data ilustrasi</span></div><h2>Cocokkan korelogram dengan serinya</h2><figure class=\"fig\"><svg viewBox=\"0 0 900 200\" style=\"max-height:10.5em\" role=\"img\" aria-label=\"Tiga korelogram ACF, lag 1 sampai 24, masing-masing 120 observasi. Korelogram 1: semua batang kecil di dalam batas. Korelogram 2: batang positif besar yang turun sangat perlahan. Korelogram 3: batang bergelombang dengan puncak positif di lag 12 dan 24 dan negatif di lag 6 dan 18.\"><rect x=\"20\" y=\"6\" width=\"276\" height=\"188\" rx=\"12\" class=\"s-box\"/><text x=\"34\" y=\"30\" class=\"s-hd\">KORELOGRAM 1</text><line x1=\"38\" y1=\"108\" x2=\"282\" y2=\"108\" style=\"stroke:var(--muted);stroke-width:1\"/><line x1=\"38\" y1=\"96.5\" x2=\"282\" y2=\"96.5\" class=\"s-dash\" style=\"stroke:var(--warn)\"/><line x1=\"38\" y1=\"119.5\" x2=\"282\" y2=\"119.5\" class=\"s-dash\" style=\"stroke:var(--warn)\"/><line x1=\"43.1\" y1=\"108\" x2=\"43.1\" y2=\"108.6\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"53.3\" y1=\"108\" x2=\"53.3\" y2=\"108.3\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"63.4\" y1=\
