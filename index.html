/div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Langkah praktikum</h3><ol><li>Jalankan; cocokkan MAE per jendela dengan simulasi.</li><li>Ubah ke h = 6, step_size = 3, n_windows = 3. Apa yang berubah?</li><li>Ulangi pada data kelompok dengan h sesuai horizon keputusan.</li></ol></div></div><div class=\"sim sim-dl\" data-sim=\"dl\" data-cfg=\"{&quot;id&quot;:&quot;p6-dl2&quot;,&quot;compact&quot;:true,&quot;files&quot;:[{&quot;name&quot;:&quot;penjualan_umkm.csv&quot;,&quot;csv&quot;:&quot;unique_id,ds,y\\npenjualan_umkm,2022-01-01,675\\npenjualan_umkm,2022-02-01,652\\npenjualan_umkm,2022-03-01,666\\npenjualan_umkm,2022-04-01,1262\\npenjualan_umkm,2022-05-01,537\\npenjualan_umkm,2022-06-01,696\\npenjualan_umkm,2022-07-01,796\\npenjualan_umkm,2022-08-01,739\\npenjualan_umkm,2022-09-01,722\\npenjualan_umkm,2022-10-01,777\\npenjualan_umkm,2022-11-01,843\\npenjualan_umkm,2022-12-01,912\\npenjualan_umkm,2023-01-01,848\\npenjualan_umkm,2023-02-01,807\\npenjualan_umkm,2023-03-01,986\\npenjualan_umkm,2023-04-01,1239\\npenjualan_umkm,2023-05-01,769\\npenjualan_umkm,2023-06-01,895\\npenjualan_umkm,2023-07-01,960\\npenjualan_umkm,2023-08-01,990\\npenjualan_umkm,2023-09-01,958\\npenjualan_umkm,2023-10-01,952\\npenjualan_umkm,2023-11-01,1010\\npenjualan_umkm,2023-12-01,1135\\npenjualan_umkm,2024-01-01,961\\npenjualan_umkm,2024-02-01,1033\\npenjualan_umkm,2024-03-01,1374\\npenjualan_umkm,2024-04-01,1137\\npenjualan_umkm,2024-05-01,1089\\npenjualan_umkm,2024-06-01,1028\\npenjualan_umkm,2024-07-01,1062\\npenjualan_umkm,2024-08-01,1172\\npenjualan_umkm,2024-09-01,1125\\npenjualan_umkm,2024-10-01,1135\\npenjualan_umkm,2024-11-01,1112\\npenjualan_umkm,2024-12-01,1256\\npenjualan_umkm,2025-01-01,1149\\npenjualan_umkm,2025-02-01,1198\\npenjualan_umkm,2025-03-01,1789\\npenjualan_umkm,2025-04-01,1218\\npenjualan_umkm,2025-05-01,1262\\npenjualan_umkm,2025-06-01,1294\\npenjualan_umkm,2025-07-01,1257\\npenjualan_umkm,2025-08-01,1347\\npenjualan_umkm,2025-09-01,1346\\npenjualan_umkm,2025-10-01,1278\\npenjualan_umkm,2025-11-01,1359\\npenjualan_umkm,2025-12-01,1506\\n&quot;,&quot;desc&quot;:&quot;48 bulan, Jan 2022–Des 2025 (freq MS), data bersih&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Kelompok Tugas 1 · 20 menit · indikator 1–2</span></div><h2>Evaluasi model kasus Anda</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\" style=\"font-size:.84em\"><thead><tr><th>Model</th><th>MAE</th><th>RMSE</th><th>MAPE*</th><th>MASE</th><th>MAE CV</th></tr></thead><tbody><tr><td>Benchmark terbaik</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Seasonal naïve</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Model ETS terbaik</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Holt-Winters</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td></tr><tr><td>Model lain (opsional)</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.78em\">* Kosongkan bila data memuat nilai nol.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Putuskan bersama</h3><ol><li>Berapa panjang uji dan mengapa?</li><li>h, step_size, n_windows CV.</li><li>Metrik utama dan alasannya.</li><li>Calon model terbaik (final di P7).</li></ol></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Forecast error</b> e = y − ŷ dihitung di data uji; residual di data latih.</li><li><b>MAE</b> mudah dijelaskan; <b>RMSE</b> menghukum galat besar; keduanya bergantung skala.</li><li><b>MAPE</b> dalam persen, gagal bila ada nol; <b>MASE</b> bebas skala, &lt; 1 lebih baik dari pembanding.</li><li>Data uji = periode <b>akhir</b>, disembunyikan; hindari kebocoran data.</li><li><b>Validasi silang rolling origin</b> merata-ratakan banyak jendela; kesimpulannya lebih kuat dari satu kali pembagian.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · formatif, tidak dinilai</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;p6-quiz&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Galat ramalan tiga bulan: −10, 20, −30. MAE-nya…&quot;,&quot;o&quot;:[&quot;−6,7&quot;,&quot;20&quot;,&quot;21,6&quot;,&quot;60&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;MAE = (10 + 20 + 30) / 3 = 20. Tanda galat diabaikan.&quot;},{&quot;q&quot;:&quot;Untuk galat yang sama (−10, 20, −30), RMSE-nya kira-kira…&quot;,&quot;o&quot;:[&quot;20,0&quot;,&quot;21,6&quot;,&quot;14,1&quot;,&quot;466,7&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;√((100 + 400 + 900) / 3) = √466,7 ≈ 21,6; lebih besar dari MAE karena galat besar dikuadratkan.&quot;},{&quot;q&quot;:&quot;Data kunjungan harian sebuah posyandu memuat banyak hari bernilai 0. Metrik yang &lt;b&gt;tidak&lt;/b&gt; layak dipakai…&quot;,&quot;o&quot;:[&quot;MAE&quot;,&quot;RMSE&quot;,&quot;MAPE&quot;,&quot;MASE&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;MAPE membagi galat dengan nilai aktual; y = 0 membuatnya tak terdefinisi.&quot;},{&quot;q&quot;:&quot;Pada validasi silang runtun waktu, data latih setiap jendela berisi…&quot;,&quot;o&quot;:[&quot;seluruh data, diacak&quot;,&quot;hanya observasi sebelum data uji jendela itu&quot;,&quot;observasi sebelum dan sesudah data uji&quot;,&quot;data uji jendela sebelumnya saja&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Data masa depan tidak boleh dipakai; memakainya adalah kebocoran data.&quot;},{&quot;q&quot;:&quot;MASE sebuah model = 1,25. Artinya…&quot;,&quot;o&quot;:[&quot;model 25% lebih baik dari pembanding naïve&quot;,&quot;galatnya lebih besar dari rata-rata galat ramalan pembanding satu langkah di data latih&quot;,&quot;MAPE-nya 125%&quot;,&quot;model tidak bisa dibandingkan dengan seri lain&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;MASE &amp;gt; 1 berarti lebih buruk dari pembanding (naïve/seasonal naïve satu langkah di data latih).&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Hyndman &amp; Athanasopoulos (2021) §5.8 dan §5.10, atau padanannya di versi Python (Hyndman et al., 2025). Persiapan Pertemuan 7: §5.4 tentang diagnostik residual.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1C di Elin)</h3><ul><li>Tabel MAE, RMSE, MAPE, MASE data uji.</li><li>Validasi silang rolling origin beserta skemanya.</li><li>Calon model terbaik dan alasannya.</li><li>Mulai laporan akhir Tugas 1 dan slide presentasi.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bobot bagian P6–7: Tugas 1 10% (Penilaian Hasil Proyek). Tenggat Tugas 1A, 1B, 1C: Kamis, 5 November 2026, 23.59 WIB; presentasi di Pertemuan 7. Rincian dan rubrik di Elin.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Forecast error</span></dt><dd>Selisih nilai aktual dan ramalannya di data uji: e = y − ŷ. \"Error\" di sini berarti bagian yang tidak terduga, bukan kesalahan. <i>(galat ramalan)</i></dd></div><div><dt><span class=\"en\">Residuals</span></dt><dd>Selisih data latih dan nilai tercocok (fitted) satu langkah; dipakai untuk diagnostik model (Pertemuan 7). <i>(sisaan / residual)</i></dd></div><div><dt><span class=\"en\">Training data</span></dt><dd>Bagian awal data yang dipakai untuk mengestimasi parameter model. <i>(data latih)</i></dd></div><div><dt><span class=\"en\">Test data</span></dt><dd>Bagian akhir data yang disembunyikan saat melatih model dan hanya dipakai untuk mengukur akurasi ramalan. <i>(data uji)</i></dd></div><div><dt><span class=\"en\">Over-fitting</span></dt><dd>Model terlalu menyesuaikan diri dengan data latih (termasuk noise) sehingga ramalannya buruk di data baru. <i>(pencocokan berlebih)</i></dd></div><div><dt><span class=\"en\">Data leakage</span></dt><dd>Informasi dari data uji (masa depan) ikut terpakai saat melatih atau memilih model, sehingga akurasi tampak lebih baik dari kenyataan. <i>(kebocoran data)</i></dd></div><div><dt><span class=\"en\">Scale-dependent error</span></dt><dd>Ukuran galat bersatuan sama dengan data (mis. MAE, RMSE); tidak bisa membandingkan seri bersatuan berbeda. <i>(galat bergantung skala)</i></dd></div><div><dt><span class=\"en\">MAE</span></dt><dd>Mean absolute error: rata-rata |e|; mudah ditafsirkan, bersatuan sama dengan data. <i>(rata-rata galat absolut)</i></dd></div><div><dt><span class=\"en\">RMSE</span></dt><dd>Root mean squared error: akar rata-rata e²; lebih menghukum galat besar daripada MAE. <i>(akar rata-rata kuadrat galat)</i></dd></div><div><dt><span class=\"en\">MAPE</span></dt><dd>Mean absolute percentage error: rata-rata galat absolut dalam persen dari nilai aktual (Pertemuan 6). <i>(rata-rata persentase galat absolut)</i></dd></div><div><dt><span class=\"en\">MASE</span></dt><dd>Mean absolute scaled error: MAE dibagi MAE ramalan naïve (atau seasonal naïve) satu langkah di data latih; &lt; 1 berarti lebih baik dari pembanding itu. <i>(rata-rata galat absolut terskala)</i></dd></div><div><dt><span class=\"en\">Time series cross-validation</span></dt><dd>Evaluasi berulang pada beberapa data uji berurutan; setiap data latih hanya berisi observasi sebelum data ujinya. <i>(validasi silang runtun waktu)</i></dd></div><div><dt><span class=\"en\">Rolling forecasting origin</span></dt><dd>Titik asal ramalan yang digeser maju setiap putaran validasi silang. <i>(titik asal ramalan bergulir)</i></dd></div><div><dt><span class=\"en\">Seasonal naïve method</span></dt><dd>Ramalan sama dengan nilai terakhir dari musim yang sama, mis. bulan yang sama tahun lalu. <i>(metode naif musiman)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Petropoulos, F., Apiletti, D., Assimakopoulos, V., Babai, M. Z., Barrow, D. K., Ben Taieb, S., et al. (2022). Forecasting: Theory and practice. <i>International Journal of Forecasting, 38</i>(3), 705–871.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Diagnostik Residual & Presentasi Tugas 1","subtitle":"Analisis residual, uji Ljung-Box, pemilihan model terbaik · presentasi Tugas 1","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-1 · CPL-8</span></div><h1>Diagnostik Residual & Presentasi Tugas 1</h1><p class=\"lead\">Analisis residual, uji Ljung-Box, pemilihan model terbaik · presentasi Tugas 1</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi akurasi model peramalan dengan metrik dan validasi silang runtun waktu (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 8</span></div><h1>Ujian Tengah Semester (UTS)</h1><p class=\"lead\">Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]},{"no":9,"title":"Stasioneritas & Model ARIMA","subtitle":"Stasioneritas, differencing, uji ADF/KPSS; model AR, MA, ARMA, ARIMA","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 9</span><span>Sub-CPMK-5 (Pertemuan 9–10) · CPMK-1 · CPL-8</span></div><h1>Stasioneritas & Model ARIMA</h1><p class=\"lead\">Stasioneritas, differencing, uji ADF/KPSS; model AR, MA, ARMA, ARIMA</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menganalisis stasioneritas dan membangun model ARIMA/SARIMA (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":10,"title":"SARIMA & Auto-ARIMA","subtitle":"SARIMA, identifikasi orde dari ACF/PACF, AIC/AICc, auto-ARIMA, diagnostik model","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 10</span><span>Sub-CPMK-5 (Pertemuan 9–10) · CPMK-1 · CPL-8</span></div><h1>SARIMA & Auto-ARIMA</h1><p class=\"lead\">SARIMA, identifikasi orde dari ACF/PACF, AIC/AICc, auto-ARIMA, diagnostik model</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menganalisis stasioneritas dan membangun model ARIMA/SARIMA (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":11,"title":"Regresi Runtun Waktu & ARIMAX","subtitle":"Prediktor tren dan dummy musiman, efek hari libur nasional, seleksi prediktor, regresi dinamis","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 11</span><span>Sub-CPMK-6 · CPMK-1 · CPL-8</span></div><h1>Regresi Runtun Waktu & ARIMAX</h1><p class=\"lead\">Prediktor tren dan dummy musiman, efek hari libur nasional, seleksi prediktor, regresi dinamis</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu membangun s permintaan ritel","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 14</span><span>Sub-CPMK-8 · CPMK-2 · CPL-11</span></div><h1>Peramalan Probabilistik, Ensemble & Hierarkis</h1><p class=\"lead\">Interval prediksi, kombinasi peramalan, rekonsiliasi hierarkis, studi kasus permintaan ritel</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu mengevaluasi peramalan probabilistik dan ensemble untuk masalah industri (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":15,"title":"Dari Ramalan ke Keputusan & Presentasi Akhir","subtitle":"Persediaan, kapasitas, anggaran; komunikasi ketidakpastian; dashboard; etika dan reprodusibilitas · presentasi Tugas 2","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 15</span><span>Sub-CPMK-9 · CPMK-3 · CPL-7</span></div><h1>Dari Ramalan ke Keputusan & Presentasi Akhir</h1><p class=\"lead\">Persediaan, kapasitas, anggaran; komunikasi ketidakpastian; dashboard; etika dan reprodusibilitas · presentasi Tugas 2</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu merumuskan rekomendasi keputusan dari hasil peramalan dan mengomunikasikannya (C5).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":16,"title":"Ujian Akhir Semester (UAS)","subtitle":"Materi Pertemuan 9–15 · Sub-CPMK-5 s.d. Sub-CPMK-9","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 16</span></div><h1>Ujian Akhir Semester (UAS)</h1><p class=\"lead\">Materi Pertemuan 9–15 · Sub-CPMK-5 s.d. Sub-CPMK-9</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 3×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]}];
const SIMS={cv(el, cfg, s){
    const y=cfg.y, n=y.length, C=cfg.cut, h=cfg.h, M=cfg.models, BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const lb=i=>BL[i%12]+' '+(cfg.y0+Math.floor(i/12));
    const f=v=>Number(v).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
    if(s.w===undefined) s.w=0;
    const draw=()=>{
      const avg=s.w===C.length, c=avg?null:C[s.w];
      const W=400, H=190, P=8, mn=Math.min(...y)*0.95, mx=Math.max(...y)*1.03, X=i=>P+i*(W-2*P)/(n-1), Y=v=>12+(1-(v-mn)/(mx-mn))*(H-52);
      let g='';
      if(!avg){ g+='<rect x="'+X(0).toFixed(1)+'" y="8" width="'+(X(c)-X(0)).toFixed(1)+'" height="'+(H-44)+'" class="s-soft" style="stroke:none;opacity:.55"/>';
        g+='<rect x="'+(X(c)+2).toFixed(1)+'" y="8" width="'+(X(c+h)-X(c)-2).toFixed(1)+'" height="'+(H-44)+'" class="s-acc" style="stroke:none"/>'; }
      else C.forEach(cc=>{ g+='<rect x="'+(X(cc)+2).toFixed(1)+'" y="8" width="'+(X(cc+h)-X(cc)-2).toFixed(1)+'" height="'+(H-44)+'" class="s-acc" style="stroke:none;opacity:.7"/>'; });
      g+='<path d="'+y.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')+'" class="s-line" style="stroke-width:2;fill:none"/>';
      [0,24,47].forEach(i=>{ g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-22)+'" text-anchor="'+(i===0?'start':i===47?'end':'middle')+'" class="s-s" style="font-size:11px">'+lb(i)+'</text>'; });
      const rows=M.map(m=>[m[0], avg?m[2]:m[1][s.w]]), best=Math.min(...rows.map(r=>r[1])), top=Math.max(...rows.map(r=>r[1]));
      const bars=rows.map(r=>'<div style="display:grid;grid-template-columns:8.5em 1fr 3.4em;gap:.4em;align-items:center;margin:.18em 0"><span>'+r[0]+'</span><span style="display:block;height:.9em;border:2px solid var(--line);background:'+(r[1]===best?'var(--primary)':'var(--surface)')+';width:'+Math.max(4,r[1]/top*100).toFixed(0)+'%"></span><b style="text-align:right">'+f(r[1])+'</b></div>').join('');
      const info=avg?'<div class="g2-tag">Rata-rata 4 jendela</div><p style="margin:.3em 0 0;font-size:.84em">Setiap model dinilai pada 4 × '+h+' = '+(C.length*h)+' ramalan, bukan satu kali pembagian.</p>'
        :'<div class="g2-tag">Jendela '+(s.w+1)+' dari '+C.length+'</div><p style="margin:.3em 0 0;font-size:.84em"><b>Latih:</b> '+lb(0)+'–'+lb(c)+' ('+(c+1)+' bulan)<br><b>Uji:</b> '+lb(c+1)+'–'+lb(c+h)+' (h = 1…'+h+')</p>';
      el.innerHTML='<div class="g2"><div><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;color:var(--ink)" role="img" aria-label="Seri penjualan ilustrasi 48 bulan dengan '+(avg?'keempat':'')+' jendela uji ditandai">'+g+'</svg>'+
        '<div role="group" aria-label="Pilih jendela" style="display:flex;gap:.35em;flex-wrap:wrap;margin-top:.35em">'+C.map((x,i)=>'<button type="button" class="wbtn'+(s.w===i?' pri':'')+'" data-w="'+i+'" aria-pressed="'+(s.w===i)+'">Jendela '+(i+1)+'</button>').join('')+
        '<button type="button" class="wbtn'+(avg?' pri':'')+'" data-w="'+C.length+'" aria-pressed="'+avg+'">Rata-rata</button></div></div>'+
        '<div class="g2-out" aria-live="polite">'+info+'<p style="margin:.45em 0 .15em;font-size:.8em" class="muted">MAE (unit) · terkecil disorot</p><div style="font-size:.8em">'+bars+'</div></div></div>';
    };
    el.onclick=e=>{ const b=e.target.closest('button[data-w]'); if(!b) return; s.w=+b.dataset.w; draw(); const nb=el.querySelector('[data-w="'+s.w+'"]'); if(nb) nb.focus({preventScroll:true}); };
    draw();
  },
env(el, cfg, s){
    const T=cfg.tabs||[]; if(s.tab===undefined) s.tab=cfg.start||0;
    const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const draw=()=>{
      const t=T[s.tab];
      el.innerHTML='<div class="env-box"><div class="env-tabs" role="tablist">'+T.map((x,i)=>'<button type="button" role="tab" aria-selected="'+(i===s.tab)+'" class="wbtn'+(i===s.tab?' pri':'')+'" data-tab="'+i+'">'+x.label+'</button>').join('')+'</div>'+
        '<div class="env-p" role="tabpanel"><ol class="env-s">'+t.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol>'+
        '<div class="env-c"><pre class="env-pre"><code>'+esc(t.code)+'</code></pre><button type="button" class="wbtn" data-act="cp">Salin kode</button><span class="env-msg muted" aria-live="polite"></span></div></div></div>';
    };
    draw();
    el.onclick=e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.tab!==undefined){ s.tab=+b.dataset.tab; draw(); const nb=el.querySelector('[data-tab="'+s.tab+'"]'); if(nb) nb.focus(); return; }
      if(b.dataset.act==='cp'){ const m=el.querySelector('.env-msg'), code=T[s.tab].code;
        if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>{m.textContent='Kode disalin.';},()=>{m.textContent='Salin gagal; blok kode lalu salin manual.';});
        else m.textContent='Salin tidak tersedia; blok kode lalu salin manual.'; }
    };
  },
dl(el, cfg, s){
    const F=cfg.files||[];
    const rowsOf=c=>c.trim().split('\n').length-1;
    el.innerHTML='<div class="dl-box">'+F.map((f,i)=>'<div class="dl-row"><div class="dl-t"><b class="dl-n">'+f.name+'</b>'+(cfg.compact?'':'<span class="dl-d">'+f.desc+' · '+rowsOf(f.csv)+' baris</span>')+'</div><div class="dl-b"><button type="button" class="wbtn pri" data-i="'+i+'" data-act="dl">⬇ Unduh CSV</button><button type="button" class="wbtn" data-i="'+i+'" data-act="cp">Salin</button><button type="button" class="wbtn" data-i="'+i+'" data-act="pv">Lihat isi</button></div></div>').join('')+'<pre class="dl-pv" hidden aria-live="polite"></pre><p class="dl-msg muted" aria-live="polite"></p></div>';
    const msg=t=>{ el.querySelector('.dl-msg').textContent=t; };
    el.onclick=async e=>{
      const b=e.target.closest('button'); if(!b) return; const f=F[+b.dataset.i], act=b.dataset.act;

/* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  mountW(v); startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});

  if(e.target.closest('[data-lock]')){lockNotes();return;}

    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea,select'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button,a,summary'))return; /* let focused buttons work */
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage')&&!e.target.closest('input,textarea,.g2-svg'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Interactive widgets (v4.4) ----------
   Slide HTML holds <div class="sim" data-sim="type" data-cfg="{json}">, made by W() in data.js.
   Built-in types: quizset, stepper, grid2, scenario, peer. Course-specific types: SIMS in data.js.
   UI labels in English; all content comes from cfg (Indonesian). State lives in memory per widget id. */
const WST={};
let wTimers=[];
const WIDGETS={quizset:wQuiz,stepper:wStep,grid2:wGrid,scenario:wScen,peer:wPeer};
function mountW(scope){
  wTimers.forEach(clearInterval); wTimers=[];
  scope.querySelectorAll('[data-sim]').forEach(el=>{
    let cfg={}; try{cfg=JSON.parse(el.getAttribute('data-cfg')||'{}');}catch(e){}
    const id=cfg.id||'w'; if(!WST[id]) WST[id]={};
    const f=WIDGETS[el.dataset.sim]||(typeof SIMS!=='undefined'&&SIMS[el.dataset.sim]);
    if(!f){el.innerHTML='<p class="muted">Unknown widget.</p>';return;}
    try{f(el,cfg,WST[id]);}catch(e){el.innerHTML='<p class="muted">This simulation could not be loaded.</p>';if(window.console)console.error(e);}
  });
}
const kb=e=>e&&e.detail===0; // activated from keyboard
function refocus(el,sel){const b=el.querySelector(sel);if(b)b.focus({preventScroll:true});}

/* Quiz, one question at a time, with score */
function wQuiz(el,cfg,s){
  const Q=cfg.items||[]; if(s.i===undefined){s.i=0;s.ans=[];}
  const L='ABCDEF';
  const draw=()=>{
    if(s.i>=Q.length){
      const ok=Q.filter((q,i)=>s.ans[i]===q.a).length;
      el.innerHTML='<div class="qs-end"><div class="qs-score" aria-live="polite"><b>'+ok+'</b><span>/ '+Q.length+'</span></div><div><p class="qs-msg">'+(ok===Q.length?'Excellent!':ok>=Math.ceil(Q.length*.6)?'Good work.':'Review the material and try again.')+'</p>'+
        '<ol class="qs-rev">'+Q.map((q,i)=>'<li class="'+(s.ans[i]===q.a?'ok':'no')+'"><span>'+q.q+'</span><small>'+L[q.a]+'. '+q.o[q.a]+'</small></li>').join('')+'</ol>'+
        '<button type="button" class="wbtn" data-act="again">↺ Try again</button></div></div>';
      return;
    }
    const q=Q[s.i], a=s.ans[s.i], done=a!==undefined;
    el.innerHTML='<div class="qs-top"><span>Question '+(s.i+1)+' of '+Q.length+'</span><span class="qs-dots" aria-hidden="true">'+
      Q.map((x,i)=>'<i class="'+(i===s.i?'cur ':'')+(s.ans[i]===undefined?'':(s.ans[i]===x.a?'ok':'no'))+'"></i>').join('')+'</span></div>'+
      '<p class="q">'+q.q+'</p><div class="opts">'+q.o.map((o,i)=>'<button type="button" data-o="'+i+'" class="'+(done&&i===q.a?'right':'')+(done&&i===a&&i!==q.a?' wrong':'')+'"'+(done?' aria-disabled="true"':'')+'>'+L[i]+'. '+o+'</button>').join('')+'</div>'+
      '<p class="fb" aria-live="polite">'+(done?(a===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.why:'')+'</p>'+
      '<div class="qs-nav"><button type="button" class="wbtn" data-act="prev"'+(s.i?'':' disabled')+'>← Back</button><button type="button" class="wbtn pri" data-act="next"'+(done?'':' disabled')+'>'+(s.i===Q.length-1?'See score':'Next question')+' →</button></div>';
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.o!==undefined){ if(s.ans[s.i]!==undefined) return; s.ans[s.i]=+b.dataset.o; draw(); if(kb(e)) refocus(el,'[data-act=next]'); return; }
    const act=b.dataset.act;
    if(act==='next') s.i++; else if(act==='prev') s.i=Math.max(0,s.i-1); else if(act==='again'){s.i=0;s.ans=[];}
    draw(); if(kb(e)) refocus(el,s.i>=Q.length?'[data-act=again]':'.opts button');
  };
  draw();
}

/* Animated step-by-step process (Play / ← →) */
function wStep(el,cfg,s){
  const S=cfg.steps||[]; if(s.i===undefined) s.i=0;
  el.innerHTML='<ol class="st-row" style="--n:'+S.length+'">'+S.map((x,i)=>'<li><button type="button" data-i="'+i+'"><span class="st-no">'+(i+1)+'</span><span class="st-t">'+x.t+'</span>'+(x.en?'<span class="st-en">'+x.en+'</span>':'')+'</button></li>').join('')+'</ol>'+
    '<div class="st-bar" aria-hidden="true"><i></i></div><div class="st-panel" aria-live="polite"></div>'+
    '<div class="st-nav"><button type="button" class="wbtn" data-act="prev" aria-label="Previous step">←</button><button type="button" class="wbtn pri" data-act="play">▶ Play</button><button type="button" class="wbtn" data-act="next" aria-label="Next step">→</button></div>';
  let timer=null;
  const playBtn=el.querySelector('[data-act=play]');
  const show=()=>{
    el.querySelectorAll('.st-row button').forEach((b,i)=>{b.classList.toggle('on',i===s.i);b.classList.toggle('done',i<s.i);b.setAttribute('aria-current',i===s.i?'step':'false');});
    el.querySelector('.st-bar i').style.width=(S.length>1?s.i/(S.length-1)*100:100)+'%';
    const p=el.querySelector('.st-panel'), x=S[s.i];
    p.classList.remove('in'); void p.offsetWidth;
    p.innerHTML='<h4>'+(s.i+1)+'. '+x.t+(x.en?' <span class="st-en">'+x.en+'</span>':'')+'</h4><p>'+x.d+'</p>'+(x.ex?'<p class="st-ex">'+x.ex+'</p>':'');
    p.classList.add('in');
  };
  const stop=()=>{ if(timer){clearInterval(timer);timer=null;} playBtn.textContent='▶ Play'; };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.i!==undefined){ stop(); s.i=+b.dataset.i; show(); return; }
    const act=b.dataset.act;
    if(act==='prev'){ stop(); s.i=Math.max(0,s.i-1); show(); }
    else if(act==='next'){ stop(); s.i=Math.min(S.length-1,s.i+1); show(); }
    else if(act==='play'){
      if(timer){ stop(); return; }
      if(s.i>=S.length-1){ s.i=0; show(); }
      playBtn.textContent='❚❚ Pause';
      timer=setInterval(()=>{ if(!el.isConnected||s.i>=S.length-1){ stop(); return; } s.i++; show(); }, cfg.ms||2800);
      wTimers.push(timer);
    }
  };
  show();
}

/* Two-axis simulation: sliders (or click/drag) move a point across labelled zones */
function wGrid(el,cfg,s){
  const Z=cfg.zones||[], max=cfg.max||10;
  if(s.x===undefined){ s.x=(cfg.init||[max/2,max/2])[0]; s.y=(cfg.init||[max/2,max/2])[1]; }
  const W=320,H=320,PL=40,PB=40,PT=10,PR=10;
  const X=v=>PL+v/max*(W-PL-PR), Y=v=>H-PB-v/max*(H-PB-PT);
  const zoneOf=()=>Z.find(z=>s.x>=z.r[0]&&s.x<=z.r[1]&&s.y>=z.r[2]&&s.y<=z.r[3])||Z[Z.length-1];
  const rects=Z.slice().reverse().map(z=>{const v=z.v||z.r, x0=X(v[0]),x1=X(v[1]),y0=Y(v[3]),y1=Y(v[2]); /* v: optional visual rect */
    return '<g class="g2-z" data-z="'+z.k+'"><rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" class="'+(z.cls||'s-box')+'"/><text x="'+((x0+x1)/2)+'" y="'+((y0+y1)/2+4)+'" text-anchor="middle" class="s-t" style="font-size:'+Math.min(13,Math.max(8,(x1-x0-6)/(String(z.en).length*.6))).toFixed(1)+'px">'+z.en+'</text></g>';}).join('');
  el.innerHTML='<div class="g2"><div class="g2-fig"><svg class="g2-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(cfg.aria||'Interactive grid')+'">'+rects+
    '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" class="s-line"/><line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" class="s-line"/>'+
    '<text x="'+((PL+W-PR)/2)+'" y="'+(H-12)+'" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.x.label+' →</text>'+
    '<text transform="translate(16 '+((PT+H-PB)/2)+') rotate(-90)" text-anchor="middle" class="s-s" style="font-size:12px">'+cfg.y.label+' →</text>'+
    '<text x="'+PL+'" y="'+(H-PB+16)+'" class="s-s" style="font-size:10px">'+(cfg.x.lo||'rendah')+'</text><text x="'+(W-PR)+'" y="'+(H-PB+16)+'" text-anchor="end" class="s-s" style="font-size:10px">'+(cfg.x.hi||'tinggi')+'</text>'+
    '<circle class="g2-dot" r="11" cx="'+X(s.x)+'" cy="'+Y(s.y)+'"/></svg></div>'+
    '<div class="g2-side"><label class="g2-sl"><span>'+cfg.x.label+' <b data-v="x">'+s.x+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.x+'" data-ax="x" aria-label="'+cfg.x.label+'"></label>'+
    '<label class="g2-sl"><span>'+cfg.y.label+' <b data-v="y">'+s.y+'</b></span><input type="range" min="0" max="'+max+'" step="1" value="'+s.y+'" data-ax="y" aria-label="'+cfg.y.label+'"></label>'+
    '<div class="g2-out" aria-live="polite"></div></div></div>';
  const dot=el.querySelector('.g2-dot'), out=el.querySelector('.g2-out'); let last=null;
  const upd=()=>{
    dot.setAttribute('cx',X(s.x)); dot.setAttribute('cy',Y(s.y));
    el.querySelector('[data-v=x]').textContent=s.x; el.querySelector('[data-v=y]').textContent=s.y;
    el.querySelector('[data-ax=x]').value=s.x; el.querySelector('[data-ax=y]').value=s.y;
    const z=zoneOf(); el.querySelectorAll('.g2-z').forEach(g=>g.classList.toggle('on',g.dataset.z===z.k));
    if(last!==z.k){ last=z.k; out.classList.remove('in'); void out.offsetWidth;
      out.innerHTML='<div class="g2-name">'+z.name+(z.en?' <span>'+z.en+'</span>':'')+'</div>'+(z.tag?'<div class="g2-tag">'+z.tag+'</div>':'')+'<p>'+z.d+'</p>'+(z.ex?'<p class="g2-ex">'+z.ex+'</p>':'');
      out.classList.add('in'); }
  };
  el.oninput=e=>{const r=e.target.closest('input[type=range]'); if(!r) return; s[r.dataset.ax]=+r.value; upd();};
  const svg=el.querySelector('svg'); let drag=false;
  const fromPt=e=>{const m=svg.getScreenCTM(); if(!m) return; const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(m.inverse());
    s.x=Math.max(0,Math.min(max,Math.round((q.x-PL)/(W-PL-PR)*max))); s.y=Math.max(0,Math.min(max,Math.round((H-PB-q.y)/(H-PB-PT)*max))); upd();};
  svg.addEventListener('pointerdown',e=>{drag=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} fromPt(e);});
  svg.addEventListener('pointermove',e=>{if(drag) fromPt(e);});
  svg.addEventListener('pointerup',()=>{drag=false;}); svg.addEventListener('pointercancel',()=>{drag=false;});
  upd();
}

/* Branching scenario: choices lead to feedback and new situations */
function wScen(el,cfg,s){
  const N=cfg.nodes||{};
  if(!s.node){ s.node=cfg.start; s.path=[]; s.fb=null; }
  const draw=()=>{
    const n=N[s.node]; let h='';
    if(s.path.length) h+='<div class="sc-path" aria-label="Choices so far">'+s.path.map((p,i)=>'<span class="sc-tag '+(p.k||'')+'">'+(i+1)+'. '+p.tag+'</span>').join('')+'</div>';
    if(s.fb){
      h+='<div class="sc-fb '+(s.fb.k||'')+'"><div class="sc-fbh">'+(s.fb.k==='good'?'✔':s.fb.k==='bad'?'✖':'◐')+' '+s.fb.tag+'</div><p>'+s.fb.fb+'</p></div><div class="sc-nav"><button type="button" class="wbtn pri" data-act="go">Continue →</button></div>';
    } else {
      h+='<div class="sc-scene">'+(n.text?'<p class="sc-text">'+n.text+'</p>':'')+(n.say||[]).map(b=>'<div class="sc-say"><b>'+b[0]+'</b><span>'+b[1]+'</span></div>').join('')+'</div>';
      if(n.end) h+='<div class="sc-end '+(n.k||'')+'"><div class="sc-fbh">'+n.title+'</div><p>'+n.end+'</p></div><div class="sc-nav"><button type="button" class="wbtn" data-act="restart">↺ Start again</button></div>';
      else h+='<p class="sc-ask">'+(n.ask||cfg.ask||'')+'</p><div class="sc-ch">'+n.ch.map((c,i)=>'<button type="button" data-c="'+i+'">'+c.t+'</button>').join('')+'</div>';
    }
    el.innerHTML=h;
  };
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.c!==undefined){ const c=N[s.node].ch[+b.dataset.c]; s.fb={k:c.k,tag:c.tag,fb:c.fb,to:c.to}; s.path.push({tag:c.tag,k:c.k}); draw(); if(kb(e)) refocus(el,'[data-act=go]'); return; }
    if(b.dataset.act==='go'){ s.node=s.fb.to; s.fb=null; }
    else if(b.dataset.act==='restart'){ s.node=cfg.start; s.path=[]; s.fb=null; }
    draw(); if(kb(e)) refocus(el,'.sc-ch button,[data-act=restart]');
  };
  draw();
}

/* Peer assessment (formative): criteria x levels, comments, copyable summary.
   Draft is kept only in this browser (localStorage) and is never sent anywhere. */
function wPeer(el,cfg,s){
  const C=cfg.criteria||[], Lv=cfg.levels||['1','2','3','4'], K='peer:'+cfg.id, maxS=C.length*Lv.length;
  if(!s.v){ const d=store.get(K,null); s.v=d&&typeof d==='object'?d:{who:'',sc:{},good:'',tip:''}; if(!s.v.sc) s.v.sc={}; }
  const save=()=>store.set(K,s.v);
  const total=()=>C.reduce((a,c,i)=>a+(s.v.sc[i]||0),0);
  const filled=()=>C.filter((c,i)=>s.v.sc[i]).length;
  const band=t=>{const b=(cfg.bands||[]).slice().sort((x,y)=>y.min-x.min).find(x=>t>=x.min); return b?b.t:'';};
  const rowHTML=i=>{const c=C[i], v=s.v.sc[i]||0;
    return '<div class="pa-row" data-r="'+i+'"><div class="pa-c"><b>'+c.t+'</b>'+(c.ind?'<small>'+c.ind+'</small>':'')+'</div><div class="pa-lv" role="group" aria-label="'+c.t.replace(/<[^>]+>/g,'')+'">'+
      Lv.map((l,j)=>'<button type="button" data-r="'+i+'" data-l="'+(j+1)+'" aria-pressed="'+(v===j+1)+'" title="'+l+'">'+(j+1)+'</button>').join('')+
      '</div><div class="pa-d">'+(v?'<b>'+Lv[v-1]+':</b> '+c.d[v-1]:'<span class="muted">'+(cfg.pick||'Pick a level.')+'</span>')+'</div></div>';};
  const sumHTML=()=>{const t=total(), f=filled();
    return '<div class="pa-total"><span><b>'+t+'</b> / '+maxS+'</span><div class="pa-meter"><i style="width:'+(t/maxS*100)+'%"></i></div></div><div class="pa-band">'+(f===C.length?band(t):(f+' of '+C.length+' criteria rated'))+'</div>';};
  el.innerHTML='<div class="pa"><div class="pa-grid">'+C.map((c,i)=>rowHTML(i)).join('')+'</div>'+
    '<div class="pa-side"><label class="pa-f"><span>'+(cfg.whoLabel||'Peer')+'</span><input type="text" data-f="who" maxlength="80" value="'+String(s.v.who).replace(/"/g,'&quot;')+'" placeholder="'+(cfg.whoPh||'')+'"></label>'+
    '<label class="pa-f"><span>'+(cfg.goodLabel||'What went well')+'</span><textarea data-f="good" rows="2" maxlength="400" placeholder="'+(cfg.goodPh||'')+'"></textarea></label>'+
    '<label class="pa-f"><span>'+(cfg.tipLabel||'Suggestion')+'</span><textarea data-f="tip" rows="2" maxlength="400" placeholder="'+(cfg.tipPh||'')+'"></textarea></label>'+
    '<div class="pa-sum" aria-live="polite">'+sumHTML()+'</div>'+
    '<div class="pa-act"><button type="button" class="wbtn pri" data-act="copy">Copy summary</button><button type="button" class="wbtn" data-act="clear">Clear</button><span class="pa-msg" aria-live="polite"></span></div></div></div>';
  el.querySelector('[data-f=good]').value=s.v.good||''; el.querySelector('[data-f=tip]').value=s.v.tip||'';
  const msg=t=>{const m=el.querySelector('.pa-msg'); m.textContent=t; setTimeout(()=>{if(m.textContent===t)m.textContent='';},2500);};
  el.oninput=e=>{const f=e.target.dataset&&e.target.dataset.f; if(!f) return; s.v[f]=e.target.value; save();};
  const plain=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
  const text=()=>[plain(cfg.title||'Peer assessment'),(cfg.whoLabel||'Peer')+': '+(s.v.who||'-')]
    .concat(C.map((c,i)=>'- '+plain(c.t)+': '+(s.v.sc[i]?s.v.sc[i]+' ('+Lv[s.v.sc[i]-1]+')':'-')))
    .concat(['Total: '+total()+' / '+maxS+(filled()===C.length?' · '+plain(band(total())):''),(cfg.goodLabel||'What went well')+': '+(s.v.good||'-'),(cfg.tipLabel||'Suggestion')+': '+(s.v.tip||'-')]).join('\n');
  const copy=()=>{const t=text();
    const fallback=()=>{const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      let ok=false; try{ok=document.execCommand('copy');}catch(_){} ta.remove(); msg(ok?'Copied.':'Copy failed. Select the text manually.');};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>msg('Copied.'),fallback); else fallback();};
  el.onclick=e=>{const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.l){ const i=+b.dataset.r; s.v.sc[i]=+b.dataset.l; save();
      const r=el.querySelector('.pa-row[data-r="'+i+'"]'); r.outerHTML=rowHTML(i); el.querySelector('.pa-sum').innerHTML=sumHTML();
      if(kb(e)) refocus(el,'.pa-row[data-r="'+i+'"] [data-l="'+b.dataset.l+'"]'); return; }
    if(b.dataset.act==='copy') copy();
    else if(b.dataset.act==='clear'){ s.v={who:'',sc:{},good:'',tip:''}; save(); wPeer(el,cfg,s); msg('Cleared.'); }
  };
}

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();

</script>
