--primary);stroke-width:4.575\"/><line x1=\"807.9\" y1=\"108\" x2=\"807.9\" y2=\"152.7\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"818.1\" y1=\"108\" x2=\"818.1\" y2=\"146\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"828.3\" y1=\"108\" x2=\"828.3\" y2=\"130.1\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"838.4\" y1=\"108\" x2=\"838.4\" y2=\"110.6\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"848.6\" y1=\"108\" x2=\"848.6\" y2=\"89.6\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"858.8\" y1=\"108\" x2=\"858.8\" y2=\"71.2\" style=\"stroke:var(--primary);stroke-width:4.575\"/><line x1=\"868.9\" y1=\"108\" x2=\"868.9\" y2=\"65.7\" style=\"stroke:var(--primary);stroke-width:4.575\"/><text x=\"635.1\" y=\"188\" text-anchor=\"middle\" class=\"s-s\">1</text><text x=\"746.9\" y=\"188\" text-anchor=\"middle\" class=\"s-s\">12</text><text x=\"868.9\" y=\"188\" text-anchor=\"middle\" class=\"s-s\">24</text></svg><figcaption>ACF tiga seri ilustrasi (T = 120; batas ±0,18). Data ilustrasi.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.4em\"><div class=\"card\"><p><b>A</b> · Penjualan toko daring yang tumbuh terus tanpa musiman.</p></div><div class=\"card\"><p><b>B</b> · Kunjungan wisata bulanan yang selalu ramai di bulan yang sama.</p></div><div class=\"card\"><p><b>C</b> · Residual model yang sudah baik (acak).</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 20 menit</span></div><h2>Bentuk kelompok, pilih kasus</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 3–4 orang. Peran awal:</p><ul><li>Koordinator dan penghubung mitra</li><li>Pengelola data (pengumpulan, pembersihan)</li><li>Analis/pemodel (notebook)</li><li>Penulis laporan dan visualisasi</li></ul><p class=\"muted\">Peran boleh bergilir; semua anggota harus mampu menjelaskan seluruh notebook.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria kasus yang baik</h3><ul><li>Data runtun waktu <b>nyata</b>: UMKM, perguruan tinggi, dinas/layanan publik, rumah sakit, pesantren/lembaga NU, atau data terbuka (mis. BPS).</li><li>Panjang data cukup: minimal <b>36 bulan</b> untuk data bulanan, atau <b>2 tahun</b> untuk data harian/mingguan.</li><li>Ada keputusan nyata yang didukung ramalan.</li><li>Izin pemakaian jelas; data pribadi dianonimkan <span class=\"cite\">(UU No. 27 Tahun 2022)</span>.</li></ul><p class=\"muted\" style=\"font-size:.8em\">Syarat panjang data: definisi kerja mata kuliah ini.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Proyek peramalan kelompok: tahap awal</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/></svg>P2–3 · 10%</h3><p>Notebook eksplorasi dan persiapan data: grafik, ACF/PACF, penanganan data hilang dan outlier, penyesuaian, transformasi.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m22 7-8.5 8.5-5-5L2 17\"/><path d=\"M16 7h6v6\"/></svg>P4–5 · 10%</h3><p>Model benchmark (mean, naive, seasonal naive, drift), dekomposisi, dan ETS.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9M13 17V5M8 17v-3\"/></svg>P6–7 · 10%</h3><p>Evaluasi akurasi dan validasi silang, pemilihan model, laporan, presentasi di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai data yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Data runtun waktu berurutan dan berinterval teratur; frekuensi menentukan periode musiman.</li><li>Tiga pola: <b>trend</b>, <b>seasonal</b> (periode tetap), <b>cyclic</b> (tidak tetap, ≥ 2 tahun); sisanya <b>remainder/noise</b>.</li><li>Selalu mulai dengan <b>time plot</b>; <b>seasonal plot</b> memperlihatkan musiman dan efek hari libur bergerak seperti Idulfitri.</li><li><b>ACF</b>: tren → turun perlahan; musiman → puncak di lag musiman. <b>PACF</b>: korelasi setelah lag antara dihilangkan.</li><li><b>White noise</b>: ±95% batang ACF di dalam ±1,96/√T.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Fluktuasi tanpa frekuensi tetap, biasanya ≥ 2 tahun, adalah siklus.\"><p class=\"q\">Harga komoditas naik-turun dengan jarak 3 sampai 7 tahun yang tidak tetap. Pola ini disebut…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. trend</button><button type=\"button\" data-o=\"b\">B. seasonal</button><button type=\"button\" data-o=\"c\">C. cyclic</button><button type=\"button\" data-o=\"d\">D. white noise</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Pada data bertren, observasi berdekatan bernilai mirip sehingga ACF lag kecil besar dan turun perlahan.\"><p class=\"q\">ACF data bulanan bernilai positif besar di lag awal dan turun sangat perlahan. Ini menandakan…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. data bertren</button><button type=\"button\" data-o=\"b\">B. data white noise</button><button type=\"button\" data-o=\"c\">C. data hanya musiman</button><button type=\"button\" data-o=\"d\">D. data hilang</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"1,96/√100 = 0,196.\"><p class=\"q\">Seri dengan T = 100. Batas ACF untuk white noise kira-kira…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. ±0,01</button><button type=\"button\" data-o=\"b\">B. ±0,05</button><button type=\"button\" data-o=\"c\">C. ±0,196</button><button type=\"button\" data-o=\"d\">D. ±1,96</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 3×60 menit · Penugasan terstruktur 3×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab 2 Hyndman &amp; Athanasopoulos (2021) atau versi Python (Hyndman et al., 2025): grafik runtun waktu, autokorelasi, white noise. Persiapan Pertemuan 3: §3.1 <i>Transformations and adjustments</i>.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan kasus, sumber data, dan izin pemakaian.</li><li>Ubah data ke format <code>unique_id, ds, y</code> dengan frekuensi yang jelas.</li><li>Buat time plot, seasonal plot, lag plot, ACF, dan PACF; tulis interpretasi tiap grafik.</li><li>Catat masalah data: tanggal hilang, nilai aneh, perubahan sistem pencatatan, hari libur.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa notebook dan daftar masalah data ke Pertemuan 3 untuk dibersihkan bersama.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Time series</span></dt><dd>Rangkaian observasi yang dicatat berurutan menurut waktu dengan interval teratur (harian, mingguan, bulanan). <i>(runtun waktu / deret waktu)</i></dd></div><div><dt><span class=\"en\">Frequency</span></dt><dd>Interval pencatatan data runtun waktu: harian, mingguan, bulanan, kuartalan, tahunan. <i>(frekuensi)</i></dd></div><div><dt><span class=\"en\">Trend</span></dt><dd>Kenaikan atau penurunan jangka panjang pada data; tidak harus linear. <i>(tren)</i></dd></div><div><dt><span class=\"en\">Seasonality</span></dt><dd>Pola berulang karena faktor musiman (bulan, hari dalam minggu) dengan periode yang tetap dan diketahui. <i>(musiman)</i></dd></div><div><dt><span class=\"en\">Cycle</span></dt><dd>Naik-turun tanpa periode tetap, biasanya terkait siklus ekonomi dan berlangsung ≥ 2 tahun. <i>(siklus)</i></dd></div><div><dt><span class=\"en\">Remainder</span></dt><dd>Sisa data setelah komponen tren-siklus dan musiman dikeluarkan; sering disebut noise. <i>(sisa / galat acak)</i></dd></div><div><dt><span class=\"en\">Time plot</span></dt><dd>Grafik garis nilai observasi terhadap waktu; langkah pertama eksplorasi. <i>(plot waktu)</i></dd></div><div><dt><span class=\"en\">Seasonal plot</span></dt><dd>Grafik tiap musim (mis. tiap tahun) ditumpuk pada sumbu bulan agar pola musiman mudah dibandingkan. <i>(plot musiman)</i></dd></div><div><dt><span class=\"en\">Lag plot</span></dt><dd>Diagram pencar y(t) terhadap y(t−k) untuk melihat hubungan data dengan nilai sebelumnya. <i>(plot lag)</i></dd></div><div><dt><span class=\"en\">Autocorrelation</span></dt><dd>Korelasi antara data runtun waktu dengan nilai-nilai lag-nya sendiri. <i>(autokorelasi)</i></dd></div><div><dt><span class=\"en\">ACF</span></dt><dd>Autocorrelation function: himpunan koefisien autokorelasi r1, r2, … yang digambar sebagai korelogram. <i>(fungsi autokorelasi)</i></dd></div><div><dt><span class=\"en\">PACF</span></dt><dd>Partial autocorrelation function: korelasi y(t) dan y(t−k) setelah pengaruh lag 1 s.d. k−1 dihilangkan. <i>(fungsi autokorelasi parsial)</i></dd></div><div><dt><span class=\"en\">White noise</span></dt><dd>Runtun waktu tanpa autokorelasi; nilainya acak dan tidak dapat diramal dari masa lalu. <i>(derau putih)</i></dd></div><div><dt><span class=\"en\">Moving holiday</span></dt><dd>Hari libur yang tanggal Masehinya bergeser tiap tahun, mis. Idulfitri (maju ± 11 hari per tahun). <i>(hari libur bergerak)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Hyndman, R. J., &amp; Athanasopoulos, G. (2021). <i>Forecasting: Principles and practice</i> (3rd ed.). OTexts. https://otexts.com/fpp3/</li><li>Hyndman, R. J., Athanasopoulos, G., Garza, A., Challu, C., Mergenthaler, M., &amp; Olivares, K. G. (2025). <i>Forecasting: Principles and practice, the Pythonic way</i>. OTexts. https://otexts.com/fpppy/</li><li>Montgomery, D. C., Jennings, C. L., &amp; Kulahci, M. (2015). <i>Introduction to time series analysis and forecasting</i> (2nd ed.). John Wiley &amp; Sons.</li><li>McKinney, W. (2010). Data structures for statistical computing in Python. Dalam <i>Proceedings of the 9th Python in Science Conference</i> (hlm. 56–61).</li><li>Seabold, S., &amp; Perktold, J. (2010). Statsmodels: Econometric and statistical modeling with Python. Dalam <i>Proceed /* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    v.innerHTML='<div class="stage" id="stage"><section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section></div>'+
      '<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();




</script>
